name: CI and deploy

# One pipeline, in order: the checks, then the two production images and the
# rollout. Deploy used to be its own `on: push` workflow racing this one, which
# is how a commit with a failing check still reached production. `needs` is the
# gate now: a red check builds no image.
#
# It runs on a merge to main and on nothing else. There is no `pull_request`
# trigger: every commit already passes the local gates (fmt, clippy, the test
# suites, semgrep, gitleaks) before it is made, so a run per PR push repeated
# that work — a cold Rust build inside Docker, twice — and then the merge ran
# it all a third time on the identical tree. The gate is the merge: a red main
# deploys nothing and is fixed forward. Releases are release.yml, on tags.

on:
  push:
    branches: [main]
  # A deploy you can re-run by hand, for when main is ahead of production and
  # no push is coming (a deploy failed on a registry blip; billing lapsed). The
  # filter below reads what production is running, so a dispatch rebuilds and
  # rolls exactly the tiers that are behind, at whatever main currently is.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/zechcodes

# Every job below names a concurrency group, and none of them is the workflow's.
# A merge that lands while the previous merge is still checking cancels that
# run's checks and image builds — nothing built from the older tree was ever
# going to deploy — and the older run's rollouts, seeing no image, skip. A
# rollout already under way is the one thing that is NOT cancelled: its
# `cancel-in-progress` is false, so a `kubectl apply` is never interrupted and
# the newer rollout queues behind it. One workflow-level group would have
# cancelled the rollout along with the rest.

jobs:
  # Which tiers production is behind on. Everything below is gated on this,
  # for one reason that matters more than the wasted minutes: the deploy step
  # re-pins BOTH manifests to the new commit SHA, and the relay's Deployment is
  # `strategy: Recreate` (a single in-memory broker — see deploy/k8s/relay.yaml).
  # So an unfiltered rollout tore down every device and browser WebSocket to
  # ship a stylesheet, which is exactly what splitting the relay out as the
  # stable tier was supposed to prevent.
  changes:
    name: What changed
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-changes
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      relay: ${{ steps.filter.outputs.relay }}
      bridge: ${{ steps.filter.outputs.bridge }}
      e2e: ${{ steps.filter.outputs.e2e }}
      desktop: ${{ steps.filter.outputs.desktop }}
      scripts: ${{ steps.filter.outputs.scripts }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # The tiers are judged against what production is RUNNING, not against
      # the previous push: each Deployment's image tag is the commit it was
      # built from (deploy-app / deploy-relay pin it below). That is what makes
      # cancelling a superseded run safe — its commits are still owed, and the
      # next run sees them — and what lets a dispatch roll only what is behind.
      # Anything unreadable here reads as "unknown", which the script treats as
      # moved: a redundant deploy, never a skipped one.
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save production-hosting

      - name: The tier filter does what it promises
        run: .github/test-changed-tiers.sh

      - id: filter
        run: |
          set -euo pipefail
          image_of() {
            kubectl -n 8ly get "deployment/$1" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true
          }
          APP_IMAGE="$(image_of build-app)" RELAY_IMAGE="$(image_of build-relay)" \
            .github/changed-tiers.sh | tee -a "$GITHUB_OUTPUT"

  bridge:
    name: Rust bridge
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-bridge
      cancel-in-progress: true
    needs: [changes]
    # Every bridge change, not only the relay's sources: the relay tier moves
    # only when the relay image would differ (.github/relay-sources), and a
    # bridge-only change still has to pass these.
    if: ${{ needs.changes.outputs.bridge == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
            bridge/vendor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.lock', 'bridge/vendor/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      # The patched webrtc and rtc the bridge builds from bridge/vendor/ (#166,
      # #179). The steps above stop at the bridge's own package, so webrtc's
      # unit tests, the driver tests among them, run on the patched rtc from
      # the vendored crates' own workspace (bridge/vendor/README.md).
      - name: Vendored webrtc
        run: cargo test --locked --manifest-path vendor/Cargo.toml --lib

  interop:
    name: Crypto interop (Rust ↔ Python)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-interop
      cancel-in-progress: true
    needs: [changes]
    if: ${{ needs.changes.outputs.bridge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Clone build-secure-transport reference
        run: git clone --depth 1 https://github.com/ZechCodes/build-secure-transport.git /tmp/bst
      - name: Live cross-language round-trip
        working-directory: bridge
        env:
          BUILD_SECURE_TRANSPORT_PY: /tmp/bst/python
        run: cargo test --test interop_python -- --nocapture

  web-e2e:
    name: Browser client end-to-end
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-web-e2e
      cancel-in-progress: true
    needs: [changes]
    # Exercises the whole stack, so it runs for the app, the relay or any
    # bridge change (and for its own harness) — but not for a docs- or
    # workflow-only push, which ships nothing.
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # e2e.mjs speaks the auth-era protocol (dummy-login → gateway token →
      # relay /ws/client), so it needs the real stack, not the bare dev relay.
      - name: Build + start the real stack (app, relay, bridge)
        run: docker compose -f deploy/compose.real.yml up -d --build --wait
      - name: Pair the QA bridge and run the E2EE round-trip + lifecycle suite
        run: docker compose -f deploy/compose.real.yml --profile qa run --rm qa
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose.real.yml logs --tail 150

  # The app tier owns its client gate. The update wiring test also builds one
  # Rust RPC probe so the browser checks a real bridge frame; it does not depend
  # on the separate relay, interoperability, or full-stack jobs.
  spa:
    name: Web client unit tests
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-spa
      cancel-in-progress: true
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The update wiring test takes its frames from the real Rust RPC handler.
      - name: Install Rust for the bridge-to-browser wiring test
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Cache the bridge wiring probe
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # No `cache: npm`. It keys on a lockfile, and spa/package-lock.json is
          # deliberately gitignored (.gitignore) — `@build/secure-transport` is a
          # file: dep whose resolved path is machine-specific, so the lock is not
          # shareable. setup-node fails hard rather than skipping when its cache
          # key cannot be resolved.
      # `@build/secure-transport` is `file:../../build-secure-transport/js` — a
      # SIBLING of the repo root, the same convention skriftapp/Containerfile
      # satisfies by cloning it next to the source. npm resolves the path at
      # install time, so it has to exist on disk before the install runs.
      - name: Clone build-secure-transport beside the checkout
        run: |
          git clone --depth 1 https://github.com/ZechCodes/build-secure-transport.git \
            "${{ github.workspace }}/../build-secure-transport"
          npm install --no-audit --no-fund \
            --prefix "${{ github.workspace }}/../build-secure-transport/js"
      - name: Install
        working-directory: spa
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # The complexity gate (CLAUDE.md "Complexity gates"). It runs BEFORE the
      # suite: a function past the cap is a review finding, and a two-second
      # answer beats waiting out 2,500 tests to hear it.
      - name: eslint
        working-directory: spa
        run: npm run lint
      # The layout checks measure in Liberation (spa/test/browser/fonts.conf).
      # Chrome's package pulls it in on the runner image; install it if a
      # future image drops it, rather than measuring in a silent fallback.
      - name: Fonts the layout checks measure in
        run: |
          if ! fc-list -q "Liberation Sans" || ! fc-list -q "Liberation Mono"; then
            sudo apt-get update && sudo apt-get install -y fonts-liberation
          fi
      - name: vitest
        working-directory: spa
        run: npx vitest run
      # Serial review captures assert current UI behavior without extending
      # npm test or writing over the tracked design screenshots.
      - name: Inbox captures
        working-directory: spa
        run: nice -n 10 npm run test:captures

  # The landing page's own gate. `npm test` BUILDS the Astro document and then
  # reads it back (landing/test/), so this job is both the build proof and the
  # page's contract — a page that no longer compiles cannot reach the app image.
  # Gated on `app` like `spa`: skriftapp/Containerfile builds landing/ into the
  # same image, which is why `landing/` is one of the app tier's paths.
  landing:
    name: Landing page tests
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-landing
      cancel-in-progress: true
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro and the test runner both need node 22+. Unlike spa/, this
          # project has no file: dependencies, so its lockfile is committed and
          # the npm cache can key on it.
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test

  # scripts/install.sh is published verbatim as a release asset and piped into
  # `sh` on a stranger's machine, so it is checked as POSIX sh — the shell it
  # actually runs under — and not as the bash a developer happens to test with,
  # and then run against a mirror on disk so the rules it exists for are
  # exercised and not merely parsed. The release workflow runs both of these
  # lines, verbatim, before it packages the script.
  # shellcheck itself is the `shell` job's (every *.sh in the tree, one home);
  # this job is install.sh's behaviour, which only its own harness can check.
  scripts:
    name: Installer behaviour
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-scripts
      cancel-in-progress: true
    needs: [changes]
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install ZIP-capable tar for macOS installer fixtures
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: install.sh behaviour
        run: scripts/test-install.sh
      - name: Desktop installer behaviour
        run: scripts/test-install-desktop.sh
  # The API tier's own gate, the mirror of `spa` above: ruff (correctness plus
  # the C901 complexity cap) and the pytest suite. The app image ships spa/ AND
  # skriftapp/ together, so both halves have to be green before it builds — the
  # Python half had no CI job at all until now.
  skriftapp:
    name: Python API tests
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-skriftapp
      cancel-in-progress: true
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skriftapp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install
        run: uv sync --frozen
      - name: ruff
        run: uv run --frozen ruff check buildapp
      - name: pytest
        run: uv run --frozen pytest buildapp -q

  # Every tracked shell script in the repo, wherever it lives — the container
  # entrypoints today, scripts/install.sh the moment it lands. Listing the files
  # from git rather than naming one directory is what keeps this a single job
  # that no later branch has to add a second copy of. Each script's own shebang
  # picks the dialect, so a POSIX install.sh is checked as sh.
  shell:
    name: Shell scripts
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-shell
      cancel-in-progress: true
    needs: [changes]
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # shellcheck is preinstalled on ubuntu runners; locally, `brew install
      # shellcheck`.
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck

  desktop:
    name: Desktop client (${{ matrix.os }})
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-desktop-${{ matrix.os }}
      cancel-in-progress: true
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build an unsigned local application
        working-directory: .
        run: node scripts/build-desktop.mjs --dir
      - name: Test
        run: npm test

  secrets:
    name: Secret scan
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-secrets
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid license for org accounts;
      # the CLI does not, so run the pinned binary directly.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # Scan this branch's history only: gitleaks defaults to --all, which
          # drags in the archived v1 branch (minified libsodium false positives).
          ./gitleaks git --no-banner --redact --verbose --log-opts="--full-history HEAD" .

  # ---- production rollout ----
  #
  # Each image job builds only when its tier moved, and no check above may have
  # failed. The conditions spell that out rather than leaning on the default
  # `success()`, because a gated check that was SKIPPED must not read as a
  # failure — while a real failure must still build nothing. `secrets` is
  # ungated, so it is the one that has to have actually succeeded.

  # Gated on the app's OWN checks, and on the Rust checks only while a bridge
  # change is owed. Bridge-only merges deploy nothing, so the app's tag is what
  # changed-tiers.sh judges owed bridge checks from: shipping the app past a
  # bridge commit whose `bridge` or `interop` run was cancelled or red would
  # forgive it (#251). Both are skipped at once when no bridge change is owed,
  # so a stylesheet does not wait on them. `web-e2e` is deliberately NOT a
  # need: it runs on every app push anyway (the stack at HEAD, bridge
  # included), so nothing it covers is forgiven, and a need is waited for even
  # when its result is not read — every stylesheet would sit ~10 minutes.
  build-app:
    name: build-app image (skriftapp)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-app
      cancel-in-progress: true
    needs: [changes, spa, landing, skriftapp, scripts, shell, bridge, interop, secrets]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs.changes.outputs.app == 'true'
          && (needs.changes.outputs.bridge != 'true'
              || (needs.bridge.result == 'success'
                  && needs.interop.result == 'success'))
          && needs.spa.result == 'success'
          && needs.landing.result == 'success'
          && needs.skriftapp.result == 'success'
          && (needs.scripts.result == 'success' || needs.scripts.result == 'skipped')
          && (needs.shell.result == 'success' || needs.shell.result == 'skipped')
          && needs.secrets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Repo-root context: the SPA lives at spa/ beside skriftapp/ and is
          # built in-image (see skriftapp/Containerfile).
          context: .
          file: skriftapp/Containerfile
          build-args: |
            VITE_RELAY_URL=wss://relay.getbuild.ing
            VITE_BUILD_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/build-app:latest
            ${{ env.REGISTRY }}/build-app:${{ github.sha }}

  build-relay:
    name: build-relay image (bridge relay bin)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-relay
      cancel-in-progress: true
    needs: [changes, bridge, interop, web-e2e, secrets]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs.changes.outputs.relay == 'true'
          && needs.bridge.result == 'success'
          && needs.interop.result == 'success'
          && needs['web-e2e'].result == 'success'
          && needs.secrets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: bridge
          file: bridge/Containerfile
          target: relay
          push: true
          tags: |
            ${{ env.REGISTRY }}/build-relay:latest
            ${{ env.REGISTRY }}/build-relay:${{ github.sha }}

  # One rollout job per tier, not one job holding both. A single deploy job has
  # to wait for BOTH image jobs before it starts, so the app — whose image is
  # ready in ~3 min — sat waiting on a relay build it shares nothing with. Split,
  # the web client ships as soon as its own image exists.
  #
  # Each still applies its manifest ONLY when its image job actually succeeded.
  # Applying a manifest whose image was never built pins the Deployment to a
  # :SHA tag that is not in the registry — an ImagePullBackOff in production,
  # and for the relay a Recreate that never comes back. The gate is the image
  # job's own result, NOT "did this tier change": `changes.outputs.app` only says
  # the tier moved, and the image job can still be SKIPPED by a red check above
  # it. On 2026-07-29 those two facts took getbuild.ing down — web-e2e went red,
  # build-app was skipped, the roll applied `:<sha>` anyway, and the rollout
  # replaced a serving pod with one that could not pull.
  deploy-app:
    name: Deploy the app (ns 8ly)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy-app
      cancel-in-progress: false
    needs: [changes, build-app]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs['build-app'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save production-hosting

      # Migrate first, from the new image, and roll only if that succeeded: the
      # Deployment is RollingUpdate, so the old pod keeps serving on the new
      # schema until the new one is ready. deploy/OPS.md ("Deploying the app")
      # carries this same sequence for a deploy by hand; change both together.
      - name: Migrate (build-app-migrate Job)
        run: |
          set -euo pipefail
          k() { kubectl -n 8ly "$@"; }
          k delete job build-app-migrate --ignore-not-found --cascade=foreground --wait=true
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/migrate.yaml | k apply -f -
          state=""
          for _ in $(seq 1 120); do # 120 × 5 s: the Job's own 600 s deadline
            state="$(k get job build-app-migrate \
              -o jsonpath='{range .status.conditions[?(@.status=="True")]}{.type} {end}' || true)"
            case "$state" in *Complete*|*Failed*) break ;; esac
            sleep 5
          done
          k logs -l job-name=build-app-migrate --all-containers --prefix || true
          case "$state" in
            *Complete*) echo "migrations applied" ;;
            *) echo "migration Job did not complete (${state:-timed out}); not rolling" >&2; exit 1 ;;
          esac

      - name: Roll the app (spa + skriftapp)
        run: |
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/app.yaml | kubectl -n 8ly apply -f -
          kubectl -n 8ly rollout status deployment/build-app --timeout=300s

      - name: Verify the app is serving
        # The ingress needs a moment to switch endpoints after the rollout.
        run: |
          verify() {
            curl -sf -o /dev/null https://getbuild.ing/healthz &&
            curl -sf https://getbuild.ing/ | grep -q "Build: know what your coding agents need from you" &&
            curl -sf -o /dev/null https://getbuild.ing/landing/generated/waitlist-boot.js &&
            curl -sf -o /dev/null https://getbuild.ing/landing/assets/devices/laptop-low.glb &&
            curl -sf -o /dev/null https://getbuild.ing/landing/assets/devices/scene-01-desktop.webp &&
            curl -sf -o /dev/null https://getbuild.ing/landing/assets/screens/ui10-editor-macbook.webp &&
            curl -sf -o /dev/null https://getbuild.ing/docs &&
            curl -sf -o /dev/null https://getbuild.ing/privacy
          }
          for _ in $(seq 1 12); do verify && exit 0; sleep 5; done
          verify

  deploy-relay:
    name: Deploy the relay (ns 8ly)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy-relay
      cancel-in-progress: false
    needs: [changes, build-relay]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs['build-relay'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save production-hosting

      - name: Roll the relay (bridge)
        run: |
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/relay.yaml | kubectl -n 8ly apply -f -
          kubectl -n 8ly rollout status deployment/build-relay --timeout=300s

      - name: Verify the relay is serving
        run: |
          for _ in $(seq 1 12); do
            curl -sf -o /dev/null https://relay.getbuild.ing/health && exit 0
            sleep 5
          done
          curl -sf -o /dev/null https://relay.getbuild.ing/health
