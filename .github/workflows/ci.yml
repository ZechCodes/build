name: CI and deploy

# One pipeline, in order: the checks, then — on a push to main only — the two
# production images and the rollout. Deploy used to be its own `on: push`
# workflow racing this one, which is how a commit with a failing check still
# reached production. `needs` is the gate now: a red check builds no image.

on:
  push:
    branches: [main]
  pull_request:
  # A deploy you can re-run by hand. The path filter below scopes a PUSH to the
  # tiers that push touched — correct, until a deploy fails for a reason outside
  # the diff (a red check, a registry blip) and the fix lands in a commit that
  # touches neither tier. Then main is ahead of production with nothing left to
  # trigger a rollout. A dispatch takes the `files="ALL"` branch, so it rebuilds
  # and rolls both tiers at whatever main currently is.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/zechcodes

jobs:
  # Which tier this push actually touched. Everything below is gated on this,
  # for one reason that matters more than the wasted minutes: the deploy step
  # re-pins BOTH manifests to the new commit SHA, and the relay's Deployment is
  # `strategy: Recreate` (a single in-memory broker — see deploy/k8s/relay.yaml).
  # So an unfiltered rollout tore down every device and browser WebSocket to
  # ship a stylesheet, which is exactly what splitting the relay out as the
  # stable tier was supposed to prevent.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      relay: ${{ steps.filter.outputs.relay }}
      e2e: ${{ steps.filter.outputs.e2e }}
      desktop: ${{ steps.filter.outputs.desktop }}
      scripts: ${{ steps.filter.outputs.scripts }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Anything we cannot diff with confidence counts as "everything moved",
          # so the failure mode is a redundant deploy and never a skipped one:
          # a pull_request run (which never deploys anyway), a branch's first
          # push, or a force push whose old head is already gone.
          if [ "$EVENT" != "push" ] || [ -z "${BEFORE:-}" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="ALL"
          else
            files="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          touched() {
            [ "$files" = "ALL" ] && return 0
            printf '%s\n' "$files" | grep -Eq "$1"
          }
          touched '^(spa|skriftapp)/|^deploy/k8s/app\.yaml$' && app=true || app=false
          touched '^bridge/|^deploy/k8s/relay\.yaml$' && relay=true || relay=false
          touched '^desktop/' && desktop=true || desktop=false
          touched '^scripts/' && scripts=true || scripts=false
          touched '\.sh$' && shell=true || shell=false
          # The end-to-end job also has to run when the harness itself moves —
          # the QA client under web/ or the compose stack it drives — or a
          # change to the test would skip the test.
          if [ "$app" = true ] || [ "$relay" = true ] \
             || touched '^web/|^deploy/compose\.real\.yml$'; then e2e=true; else e2e=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "relay=$relay" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "app=$app relay=$relay e2e=$e2e desktop=$desktop scripts=$scripts"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "app=$app relay=$relay e2e=$e2e desktop=$desktop shell=$shell"

  bridge:
    name: Rust bridge
    needs: [changes]
    if: ${{ needs.changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  interop:
    name: Crypto interop (Rust ↔ Python)
    needs: [changes]
    if: ${{ needs.changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Clone build-secure-transport reference
        run: git clone --depth 1 https://github.com/ZechCodes/build-secure-transport.git /tmp/bst
      - name: Live cross-language round-trip
        working-directory: bridge
        env:
          BUILD_SECURE_TRANSPORT_PY: /tmp/bst/python
        run: cargo test --test interop_python -- --nocapture

  web-e2e:
    name: Browser client end-to-end
    needs: [changes]
    # Exercises the whole stack, so it runs for either tier (and for its own
    # harness) — but not for a docs- or workflow-only push, which ships nothing.
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # e2e.mjs speaks the auth-era protocol (dummy-login → gateway token →
      # relay /ws/client), so it needs the real stack, not the bare dev relay.
      - name: Build + start the real stack (app, relay, bridge)
        run: docker compose -f deploy/compose.real.yml up -d --build --wait
      - name: Pair the QA bridge and run the E2EE round-trip + lifecycle suite
        run: docker compose -f deploy/compose.real.yml --profile qa run --rm qa
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose.real.yml logs --tail 150

  # The app tier's own gate, and the reason it no longer waits on Rust. The web
  # client had NO unit job here at all: its 800+ vitest tests ran only on a
  # developer's machine, while its deploy was gated on a bridge compile that
  # cannot fail because of anything in spa/. This inverts that — fast checks on
  # the tier that changed, heavy ones on the tier that needs them.
  spa:
    name: Web client unit tests
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # No `cache: npm`. It keys on a lockfile, and spa/package-lock.json is
          # deliberately gitignored (.gitignore) — `@build/secure-transport` is a
          # file: dep whose resolved path is machine-specific, so the lock is not
          # shareable. setup-node fails hard rather than skipping when its cache
          # key cannot be resolved.
      # `@build/secure-transport` is `file:../../build-secure-transport/js` — a
      # SIBLING of the repo root, the same convention skriftapp/Containerfile
      # satisfies by cloning it next to the source. npm resolves the path at
      # install time, so it has to exist on disk before the install runs.
      - name: Clone build-secure-transport beside the checkout
        run: |
          git clone --depth 1 https://github.com/ZechCodes/build-secure-transport.git \
            "${{ github.workspace }}/../build-secure-transport"
          npm install --no-audit --no-fund \
            --prefix "${{ github.workspace }}/../build-secure-transport/js"
      - name: Install
        working-directory: spa
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # The complexity gate (CLAUDE.md "Complexity gates"). It runs BEFORE the
      # suite: a function past the cap is a review finding, and a two-second
      # answer beats waiting out 2,500 tests to hear it.
      - name: eslint
        working-directory: spa
        run: npm run lint
      - name: vitest
        working-directory: spa
        run: npx vitest run

  # scripts/install.sh is served by the api out of the app image and piped into
  # `sh` on a stranger's machine, so it is checked as POSIX sh — the shell it
  # actually runs under — and not as the bash a developer happens to test with,
  # and then run against a mirror on disk so the rules it exists for are
  # exercised and not merely parsed. The release workflow runs both of these
  # lines, verbatim, before it builds anything.
  # shellcheck itself is the `shell` job's (every *.sh in the tree, one home);
  # this job is install.sh's behaviour, which only its own harness can check.
  scripts:
    name: install.sh behaviour
    needs: [changes]
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install.sh behaviour
        run: scripts/test-install.sh
  # The API tier's own gate, the mirror of `spa` above: ruff (correctness plus
  # the C901 complexity cap) and the pytest suite. The app image ships spa/ AND
  # skriftapp/ together, so both halves have to be green before it builds — the
  # Python half had no CI job at all until now.
  skriftapp:
    name: Python API tests
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skriftapp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install
        run: uv sync --frozen
      - name: ruff
        run: uv run --frozen ruff check buildapp
      - name: pytest
        run: uv run --frozen pytest buildapp -q

  # Every tracked shell script in the repo, wherever it lives — the container
  # entrypoints today, scripts/install.sh the moment it lands. Listing the files
  # from git rather than naming one directory is what keeps this a single job
  # that no later branch has to add a second copy of. Each script's own shebang
  # picks the dialect, so a POSIX install.sh is checked as sh.
  shell:
    name: Shell scripts
    needs: [changes]
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # shellcheck is preinstalled on ubuntu runners; locally, `brew install
      # shellcheck`.
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck

  desktop:
    name: Desktop client
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Package Linux application
        run: npm run pack

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid license for org accounts;
      # the CLI does not, so run the pinned binary directly.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # Scan this branch's history only: gitleaks defaults to --all, which
          # drags in the archived v1 branch (minified libsodium false positives).
          ./gitleaks git --no-banner --redact --verbose --log-opts="--full-history HEAD" .

  # ---- production rollout (push to main only) ----
  #
  # Each image job builds only when its tier moved, and no check above may have
  # failed. The conditions spell that out rather than leaning on the default
  # `success()`, because a gated check that was SKIPPED must not read as a
  # failure — while a real failure must still build nothing. `secrets` is
  # ungated, so it is the one that has to have actually succeeded.

  # Gated on the app's OWN checks only. `bridge`, `interop` and `web-e2e` all
  # compile Rust — `web-e2e` builds the whole stack in Docker — and none of them
  # can go red because of a change under spa/. Waiting on them cost ~10 minutes
  # per stylesheet. They still gate `build-relay`, which is the tier they test.
  build-app:
    name: build-app image (skriftapp)
    needs: [changes, spa, skriftapp, secrets]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs.changes.outputs.app == 'true'
          && needs.spa.result == 'success'
          && needs.skriftapp.result == 'success'
          && needs.secrets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Repo-root context: the SPA lives at spa/ beside skriftapp/ and is
          # built in-image (see skriftapp/Containerfile).
          context: .
          file: skriftapp/Containerfile
          build-args: |
            VITE_RELAY_URL=wss://relay.getbuild.ing
            VITE_BUILD_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/build-app:latest
            ${{ env.REGISTRY }}/build-app:${{ github.sha }}

  build-relay:
    name: build-relay image (bridge relay bin)
    needs: [changes, bridge, interop, web-e2e, secrets]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs.changes.outputs.relay == 'true'
          && needs.bridge.result == 'success'
          && needs.interop.result == 'success'
          && needs['web-e2e'].result == 'success'
          && needs.secrets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: bridge
          file: bridge/Containerfile
          target: relay
          push: true
          tags: |
            ${{ env.REGISTRY }}/build-relay:latest
            ${{ env.REGISTRY }}/build-relay:${{ github.sha }}

  # One rollout job per tier, not one job holding both. A single deploy job has
  # to wait for BOTH image jobs before it starts, so the app — whose image is
  # ready in ~3 min — sat waiting on a relay build it shares nothing with. Split,
  # the web client ships as soon as its own image exists.
  #
  # Each still applies its manifest ONLY when its image job actually succeeded.
  # Applying a manifest whose image was never built pins the Deployment to a
  # :SHA tag that is not in the registry — an ImagePullBackOff in production,
  # and for the relay a Recreate that never comes back. The gate is the image
  # job's own result, NOT "did this tier change": `changes.outputs.app` only says
  # the tier moved, and the image job can still be SKIPPED by a red check above
  # it. On 2026-07-29 those two facts took getbuild.ing down — web-e2e went red,
  # build-app was skipped, the roll applied `:<sha>` anyway, and the rollout
  # replaced a serving pod with one that could not pull.
  deploy-app:
    name: Deploy the app (ns 8ly)
    needs: [changes, build-app]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs['build-app'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save production-hosting

      - name: Roll the app (spa + skriftapp)
        run: |
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/app.yaml | kubectl -n 8ly apply -f -
          kubectl -n 8ly rollout status deployment/build-app --timeout=300s

      - name: Verify the app is serving
        # The ingress needs a moment to switch endpoints after the rollout.
        run: |
          verify() {
            curl -sf -o /dev/null https://getbuild.ing/healthz &&
            curl -sf https://getbuild.ing/ | grep -q "Ship confidence" &&
            curl -sf -o /dev/null https://getbuild.ing/landing/landing.css
          }
          for i in $(seq 1 12); do verify && exit 0; sleep 5; done
          verify

  deploy-relay:
    name: Deploy the relay (ns 8ly)
    needs: [changes, build-relay]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
          && needs['build-relay'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save production-hosting

      - name: Roll the relay (bridge)
        run: |
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/relay.yaml | kubectl -n 8ly apply -f -
          kubectl -n 8ly rollout status deployment/build-relay --timeout=300s

      - name: Verify the relay is serving
        run: |
          for i in $(seq 1 12); do
            curl -sf -o /dev/null https://relay.getbuild.ing/health && exit 0
            sleep 5
          done
          curl -sf -o /dev/null https://relay.getbuild.ing/health
