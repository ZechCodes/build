name: CI and deploy

# One pipeline, in order: the checks, then — on a push to main only — the two
# production images and the rollout. Deploy used to be its own `on: push`
# workflow racing this one, which is how a commit with a failing check still
# reached production. `needs` is the gate now: a red check builds no image.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/zechcodes

jobs:
  bridge:
    name: Rust bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  interop:
    name: Crypto interop (Rust ↔ Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Clone build-secure-transport reference
        run: git clone --depth 1 https://github.com/ZechCodes/build-secure-transport.git /tmp/bst
      - name: Live cross-language round-trip
        working-directory: bridge
        env:
          BUILD_SECURE_TRANSPORT_PY: /tmp/bst/python
        run: cargo test --test interop_python -- --nocapture

  web-e2e:
    name: Browser client end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # e2e.mjs speaks the auth-era protocol (dummy-login → gateway token →
      # relay /ws/client), so it needs the real stack, not the bare dev relay.
      - name: Build + start the real stack (app, relay, bridge)
        run: docker compose -f deploy/compose.real.yml up -d --build --wait
      - name: Pair the QA bridge and run the E2EE round-trip + lifecycle suite
        run: docker compose -f deploy/compose.real.yml --profile qa run --rm qa
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose.real.yml logs --tail 150

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a paid license for org accounts;
      # the CLI does not, so run the pinned binary directly.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # Scan this branch's history only: gitleaks defaults to --all, which
          # drags in the archived v1 branch (minified libsodium false positives).
          ./gitleaks git --no-banner --redact --verbose --log-opts="--full-history HEAD" .

  # ---- production rollout (push to main only; every check above must pass) ----

  build-app:
    name: build-app image (skriftapp)
    needs: [bridge, interop, web-e2e, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Repo-root context: the SPA lives at spa/ beside skriftapp/ and is
          # built in-image (see skriftapp/Containerfile).
          context: .
          file: skriftapp/Containerfile
          build-args: |
            VITE_RELAY_URL=wss://relay.getbuild.ing
          push: true
          tags: |
            ${{ env.REGISTRY }}/build-app:latest
            ${{ env.REGISTRY }}/build-app:${{ github.sha }}

  build-relay:
    name: build-relay image (bridge relay bin)
    needs: [bridge, interop, web-e2e, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: bridge
          file: bridge/Containerfile
          target: relay
          push: true
          tags: |
            ${{ env.REGISTRY }}/build-relay:latest
            ${{ env.REGISTRY }}/build-relay:${{ github.sha }}

  deploy:
    name: Deploy to production (ns 8ly)
    needs: [build-app, build-relay]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save production-hosting

      - name: Deploy SHA-pinned images
        run: |
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/app.yaml   | kubectl -n 8ly apply -f -
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/relay.yaml | kubectl -n 8ly apply -f -
          kubectl -n 8ly rollout status deployment/build-app --timeout=300s
          kubectl -n 8ly rollout status deployment/build-relay --timeout=300s

      - name: Verify public endpoints
        # The ingress needs a moment to switch endpoints after the rollout.
        run: |
          verify() {
            curl -sf -o /dev/null https://getbuild.ing/healthz &&
            curl -sf -o /dev/null https://relay.getbuild.ing/health &&
            test "$(curl -s -o /dev/null -w '%{http_code}' https://getbuild.ing/)" = "302"
          }
          for i in $(seq 1 12); do verify && exit 0; sleep 5; done
          verify
