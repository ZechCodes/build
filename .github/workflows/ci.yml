name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: Rust bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  interop:
    name: Crypto interop (Rust ↔ Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Clone build-secure-transport reference
        run: git clone --depth 1 https://github.com/ZechCodes/build-secure-transport.git /tmp/bst
      - name: Live cross-language round-trip
        working-directory: bridge
        env:
          BUILD_SECURE_TRANSPORT_PY: /tmp/bst/python
        run: cargo test --test interop_python -- --nocapture

  web-e2e:
    name: Browser client end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Clone build-secure-transport as a sibling
        run: git clone --depth 1 https://github.com/ZechCodes/build-secure-transport.git "$GITHUB_WORKSPACE/../build-secure-transport"
      - name: Install JS deps
        run: |
          ( cd "$GITHUB_WORKSPACE/../build-secure-transport/js" && npm install --no-audit --no-fund )
          ( cd web && npm install --no-audit --no-fund )
      - name: Build dev relay
        working-directory: bridge
        run: cargo build --example dev_relay
      - name: Run browser client → relay → bridge round-trip
        run: |
          ( cd bridge && DEV_RELAY_PORT=8799 cargo run --example dev_relay > /tmp/relay.log 2>&1 & )
          for i in $(seq 1 60); do grep -q DEV_RELAY_LISTENING /tmp/relay.log && break; sleep 0.5; done
          cd web && DEV_RELAY_URL=ws://127.0.0.1:8799 node e2e.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
