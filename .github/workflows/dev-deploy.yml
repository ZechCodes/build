name: Dev deploy

# Dev is the trusted integration branch; image builds are its deployment gate.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      ${{ github.ref == 'refs/heads/dev' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record source commit
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Dev source commit: $sha" >> "$GITHUB_STEP_SUMMARY"

  build-app:
    needs: [resolve]
    runs-on: ubuntu-latest
    concurrency:
      group: dev-deploy-build-app
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish dev image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: skriftapp/Containerfile
          build-args: |
            APP_CONFIG=app.channel-dev.yaml
            VITE_BUILD_CHANNEL=dev
            VITE_RELAY_URL=wss://relay-dev.getbuild.ing
            VITE_BUILD_VERSION=${{ needs.resolve.outputs.sha }}
          push: true
          tags: ghcr.io/zechcodes/build-app-dev:${{ needs.resolve.outputs.sha }}
      - name: Record published image
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "build-app-dev $SOURCE_SHA $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  build-relay:
    needs: [resolve]
    runs-on: ubuntu-latest
    concurrency:
      group: dev-deploy-build-relay
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish dev image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: bridge
          file: bridge/Containerfile
          # The crate includes fixtures/api/http at build time.
          build-contexts: |
            fixtures=fixtures
          target: relay
          push: true
          tags: ghcr.io/zechcodes/build-relay-dev:${{ needs.resolve.outputs.sha }}
      - name: Record published image
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "build-relay-dev $SOURCE_SHA $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy-app:
    needs: [resolve, build-app]
    if: ${{ needs['build-app'].result == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: deploy-app-dev
      cancel-in-progress: false
    steps:
      - name: Skip superseded source before migration or rollout
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          tip="$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tip" == "$SOURCE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "superseded by $tip" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.4"
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        name: Render exact built digests offline
        env:
          APP_DIGEST: ${{ needs['build-app'].outputs.digest }}
        run: |
          nice -n 10 kubectl kustomize deploy/k8s/dev > /tmp/dev-resources.yaml
          nice -n 10 uv run --project skriftapp --frozen python deploy/render_dev.py \
            --input /tmp/dev-resources.yaml --output /tmp/dev-deploy \
            --target app --app-image "ghcr.io/zechcodes/build-app-dev@$APP_DIGEST"
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        name: Configure namespace-scoped dev credential
        env:
          DEV_KUBECONFIG: ${{ secrets.DEV_KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$DEV_KUBECONFIG" > "$RUNNER_TEMP/dev-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/dev-kubeconfig" >> "$GITHUB_ENV"
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        name: Migrate dev database before app rollout
        run: |
          kubectl --namespace=build-dev delete job build-app-migrate --ignore-not-found --cascade=foreground --wait=true
          kubectl --namespace=build-dev apply -f /tmp/dev-deploy/migrate.yaml
          kubectl --namespace=build-dev wait --for=condition=complete job/build-app-migrate --timeout=600s
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        name: Roll out dev app
        run: |
          kubectl --namespace=build-dev apply -f /tmp/dev-deploy/app.yaml
          kubectl --namespace=build-dev rollout status deployment/build-app --timeout=300s
      - name: Remove temporary kube credential
        if: ${{ always() && steps.freshness.outputs.current == 'true' }}
        run: rm -f "$RUNNER_TEMP/dev-kubeconfig"

  deploy-relay:
    needs: [resolve, build-relay]
    if: ${{ needs['build-relay'].result == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: deploy-relay-dev
      cancel-in-progress: false
    steps:
      - name: Skip superseded source before migration or rollout
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          tip="$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tip" == "$SOURCE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "superseded by $tip" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.4"
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        name: Render exact built digests offline
        env:
          RELAY_DIGEST: ${{ needs['build-relay'].outputs.digest }}
        run: |
          nice -n 10 kubectl kustomize deploy/k8s/dev > /tmp/dev-resources.yaml
          nice -n 10 uv run --project skriftapp --frozen python deploy/render_dev.py \
            --input /tmp/dev-resources.yaml --output /tmp/dev-deploy \
            --target relay --relay-image "ghcr.io/zechcodes/build-relay-dev@$RELAY_DIGEST"
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        name: Configure namespace-scoped dev credential
        env:
          DEV_KUBECONFIG: ${{ secrets.DEV_KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$DEV_KUBECONFIG" > "$RUNNER_TEMP/dev-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/dev-kubeconfig" >> "$GITHUB_ENV"
      - if: ${{ steps.freshness.outputs.current == 'true' }}
        name: Roll out dev relay
        run: |
          kubectl --namespace=build-dev apply -f /tmp/dev-deploy/relay.yaml
          kubectl --namespace=build-dev rollout status deployment/build-relay --timeout=300s
      - name: Remove temporary kube credential
        if: ${{ always() && steps.freshness.outputs.current == 'true' }}
        run: rm -f "$RUNNER_TEMP/dev-kubeconfig"
