name: Initial Kubernetes Setup

on:
  workflow_dispatch:
    inputs:
      run_db_init:
        description: "Run database initialization"
        required: false
        default: "true"
        type: boolean

env:
  IMAGE: zzmmrmn/build-web

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save production-hosting
          kubectl config set-context --current --namespace=zechcodes

      - name: Create secrets
        run: |
          kubectl create secret generic build-web-secrets \
            --from-literal=secret-key="${{ secrets.BUILD_WEB_SECRET_KEY }}" \
            --from-literal=github-oauth-client-id="${{ secrets.BUILD_WEB_GITHUB_CLIENT_ID }}" \
            --from-literal=github-oauth-client-secret="${{ secrets.BUILD_WEB_GITHUB_CLIENT_SECRET }}" \
            --from-literal=resend-api-key="${{ secrets.BUILD_WEB_RESEND_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Apply Service
        run: kubectl apply -f k8s/service.yaml

      - name: Apply Ingress
        run: kubectl apply -f k8s/ingress.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Initialize database
        if: ${{ inputs.run_db_init }}
        run: |
          sed "s|image: zzmmrmn/build-web:latest|image: ${{ env.IMAGE }}:latest|" \
            k8s/init-db-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/build-web-init-db --timeout=120s

      - name: Deploy
        run: |
          kubectl apply -f k8s/deploy.yaml
          kubectl rollout status deployment/build-web --timeout=300s
