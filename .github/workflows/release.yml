name: Release the bridge

# Pushing a `bridge-vX.Y.Z` tag publishes the device daemon: four native
# builds, one SHA256SUMS, a keyless Sigstore signature over it, and the
# install script — as a GitHub release on a SEPARATE public repo (the
# `RELEASES_REPO` variable, default ZechCodes/build-releases), so that
# downloading a binary never means handing anyone this repository.
#
# The pipeline neither creates that repo nor pushes a tag; see
# deploy/README.md for the procedure and its prerequisites.
#
# Dispatching it by hand, on the same tag, is the way back in when Apple
# finishes a notarization after a signing leg gave up waiting (#293): pass the
# submission id the leg printed and that leg polls it instead of resubmitting.
#
#   gh workflow run release.yml --ref bridge-vX.Y.Z \
#     -f notarization-id-macos-arm64=<id> -f notarization-id-macos-x86_64=<id>

on:
  push:
    tags: ["bridge-v*.*.*"]
  workflow_dispatch:
    inputs:
      notarization-id-macos-arm64:
        description: Notarization submission id to resume for macos-arm64 instead of resubmitting
        required: false
        default: ""
      notarization-id-macos-x86_64:
        description: Notarization submission id to resume for macos-x86_64 instead of resubmitting
        required: false
        default: ""

# `id-token: write` is the whole reason cosign needs no key: the OIDC token
# GitHub mints for this workflow IS the identity in the certificate, which is
# what install.sh pins with --certificate-identity-regexp.
permissions:
  contents: read
  id-token: write

env:
  # macOS tar writes an `._name` AppleDouble entry beside any file carrying
  # extended attributes. A release tarball holds exactly one entry, so turn
  # that off everywhere rather than on the two runners where it bites.
  COPYFILE_DISABLE: "1"
  # The identity a downloader demands of the signature. install.sh is the
  # contract's home for it; these two are this workflow's single copy, used by
  # the self-verification, quoted in the release notes, and checked against
  # install.sh in the `version` job so the two homes cannot drift apart.
  COSIGN_IDENTITY_REGEXP: '^https://github\.com/ZechCodes/(build-web|build)/\.github/workflows/release\.yml@refs/tags/bridge-v'
  COSIGN_ISSUER: https://token.actions.githubusercontent.com

jobs:
  # Nothing is built until the tag and the crate agree on a version, because a
  # release whose binary prints a different number than its name is worse than
  # no release. install.sh's own gates are here for the same reason — it ships
  # as an asset, so a broken one is a broken release, not a lint failure after
  # the fact: it is linted, run against a mirror on disk, and checked for the
  # signing identity this workflow will sign with. The release notes open with
  # the version's CHANGELOG.md entry, so that entry is taken here too: an entry
  # that is missing, empty or still Unreleased stops the release before a
  # single build.
  version:
    name: The tag names a version this tree can build
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.derive.outputs.version }}
      releases_repo: ${{ steps.derive.outputs.releases_repo }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: derive
        env:
          TAG: ${{ github.ref_name }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'ZechCodes/build-releases' }}
        run: |
          set -euo pipefail
          # A dispatch runs from whatever ref it is given; only a release tag
          # has a version to build and the identity cosign signs with.
          case "$GITHUB_REF" in
            refs/tags/bridge-v*) ;;
            *)
              echo "::error::release.yml runs on a bridge-v* tag, not ${GITHUB_REF}"
              exit 1
              ;;
          esac
          version="${TAG#bridge-v}"
          if ! grep -q "^version = \"${version}\"\$" bridge/Cargo.toml; then
            echo "::error::tag ${TAG} wants ${version}, which bridge/Cargo.toml does not declare"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releases_repo=${RELEASES_REPO}" >> "$GITHUB_OUTPUT"
          echo "releasing build-bridge ${version} to ${RELEASES_REPO}"

      # Each script in the dialect its shebang names: the install scripts are
      # `#!/bin/sh`, so they are held to POSIX sh, and the liveness gate is
      # Bash and says so.
      - name: The install script is published verbatim, so it is linted first
        run: shellcheck scripts/*.sh

      - name: The install script does what it promises
        run: scripts/test-install.sh

      - name: The notarization wait gives up, resumes and reports as it promises
        run: scripts/test-notarize.sh

      - name: The changelog extraction takes one dated entry and refuses the rest
        run: scripts/test-changelog-section.sh

      - name: CHANGELOG.md has a dated entry for this version
        env:
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          set -euo pipefail
          scripts/changelog-section.sh "$VERSION" CHANGELOG.md > "${RUNNER_TEMP}/changelog-entry.md"
          cat "${RUNNER_TEMP}/changelog-entry.md"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog-entry
          path: ${{ runner.temp }}/changelog-entry.md
          if-no-files-found: error

      - name: install.sh and this workflow demand the same signing identity
        run: |
          set -euo pipefail
          # An identity is a certificate subject AND the issuer that vouched
          # for it, so both halves are checked; pinning one lets the pair
          # drift by half, which is the bug this step exists to prevent.
          for pin in "COSIGN_IDENTITY_REGEXP=${COSIGN_IDENTITY_REGEXP}" \
            "COSIGN_ISSUER=${COSIGN_ISSUER}"; do
            name="${pin%%=*}"
            value="${pin#*=}"
            grep -qF "${name}='${value}'" scripts/install.sh || {
              echo "::error::install.sh pins a different ${name} than release.yml"
              exit 1
            }
          done

  # One entry per platform key, and every entry runs the same steps: the
  # matrix is the only place a platform is named. Native runners throughout —
  # no cross toolchains, no sysroots — which is also what fixes the Linux
  # glibc floor at 2.35 (ubuntu-22.04) and macOS at 13.
  build:
    name: build-bridge ${{ matrix.key }}
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - key: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - key: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - key: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ matrix.key }}-cargo-release-${{ hashFiles('bridge/Cargo.lock') }}

      # `release-portable` vendors libgit2 and OpenSSL into the binary (see
      # bridge/Cargo.toml): without it the Linux builds link whatever the
      # runner happens to have, and refuse to start on a machine that does not.
      - name: Build
        run: cargo build --release --locked --bin build-bridge --target ${{ matrix.target }} --features release-portable

      - name: The binary states the version this tag names
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          printed="$(./target/${{ matrix.target }}/release/build-bridge --version)"
          if [ "$printed" != "build-bridge ${VERSION}" ]; then
            echo "::error::built binary says '${printed}', expected 'build-bridge ${VERSION}'"
            exit 1
          fi

      # One entry, `build-bridge`, at the archive root — install.sh unpacks
      # into a scratch directory and expects to find it there and nowhere else.
      - name: Pack
        run: tar -czf "build-bridge-${{ matrix.key }}.tar.gz" -C "target/${{ matrix.target }}/release" build-bridge

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-bridge-${{ matrix.key }}
          path: bridge/build-bridge-${{ matrix.key }}.tar.gz
          if-no-files-found: error

  # Whether Developer ID signing can happen at all is one question with one
  # answer, and it is asked once, here: a job-level `if` cannot read secrets,
  # so a step answers it and publishes the answer as an output that the
  # signing legs, the checksums job and the release notes all read. The
  # credentials do not exist yet and that must not stop a release — the
  # unsigned builds publish, loudly labelled, and macOS users answer one
  # Gatekeeper prompt.
  apple-creds:
    name: Are the Apple credentials configured?
    needs: [version]
    runs-on: ubuntu-22.04
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    outputs:
      configured: ${{ steps.creds.outputs.configured }}
    steps:
      - id: creds
        run: |
          set -euo pipefail
          configured=true
          for value in "$APPLE_CERTIFICATE_P12" "$APPLE_CERTIFICATE_PASSWORD" \
            "$APPLE_TEAM_ID" "$APPLE_ID" "$APPLE_APP_PASSWORD"; do
            if [ -z "$value" ]; then configured=false; fi
          done
          echo "configured=${configured}" >> "$GITHUB_OUTPUT"

      - name: Say plainly that the macOS builds are unsigned
        if: steps.creds.outputs.configured != 'true'
        run: |
          echo "::warning::macOS binaries are UNSIGNED and NOT notarized — APPLE_* secrets are absent"

  # Developer ID signing and notarization, one leg per macOS platform key, so
  # the matrix stays the only place a platform is named here too. Each leg
  # takes its own tarball, signs the one binary inside it and republishes the
  # artifact under the same name, which is what `checksums` then digests.
  #
  # Notarization waits at most NOTARIZE_BUDGET_SECONDS, inside a job timeout
  # that covers it, so a slow Apple fails the leg with its submission id in the
  # summary instead of GitHub cancelling it at six hours; a failed leg holds
  # back `checksums` and `publish`. `resume` is the id a dispatch passed in.
  sign-macos:
    name: Sign and notarize ${{ matrix.key }}
    needs: [version, build, apple-creds]
    if: ${{ needs.apple-creds.outputs.configured == 'true' }}
    runs-on: macos-14
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: macos-arm64
            resume: ${{ inputs.notarization-id-macos-arm64 }}
          - key: macos-x86_64
            resume: ${{ inputs.notarization-id-macos-x86_64 }}
    outputs:
      notarization-id-macos-arm64: ${{ steps.sign.outputs.notarization-id-macos-arm64 }}
      notarization-id-macos-x86_64: ${{ steps.sign.outputs.notarization-id-macos-x86_64 }}
    # A job-level `env:` is the widest scope that can read secrets — the
    # workflow-level one cannot — so the credentials are named once per job
    # that handles them, and in no step.
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Collect the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-bridge-${{ matrix.key }}
          path: macos

      - name: Sign and notarize it
        id: sign
        env:
          TARBALL: build-bridge-${{ matrix.key }}.tar.gz
          KEY: ${{ matrix.key }}
          RESUME_ID: ${{ matrix.resume }}
          TAG: ${{ github.ref_name }}
          NOTARIZE_BUDGET_SECONDS: "5400"
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/build-release.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security import "${RUNNER_TEMP}/developer-id.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "${RUNNER_TEMP}/developer-id.p12"

          cd macos
          work="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$work"
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" "$work/build-bridge"
          codesign --verify --strict --verbose=2 "$work/build-bridge"
          # Notarization takes a container, and a bare Mach-O binary cannot be
          # stapled — the ticket lives on Apple's side and Gatekeeper fetches
          # it. So: zip, submit (or resume), wait within the budget, and re-tar
          # the signed binary.
          ditto -c -k --keepParent "$work/build-bridge" "$work/build-bridge.zip"
          export NOTARIZE_LABEL="$KEY"
          export RESUME_HINT="Resume it without resubmitting: \`gh workflow run release.yml --ref ${TAG} -f notarization-id-${KEY}={id}\`"
          export NOTARIZE_OUTPUT="notarization-id-${KEY}"
          "${GITHUB_WORKSPACE}/scripts/notarize.sh" \
            "$work/build-bridge.zip" "$work/build-bridge" "$RESUME_ID"
          tar -czf "$TARBALL" -C "$work" build-bridge
          rm -rf "$work"
          security delete-keychain "$keychain"

      - name: Republish the signed build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-bridge-${{ matrix.key }}
          path: macos/build-bridge-${{ matrix.key }}.tar.gz
          if-no-files-found: error
          overwrite: true

  # The digests and the signature over them, taken once, on one machine, after
  # every binary is final. install.sh verifies the tarball against SHA256SUMS
  # and SHA256SUMS against this signature, so this job is the root of the whole
  # download's trust.
  #
  # The assets are staged under the runner's temp directory, never in the
  # checkout: the repo has its own `assets/` (the brand artwork), and a
  # directory shared with the checkout ships whatever the tree holds there
  # (#305).
  checksums:
    name: Digest and sign the assets
    needs: [version, build, apple-creds, sign-macos]
    # Signing is skipped whenever the Apple credentials are absent, and a
    # skipped dependency skips everything under it unless the gate says
    # otherwise, so this one is explicit: everything that had to produce an
    # artifact did, and signing either succeeded or never ran.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.apple-creds.result == 'success' && needs.sign-macos.result != 'failure' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-bridge-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: install.sh ships as an asset and is signed with the rest
        run: cp scripts/install.sh "${RUNNER_TEMP}/release-assets/install.sh"

      - name: SHA256SUMS
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          sha256sum build-bridge-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign SHA256SUMS with this workflow's own identity
        working-directory: ${{ runner.temp }}/release-assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # The same command install.sh runs on a user's machine, with the identity
      # the `version` job proved install.sh pins — so a signature that would
      # fail there fails here.
      - name: Verify it the way install.sh will
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error

  # A bridge that drops a phone's session under load, or cannot restart ICE on
  # a relayed path, is not released (#131): the TURN soak runs on the tagged
  # tree before anything is published.
  liveness:
    name: TURN soak with an ICE restart
    needs: [version]
    permissions:
      contents: read
    uses: ./.github/workflows/liveness.yml

  # The only job that writes anything outside this repo, and the only one that
  # holds a token. The bridge's self-update follows the latest release, so a
  # new release is created as a draft, filled, and only then published: a
  # failed upload leaves a draft no installer can see. Re-running it is safe:
  # the release is created if missing and every asset is uploaded with
  # --clobber.
  publish:
    name: Publish to the releases repo
    needs: [version, apple-creds, checksums, liveness]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # The entry the `version` job checked, beside the assets rather than
      # among them: it is the head of the notes, not a download.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog-entry
          path: ${{ runner.temp }}/changelog-entry

      # Every asset is a file at the top of the staging directory. Anything
      # else means the staging picked up something it should not have, and it
      # fails here, before a release exists, rather than mid-upload.
      - name: The release assets are files and nothing else
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          strays="$(find . -mindepth 1 -maxdepth 1 ! -type f)"
          if [ -n "$strays" ]; then
            echo "::error::release-assets holds entries that are not files: ${strays//$'\n'/ }"
            exit 1
          fi
          ls -l

      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ needs.apple-creds.outputs.configured }}
          COMMIT: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
          CHANGELOG_ENTRY: ${{ runner.temp }}/changelog-entry/changelog-entry.md
        run: |
          set -euo pipefail
          # What changed first, then how to install and verify it.
          { cat "$CHANGELOG_ENTRY"; echo; } > notes.md
          if [ "$SIGNED" = "true" ]; then
            macos_line="macOS binaries are signed with a Developer ID certificate and notarized by Apple."
          else
            macos_line="macOS binaries are **unsigned and not notarized**. macOS will warn on first run; open System Settings → Privacy & Security and allow it."
          fi
          cat >> notes.md <<NOTES
          build-bridge ${VERSION}, built from ${SOURCE_REPO}@${COMMIT}.

          Install:

              curl -fsSL https://getbuild.ing/install.sh | sh

          ${macos_line}
          Linux builds target glibc 2.35 or newer; macOS builds target macOS 13 or newer.

          Verify a download by hand:

              sha256sum --check --ignore-missing SHA256SUMS
              cosign verify-blob \\
                --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity-regexp '${COSIGN_IDENTITY_REGEXP}' \\
                --certificate-oidc-issuer ${COSIGN_ISSUER} \\
                SHA256SUMS
          NOTES
          cat notes.md

      - name: Create the release as a draft if this tag has none, then upload every asset
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ needs.version.outputs.releases_repo }}
          ASSETS: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft \
              --title "build-bridge ${VERSION}" --notes-file notes.md
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find "$ASSETS" -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"

      # The tag is created on the releases repo here, when the draft publishes,
      # and the release becomes the latest one the self-update follows. A
      # re-run on a release that is already public leaves it, and which
      # release is latest, as they were.
      - name: Publish the release once every asset is up
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ needs.version.outputs.releases_repo }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
          if [ "$draft" = "true" ]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
          echo "published https://github.com/${REPO}/releases/tag/${TAG}"
