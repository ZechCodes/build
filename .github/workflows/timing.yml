name: Bridge timing tests

# The three timing tests the default run ignores (#280, #289, #709):
# a_git_child_costs_what_the_child_costs (src/git_process.rs),
# the_daemon_answers_reads_and_writes_while_three_ptys_flood
# (tests/concurrency_load.rs), and busy_writers_keep_app_lock_holds_below_budget
# (src/app/tests/runtime/lock_hold_busy.rs). They compare wall-clock times against
# fixed ceilings, which a machine running other suites breaks with nothing wrong in
# the bridge, so they are out of `cargo test` and run here instead, alone on a
# fresh runner. The first two retain their debug profile; the busy lock-hold
# regression uses the release profile the local shipping build uses.
#
# Nightly and by hand, never on a push or a PR: a red run here is a performance
# regression to look at, not a gate on the merge.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    name: Existing debug timing tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
            bridge/vendor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.lock', 'bridge/vendor/Cargo.lock') }}

      # Built first so the compile is not running beside the timed tests.
      - name: Build the tests
        run: nice -n 10 cargo test --no-run

      # Two filters, each matching one test; --no-fail-fast so a failure in
      # the lib binary still runs the flood test in its own.
      - name: Timing tests
        run: >-
          nice -n 10 cargo test --no-fail-fast --
          --ignored
          --test-threads=1
          a_git_child_costs_what_the_child_costs
          the_daemon_answers_reads_and_writes_while_three_ptys_flood

  busy-lock-holds:
    name: Busy app-lock holds (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache release cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target/release
          key: ${{ runner.os }}-cargo-release-lock-holds-${{ hashFiles('bridge/Cargo.lock', 'bridge/vendor/Cargo.lock') }}

      # Compile before timing; no compiler runs beside the fixture.
      - name: Build release lock-hold test
        run: nice -n 10 cargo test --release --locked --lib --no-run

      - name: Release lock-hold timing test
        run: >-
          nice -n 10 cargo test --release --locked --lib --
          --ignored
          --test-threads=1
          busy_writers_keep_app_lock_holds_below_budget
