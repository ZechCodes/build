# Gitleaks configuration for this repo. Extends the default ruleset; the
# allowlists below suppress documented example credentials and vendored-library
# false positives that live in git history (v1 docs/planning and the retired
# Hugo theme), none of which are real secrets:
#   - v1 docs/planning markdown: illustrative JWTs and `sk-...`/`ak_test_...`
#     placeholder keys inside API examples and security-testing walkthroughs
#   - v1 Terminal test fixture: a made-up token in a frontend unit test
#   - v2 spa secret-masking test fixtures: the dotenv spoiler feature is TESTED
#     with made-up secret-shaped strings (JWTs, sk-/hex/base64 values); they are
#     fixtures for the masker, not real credentials
#   - themes libsodium-wrappers.js: minified libsodium symbol names
#     (crypto_kdf_blake2b_BYTES_MAX, ...) misread as generic API keys
#   - bridge/target: gitignored Cargo build output; the `pem` crate bakes its
#     own doc-example RSA key into the rmeta it compiles
#   - bridge/vendor webrtc example: RFC 6455's WebSocket GUID, a public
#     constant the generic-api-key rule misreads as a key
#   - bridge/vendor rtc: a commented-out upstream ICE-server test case
#     (transport/ice/server.rs) carrying a made-up OAuth access token
#   - v2 wire fixtures and push-bus tests: `status_key`, `content_key`,
#     `highlight_key` and `diff_key` are fnv1a64 hashes OF A PAYLOAD, and the
#     example payloads hash to the made-up sixteen hex characters allowlisted
#     below. They name content, never access; the same values appear in twenty
#     `fixtures/api/v1/*.json` files as the one example key the wire docs use.
# Real leaks anywhere else still fail the scan.

[extend]
useDefault = true

[allowlist]
description = "Documented example secrets and vendored-library false positives"
paths = [
  '''v1/docs/.*\.md''',
  '''v1/planning/.*\.md''',
  '''planning/v1/.*\.md''',
  '''v1/snapshot-manager/docs/.*\.md''',
  '''v1/frontend/src/components/Terminal/__tests__/Terminal\.advanced\.test\.tsx''',
  '''spa/test/secrets\.test\.js''',
  '''spa/test/diffRender\.test\.js''',
  '''themes/build/static/js/libsodium-wrappers\.js''',
  '''bridge/target/''',
]
regexes = [
  # The example content keys the v1 wire fixtures and the push-bus tests hash
  # their example payloads to.
  '''9f3c1a0b7e2d4c55''',
  '''3f9a1c0b7e2d4c55''',
  '''5c6d7e8f90123456''',
  # RFC 6455's WebSocket GUID, a public protocol constant: the vendored webrtc
  # crate's example signalling server (bridge/vendor/) hashes it into the
  # handshake's Sec-WebSocket-Accept.
  '''258EAFA5-E914-47DA-95CA-C5AB0DC85B11''',
  # The access token in a commented-out upstream test case of the vendored rtc
  # crate (bridge/vendor/rtc/src/peer_connection/transport/ice/server.rs), a
  # fixture ported from pion's ICE-server tests, not a credential.
  '''AAwg3kPHWPfvk9bDFL936wYvkoctMADzQ5VhNDgeMR3\+ZlZ35byg972fW8QjpEl7bx91YLBPFsIhsxloWcXPhA==''',
]
