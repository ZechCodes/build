site_name: Build
theme: build
debug: true
domain: localhost

db:
  url: sqlite+aiosqlite:///./app.db

auth:
  redirect_base_url: "http://localhost:8080"
  providers:
    dummy:
      provider: dummy
    google:
      client_id: $GOOGLE_CLIENT_ID
      client_secret: $GOOGLE_CLIENT_SECRET
      scopes:
        - openid
        - email
        - profile
    github:
      client_id: $GITHUB_CLIENT_ID
      client_secret: $GITHUB_CLIENT_SECRET
      scopes:
        - user:email

controllers:
  - skrift.admin.controller:AdminController
  - skrift.controllers.auth:AuthController
  - skrift.controllers.web:WebController

  - build_app.controllers:SignupConfirmController
  - build_app.controllers:preview_frame
  - build_app.campaign_signups_api:CampaignSignupsApiController
  - build_app.campaign_signups_admin:CampaignSignupsAdminController
  - build_app.dashboard:DashboardController
  - build_app.devices:DeviceApiController
  - build_app.app_auth:AppAuthController
  - build_app.app_auth:AppAuthPageController

page_types:
  - name: page
    plural: pages
    icon: file-text

middleware:
  - build_app.middleware:create_install_middleware

security_headers:
  enabled: false

rate_limit:
  enabled: false
