site_name: Build
theme: build
domain: getbuild.ing

db:
  url: $DATABASE_URL
  schema: build

auth:
  redirect_base_url: "https://getbuild.ing"
  allowed_redirect_domains:
    - getbuild.ing
    - "*.getbuild.ing"
  providers:
    google:
      client_id: $GOOGLE_CLIENT_ID
      client_secret: $GOOGLE_CLIENT_SECRET
      scopes:
        - openid
        - email
        - profile
    github:
      client_id: $GITHUB_CLIENT_ID
      client_secret: $GITHUB_CLIENT_SECRET
      scopes:
        - user:email

session:
  cookie_name: session
  cookie_domain: .getbuild.ing
  max_age: 604800

controllers:
  - skrift.admin.controller:AdminController
  - skrift.controllers.auth:AuthController
  - skrift.controllers.web:WebController

  - build_app.controllers:SignupConfirmController
  - build_app.campaign_signups_api:CampaignSignupsApiController
  - build_app.campaign_signups_admin:CampaignSignupsAdminController

page_types:
  - name: page
    plural: pages
    icon: file-text

middleware:
  - build_app.middleware:create_install_middleware

security_headers:
  enabled: true
  csp_nonce: false
  content_security_policy: "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; form-action 'self'; base-uri 'self'; connect-src 'self'"

rate_limit:
  enabled: true
  requests_per_minute: 60
  auth_requests_per_minute: 10
