site_name: Build
theme: build
domain: getbuild.ing

db:
  url: $DATABASE_URL
  schema: build

auth:
  redirect_base_url: "https://getbuild.ing"
  allowed_redirect_domains:
    - getbuild.ing
    - "*.getbuild.ing"
  providers:
    google:
      client_id: $GOOGLE_CLIENT_ID
      client_secret: $GOOGLE_CLIENT_SECRET
      scopes:
        - openid
        - email
        - profile
    github:
      client_id: $GITHUB_CLIENT_ID
      client_secret: $GITHUB_CLIENT_SECRET
      scopes:
        - user:email

session:
  cookie_name: session
  cookie_domain: .getbuild.ing
  max_age: 604800

controllers:
  - skrift.admin.controller:AdminController
  - skrift.controllers.auth:AuthController
  - skrift.controllers.web:WebController

  - build_app.controllers:SignupConfirmController
  - build_app.controllers:preview_frame
  - build_app.campaign_signups_api:CampaignSignupsApiController
  - build_app.campaign_signups_admin:CampaignSignupsAdminController
  - build_app.dashboard:DashboardController
  - build_app.devices:DeviceApiController
  - build_app.app_auth:AppAuthController
  - build_app.app_auth:AppAuthPageController
  - build_app.theme_api:theme_version
  - build_app.download:download_page

page_types:
  - name: page
    plural: pages
    icon: file-text

middleware:
  - build_app.middleware:create_install_middleware

security_headers:
  enabled: true
  csp_nonce: true
  content_security_policy: "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; frame-src 'self'; form-action 'self'; base-uri 'self'; connect-src 'self' wss://getbuild.ing ws://getbuild.ing"

rate_limit:
  enabled: true
  requests_per_minute: 60
  auth_requests_per_minute: 10
  paths:
    # E2EE session init / send are hit multiple times per channel on
    # dashboard boot, focus resync, and reconnect. The default 60/min
    # cap throttles handshake roundtrips (browser send-init and the
    # device's return `session_accept` post both count against the
    # shared egress-IP bucket on home NATs), which manifests as
    # "session_accept timed out" in the console. All /api/devices/*
    # endpoints are admin-auth-gated so raising the cap here doesn't
    # broaden the abuse surface.
    "/api/devices/e2ee/": 300
