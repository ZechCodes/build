[package]
name = "build-bridge"
version = "0.1.0"
edition = "2021"
description = "Build device daemon: worktrees, full-PTY harnesses, single `done` MCP tool, git-diff watcher, task lifecycle."
license = "MIT"

[[bin]]
name = "build-bridge"
path = "src/main.rs"

[lib]
name = "build_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = "0.20"
portable-pty = "0.9"
notify = "6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
dryoc = "0.7"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
