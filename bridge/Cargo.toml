[package]
name = "build-bridge"
version = "0.1.0"
edition = "2021"
description = "Build device daemon: worktrees, full-PTY harnesses, single `done` MCP tool, git-diff watcher, task lifecycle."
license = "MIT"

[[bin]]
name = "build-bridge"
path = "src/main.rs"

[lib]
name = "build_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = "0.20"
portable-pty = "0.9"
vt100 = "0.15"
notify = "6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
# `rustls-tls-webpki-roots`: outbound wss:// (production relay) via rustls with
# bundled webpki roots — no OpenSSL/native-tls, works in scratch containers.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
dryoc = "0.7"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6.5"
# wss integration test: self-signed cert + local TLS WebSocket server.
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
