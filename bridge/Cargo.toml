[package]
name = "build-bridge"
version = "0.2.5"
edition = "2021"
description = "Build device daemon: worktrees, full-PTY harnesses, scoped conversation MCP tools, git-diff watcher, task lifecycle."
license = "AGPL-3.0-only"

[[bin]]
name = "build-bridge"
path = "src/main.rs"

[lib]
name = "build_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
git2 = "0.20"
portable-pty = "0.9"
vt100 = "0.15"
notify = "6"
# The gitignore matcher the worktree watcher classifies raw fs events with
# (`watch.rs`): root `.gitignore`, `.git/info/exclude`, global excludes. Only
# the matcher is used, never the walker.
ignore = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
# `rustls-tls-webpki-roots`: outbound wss:// (production relay) via rustls with
# bundled webpki roots — no OpenSSL/native-tls, works in scratch containers.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
dryoc = "0.7"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
httpdate = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
semver = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# The process crypto provider for every rustls user above (the wss relay
# socket, reqwest, webrtc's DTLS). Two providers are unified into this build —
# reqwest brings aws-lc-rs, webrtc's rtc brings ring — so rustls 0.23 cannot
# pick one on its own and the daemon installs this one at startup.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# passwd lookup for the user's login shell (terminal + PATH resolution).
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
webrtc = "0.20"
# The facade webrtc reports TURN and STUN gathering failures through; `rtc.rs`
# forwards those records, and only those, to stderr.
log = "0.4"
# The sans-io core `webrtc` is built on, as a direct dependency for one
# reason: `SettingEngine`'s setters take `MulticastDnsMode` and `NetworkType`,
# and `webrtc` re-exports the engine but not those two enums, so the ICE
# policy of `rtc.rs` cannot name what it passes in without this. Pinned to the
# same version `webrtc` resolves, with the same (default) features, so one
# `rtc` is compiled into the binary and its types are the engine's own.
rtc = "0.20.4"
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
flate2 = "1"
tar = "0.4"
# Sealed push content (#200, `notify/seal.rs`): ECDH P-256, HKDF-SHA256 and
# AES-256-GCM, the scheme in `planning/v2/Push Content Security Checklist.md`.
# Pinned to the versions webrtc already resolves, so the lock gains no
# package. RustCrypto rather than ring because the vector test injects a fixed
# ephemeral key, which ring's agreement API refuses by design.
p256 = { version = "0.13.2", features = ["ecdh"] }
hkdf = "0.12.4"
aes-gcm = "0.10.3"

# The Rust half of the complexity gate (CLAUDE.md "Complexity gates"). The
# threshold itself lives in clippy.toml; this promotes the lint from
# allow-by-default to a warning, which the CI gate
# `cargo clippy --all-targets -- -D warnings` turns into an error for the lib,
# the bins and the tests alike.
[lints.clippy]
cognitive_complexity = "warn"

[features]
# `carrier::testing`: the browser-side frame fixtures the crate's tests and the
# integration tests both build from. Never compiled into the daemon.
testing = []
# `release-portable`: how the published binaries are built (see
# .github/workflows/release.yml). git2's default features link the build
# machine's libgit2, libssl and libssh2 when pkg-config finds them, which on a
# GitHub runner produces a Linux binary that refuses to start on a machine
# whose shared libraries have different sonames. Vendoring compiles both from
# source into the binary, so the only thing a released build asks of the host
# is glibc. Never on by default: a local `cargo build` keeps the fast path.
release-portable = ["git2/vendored-libgit2", "git2/vendored-openssl"]

[dev-dependencies]
build-bridge = { path = ".", features = ["testing"] }
tempfile = "3"
# `test-util` only here: it brings tokio's controllable clock, which lets the
# timing tests assert which side of a window something falls on instead of
# racing a real one. Never compiled into the daemon.
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"
ring = "0.17"
# wss integration test: self-signed cert + local TLS WebSocket server.
rcgen = "0.13"
# The enforcement guards in src/harness read the crate's own modules as syntax
# trees (patterns, comparisons, impl blocks) rather than as text.
syn = { version = "2", features = ["full", "visit"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

# webrtc 0.20.4 with its driver's drain fixed (#166): output a wake produces
# leaves before the driver waits, instead of waiting up to ICE's 200 ms timer
# for the next wake (a relayed reply, the SCTP INIT after the DTLS handshake).
# rtc 0.20.4 with its DTLS handler's ClientHello sent when the connection
# starts (#179), instead of at ICE's next 200 ms tick.
# The patched sources, the diffs against the registry and how to re-derive
# them are in vendor/README.md. The crates are not members of this package's
# workspace, so fmt, clippy and the tests here never reach into vendor/; their
# own tests run from vendor/Cargo.toml.
[patch.crates-io]
webrtc = { path = "vendor/webrtc" }
rtc = { path = "vendor/rtc" }
