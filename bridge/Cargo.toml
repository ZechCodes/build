[package]
name = "build-bridge"
version = "0.1.0"
edition = "2021"
description = "Build device daemon: worktrees, full-PTY harnesses, scoped conversation MCP tools, git-diff watcher, task lifecycle."
license = "MIT"

[[bin]]
name = "build-bridge"
path = "src/main.rs"

[lib]
name = "build_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
git2 = "0.20"
portable-pty = "0.9"
vt100 = "0.15"
notify = "6"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
# `rustls-tls-webpki-roots`: outbound wss:// (production relay) via rustls with
# bundled webpki roots — no OpenSSL/native-tls, works in scratch containers.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
dryoc = "0.7"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
semver = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# passwd lookup for the user's login shell (terminal + PATH resolution).
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
webrtc = "0.20"

[features]
# `carrier::testing`: the browser-side frame fixtures the crate's tests and the
# integration tests both build from. Never compiled into the daemon.
testing = []

[dev-dependencies]
build-bridge = { path = ".", features = ["testing"] }
tempfile = "3"
# `test-util` only here: it brings tokio's controllable clock, which lets the
# timing tests assert which side of a window something falls on instead of
# racing a real one. Never compiled into the daemon.
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"
# wss integration test: self-signed cert + local TLS WebSocket server.
rcgen = "0.13"
# The enforcement guards in src/harness read the crate's own modules as syntax
# trees (patterns, comparisons, impl blocks) rather than as text.
syn = { version = "2", features = ["full", "visit"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
