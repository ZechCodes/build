[package]
name = "bridge-http-auth-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "=1.17.0"

[dev-dependencies]
wiremock = "0.6.5"
