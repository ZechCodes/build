[package]
name = "bridge-http-runtime-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[test]]
name = "runtime"
path = "../http_runtime.rs"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "test-util"] }
rustls = { version = "=0.23.41", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
libc = "0.2"
tempfile = "3"
rcgen = "=0.13.2"
uuid = { version = "1", features = ["v4"] }
