# Build v2 over the REAL build-relay (Postgres + Redis + relay), plus the bridge
# and the web client. (The node gateway is retired — relay-direct topology.)
#
# Prereqs (see deploy/README.md):
#   podman build -t build-relay:local <path-to-build-relay-checkout>
#   python3 deploy/provision.py            # writes deploy/secrets/*
#
#   podman compose -f deploy/compose.real.yml up -d --build
#
# Non-default host ports so this coexists with other relay deployments.

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: build
      POSTGRES_PASSWORD: build
      POSTGRES_DB: build
    # Ephemeral data dir → the seed (schema `build` + devices + approved device)
    # runs on every fresh container.
    volumes:
      - ./secrets/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "15432:5432"

  redis:
    image: docker.io/library/redis:7
    ports:
      - "16379:6379"

  relay:
    image: localhost/build-relay:local
    environment:
      DATABASE_URL: postgresql://build:build@postgres:5432/build
      REDIS_URL: redis://redis:6379/0
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "8081"
    depends_on:
      - postgres
      - redis
    ports:
      - "18081:8081"
    restart: unless-stopped

  bridge:
    build:
      context: ../bridge
      dockerfile: Containerfile
      target: bridge
    env_file:
      - ./secrets/bridge.env
    environment:
      BRIDGE_RELAY_URL: ws://relay:8081
      BRIDGE_REPO: /repo
      BRIDGE_WORKTREES: /worktrees
      BRIDGE_BASE_BRANCH: main
      BRIDGE_QA_AGENT: "1"
    depends_on:
      - relay
    restart: unless-stopped

  # The node gateway is retired: browsers connect straight to the relay's
  # /ws/client with a gateway token minted by the api (see web/skrift-auth.mjs).
  web:
    build:
      context: ../web
    environment:
      # The browser client points at the relay's WS (mapped to the host).
      CLIENT_RELAY_URL: ws://localhost:18081
    ports:
      - "18080:8080"
    depends_on:
      - relay
    restart: unless-stopped
