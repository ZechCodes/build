# Build v2 — the real (production-shaped) local stack:
#
#   skriftapp (auth + device registry + gateway tokens + serves the SPA)
#     ⇅ /internal/* (X-Internal-Secret)
#   Rust relay (single broker: /ws/device + /ws/client, ciphertext only)
#     ⇅ E2EE envelopes
#   bridge (device daemon, deterministic QA agent)
#
# No gateway, no Redis, no v1 relay. The app runs SKRIFT_ENV=dev (dummy auth,
# sqlite inside the container, first-run setup seeded by the mounted
# entrypoint) so the whole flow — device pairing, login, tasks — works with
# zero manual secrets. Everything is container-lifetime state: `down` resets
# the world (including the bridge pairing), `restart` keeps it.
#
#   podman compose -f deploy/compose.real.yml up -d --build
#   podman compose -f deploy/compose.real.yml --profile qa run --rm qa
#   open http://localhost:8090/app/     # dummy login (any email), the SPA
#
# The qa one-shot approves the bridge (real register→lookup→approve pairing via
# BRIDGE_PAIRING_CODE), then runs the E2EE round-trip + the 16-check lifecycle
# suite. To drive the board yourself first run qa (it pairs the device for
# qa@localhost) or approve the pending device in Settings → Devices with the
# pairing code below.
#
# Ports: app :8090 (api + SPA), relay :18090 (matches the SPA bundle's
# VITE_RELAY_URL and app.dev.yaml's connect-src).

services:
  app:
    build:
      context: ..
      dockerfile: skriftapp/Containerfile
      args:
        # The SPA connects to the relay's host-mapped port from the browser.
        VITE_RELAY_URL: ws://localhost:18090
    environment:
      SKRIFT_ENV: dev
      SECRET_KEY: ${BUILD_SECRET_KEY:-insecure-dev-only-secret-key}
      INTERNAL_API_SECRET: ${BUILD_INTERNAL_API_SECRET:-compose-dev-internal-secret}
      # Optional web push for local testing (localhost is a secure context, so
      # push works over http://localhost). Unset ⇒ the push endpoints answer 503
      # and the SPA toggle reports push as unconfigured. Generate a pair with
      # deploy/k8s/bootstrap-secrets.sh's openssl recipe if you want it.
      VAPID_PRIVATE_KEY: ${BUILD_VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${BUILD_VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${BUILD_VAPID_SUBJECT:-mailto:dev@getbuild.ing}
    volumes:
      # Not baked into the image (production-only image): the dev config and a
      # dev entrypoint that seeds Skrift's first-run setup after migrating.
      - ../skriftapp/app.dev.yaml:/app/app.dev.yaml:ro
      - ./app-dev-entrypoint.sh:/app/dev-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/app/dev-entrypoint.sh"]
    ports:
      - "8090:8080"
    restart: unless-stopped

  relay:
    build:
      context: ../bridge
      dockerfile: Containerfile
      target: relay
    environment:
      API_INTERNAL_URL: http://app:8080
      RELAY_INTERNAL_SECRET: ${BUILD_INTERNAL_API_SECRET:-compose-dev-internal-secret}
      RELAY_PORT: "8799"
    ports:
      - "18090:8799"
    depends_on:
      - app
    restart: unless-stopped

  bridge:
    build:
      context: ../bridge
      dockerfile: Containerfile
      target: bridge
    environment:
      BRIDGE_API_URL: http://app:8080
      BRIDGE_WEB_URL: http://localhost:8090
      # In-network dev transport; production bridges use wss://relay.getbuild.ing.
      BRIDGE_RELAY_URL: ws://relay:8799 # nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
      # Deterministic code so the qa one-shot (or you, in the SPA) can approve
      # this bridge without reading its logs. Dev-stack convenience only.
      BRIDGE_PAIRING_CODE: ${BUILD_PAIRING_CODE:-COMPOSE-PAIR}
      BRIDGE_REPO: /repo
      BRIDGE_WORKTREES: /worktrees
      BRIDGE_BASE_BRANCH: main
      BRIDGE_QA_AGENT: "1"
    depends_on:
      - app
      - relay
    restart: unless-stopped

  # One-shot: pair the bridge to qa@localhost, then run the full E2EE + task
  # lifecycle verification inside the compose network.
  qa:
    build:
      context: ../web
      # Explicit: docker compose (CI) only auto-discovers "Dockerfile"; podman
      # accepts Containerfile without this.
      dockerfile: Containerfile
    profiles:
      - qa
    environment:
      API_URL: http://app:8080
      # In-network dev transport; TLS is the ingress's job in production.
      RELAY_URL: ws://relay:8799 # nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
      PAIRING_CODE: ${BUILD_PAIRING_CODE:-COMPOSE-PAIR}
      QA_EMAIL: qa@localhost
    command: ["/bin/sh", "-c", "node pair.mjs && node e2e.mjs && node qa.mjs"]
    depends_on:
      - app
      - relay
      - bridge
