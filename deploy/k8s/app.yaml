# The Skrift app: auth, device registry, gateway tokens, web push, SPA host.
# Secrets (build-app: SECRET_KEY, INTERNAL_API_SECRET, DATABASE_URL, VAPID_*,
# CF_TURN_KEY_ID, CF_TURN_KEY_API_TOKEN,
# SMTP_USERNAME, SMTP_PASSWORD,
# SMTP_FROM_ADDRESS, WAITLIST_NOTIFY_ADDRESS) come from
# deploy/k8s/bootstrap-secrets.sh — never from git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-app
spec:
  replicas: 1
  # Rolling, so a deploy never leaves the route without a ready pod (Recreate
  # did, for 25-40 s: Traefik answered 404 and dropped in-flight requests, #168).
  # The new pod starts beside the old one and takes traffic once /readyz
  # passes; only then is the old one taken out of the route and drained.
  # Both take new requests for seconds, and the old one answers stragglers for
  # the 15 s preStop. Nothing in the app must be single any more: migrations
  # run in the build-app-migrate Job before the rollout (migrate.yaml), and the
  # deploy announcement waits until the old pod is out of the route
  # (skriftapp/entrypoint.sh). The per-process state that remains (Skrift's
  # rate-limit and failed-login counters, the device-signed replay guards, the
  # permission and site-settings caches, in-memory notifications) was already
  # reset by every Recreate; the overlap only lets both copies answer for those
  # seconds. A migration must keep working for the previous image, which serves
  # on the new schema until the rollout ends (deploy/OPS.md, "Deploying the
  # app").
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: build-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: build-app
    spec:
      # Above the preStop sleep (15 s) plus hypercorn's graceful shutdown
      # (3 s to finish in-flight requests after SIGTERM), with room to spare.
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/zechcodes/build-app:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: SECRET_KEY
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: INTERNAL_API_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: DATABASE_URL
            # Web push (content-free attention notifications): the VAPID pair
            # the SPA subscribes with and /api/push/notify signs with.
            # `optional: true`: a build-app Secret from a pre-web-push bootstrap
            # run lacks these keys, and the app degrades gracefully without them
            # (push endpoints answer 503) — a missing key must not
            # CreateContainerConfigError the whole app. Re-run
            # bootstrap-secrets.sh to add them.
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: VAPID_PRIVATE_KEY
                  optional: true
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: VAPID_PUBLIC_KEY
                  optional: true
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: VAPID_SUBJECT
                  optional: true
            # Cloudflare TURN key (optional: absent = STUN-only). See bootstrap-secrets.sh.
            - name: CF_TURN_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: CF_TURN_KEY_ID
                  optional: true
            - name: CF_TURN_KEY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: CF_TURN_KEY_API_TOKEN
                  optional: true
            # Migrations run in the build-app-migrate Job before each rollout
            # (migrate.yaml), not on start: see skriftapp/entrypoint.sh.
            - name: BUILD_MIGRATE_ON_START
              value: "0"
            # Public release repository; keep aligned with the Actions variable.
            - name: RELEASES_REPO
              value: ZechCodes/build-releases
            # Outbound email (waitlist confirmation + owner notification) over
            # FastMail SMTP. The three SMTP keys are NOT optional: app.yaml
            # interpolates $SMTP_USERNAME, $SMTP_PASSWORD and $SMTP_FROM_ADDRESS
            # at config load and the app refuses to boot when one is unset, so a
            # partially-populated Secret must fail loudly here instead. The notify
            # address is optional — no yaml interpolates it and an absent value
            # just disables the owner notification, so it must never be able to
            # take the site down. bootstrap-secrets.sh adds all four together
            # from the operator's environment.
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: SMTP_PASSWORD
            - name: SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: SMTP_FROM_ADDRESS
            - name: WAITLIST_NOTIFY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: build-app
                  key: WAITLIST_NOTIFY_ADDRESS
                  optional: true
          # Keep serving while Traefik drops this pod. On deletion the kubelet
          # runs this hook while the EndpointSlice controller removes the pod,
          # and Traefik rebuilds its routes from that change (about 2 s: its
          # provider throttle, plus the watch). SIGTERM only comes after the
          # hook, so for 15 s, several times that propagation, every request
          # Traefik still routes here is answered. Then hypercorn stops
          # accepting and finishes what is in flight.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          # NOT `/`: that's Skrift's CMS home page, which 404s on a fresh site
          # (post-setup, pre-content) — failing readiness drops every traefik
          # route and liveness crash-loops the pod. /healthz always exists and
          # never touches the database, so liveness never restarts a pod over
          # a database outage; /readyz passes once this process has reached
          # the database and stays passing (buildapp/health_controller.py), so
          # a rollout waits for a pod that can serve, and a later outage never
          # drops the only pod (and the static site with it) from the route.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12 # 60s to boot; migrations run in the Job, not here
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: build-app
spec:
  selector:
    app.kubernetes.io/name: build-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: build-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    # TLS-only router: without this the route also binds traefik's plain-HTTP
    # `web` entrypoint, and whether http:// is redirected depends on unverified
    # cluster-wide config. Skrift session cookies must never ride cleartext.
    # (The cert-manager HTTP-01 solver creates its own ingress, so ACME still
    # works over port 80.)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - getbuild.ing
      secretName: getbuild-ing-tls
  rules:
    - host: getbuild.ing
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: build-app
                port:
                  name: http
