# Operator-owned bootstrap. Never include in kustomization or CI render/apply.
# The operator creates and rotates the token Secret separately.
# No direct Secret API access. Job/Deployment create plus pods/log is equivalent
# to reading dev secrets: workloads can mount them and print them. Accepted only
# because build-dev contains dev-scoped credentials and the development
# environment is protected (Zech as reviewer, main only).
# Ingress verbs can claim any Traefik host, including production's; the protected
# environment and pinned, reviewed render are the controls, not namespace RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: build-dev
  name: dev-deploy
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: build-dev
  name: dev-deploy
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: build-dev
  name: dev-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-deploy
subjects:
  - kind: ServiceAccount
    name: dev-deploy
    namespace: build-dev
