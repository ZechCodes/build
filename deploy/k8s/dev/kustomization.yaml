apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: build-dev
# Namespace, RBAC and secrets are operator-owned bootstrap, never CI-applied.
# render_dev.py splits this into migration/app/relay phases.
resources:
  - migrate.yaml
  - app.yaml
  - relay.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: build-dev
