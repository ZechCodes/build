# Migrate, then refuse app rollout until operator first-boot bootstrap is complete.
apiVersion: batch/v1
kind: Job
metadata:
  namespace: build-dev
  name: build-app-migrate
spec:
  # One retry covers a transient database blip. Skrift's alembic env runs the
  # whole upgrade in one transaction, and Postgres DDL is transactional, so a
  # failed attempt leaves nothing half-applied.
  backoffLimit: 1
  activeDeadlineSeconds: 600
  # Kept a day for its logs; the next deploy deletes it first either way.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: build-app-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/zechcodes/build-app-dev:unbuilt
          imagePullPolicy: Always
          command: ["python", "-m", "buildapp.dev_bootstrap", "migrate-check"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: build-app
          env:
            - name: RELEASES_REPO
              value: ZechCodes/build-releases
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
