# Redis Replica Configuration
# Configuration for Redis replica instances

# Include primary configuration
include /etc/redis/redis-primary.conf

# Network configuration for replica
port 6380
bind 127.0.0.1

# Replica configuration
replicaof 127.0.0.1 6379
masterauth ${REDIS_PASSWORD}
replica-serve-stale-data yes
replica-read-only yes
replica-priority 100

# Replica-specific persistence
dbfilename dump-replica.rdb
appendfilename "appendonly-replica.aof"

# Logging
logfile /var/log/redis/redis-replica.log

# Performance tuning for replica
replica-lazy-flush yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 1mb
repl-backlog-ttl 3600

# Replica buffer limits
client-output-buffer-limit replica 256mb 64mb 60