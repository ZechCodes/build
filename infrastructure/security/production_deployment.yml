# Production TLS Configuration for Build Platform
# Use with podman-compose for secure deployment

version: '3.8'

services:
  # Redis with TLS encryption
  redis-primary:
    image: redis:7-alpine
    container_name: build_redis_primary_secure
    command: >
      redis-server 
      --tls-port 6379 
      --port 0
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients yes
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
    networks:
      - session_internal
    volumes:
      - redis_data:/data
      - ./certs:/tls:ro
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cert", "/tls/redis.crt", "--key", "/tls/redis.key", "--cacert", "/tls/ca.crt", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Session Manager with TLS support
  session-manager:
    build:
      context: ../../session-manager
      dockerfile: Dockerfile.prod
    container_name: build_session_manager_secure
    depends_on:
      redis-primary:
        condition: service_healthy
    networks:
      - session_internal
      - session_external
    volumes:
      - ./certs:/certs:ro
    environment:
      # Redis TLS Configuration
      - REDIS_URL=rediss://redis-primary:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TLS_CA_CERT=/certs/ca.crt
      - REDIS_TLS_CLIENT_CERT=/certs/client.crt
      - REDIS_TLS_CLIENT_KEY=/certs/client.key
      
      # WebSocket Security
      - WEBSOCKET_ENFORCE_WSS=true
      - WEBSOCKET_ALLOWED_ORIGINS=https://app.buildplatform.dev,https://admin.buildplatform.dev
      - WEBSOCKET_VALIDATE_USER_AGENTS=true
      
      # Network Security
      - NETWORK_BIND_INTERNAL=true
      - SECURITY_MAX_CONNECTIONS_PER_IP=100
      
      # Application Security
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Reverse Proxy with SSL termination
  nginx-proxy:
    image: nginx:alpine
    container_name: build_nginx_proxy_secure
    depends_on:
      - session-manager
    ports:
      - "443:443"
      - "80:80"
    networks:
      - session_external
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
      - nginx_logs:/var/log/nginx
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certificate management
  certbot:
    image: certbot/certbot
    container_name: build_certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - nginx_logs:/var/log/letsencrypt
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - DOMAINS=${DOMAINS}
    profiles:
      - cert-renewal

volumes:
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  session_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
  session_external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

# Network security rules (iptables)
# These should be applied to the host system:
#
# # Allow HTTPS traffic
# iptables -A INPUT -p tcp --dport 443 -j ACCEPT
# iptables -A INPUT -p tcp --dport 80 -j ACCEPT
#
# # Block direct access to internal services
# iptables -A INPUT -p tcp --dport 6379 -s 172.20.0.0/24 -j ACCEPT
# iptables -A INPUT -p tcp --dport 6379 -j DROP
# iptables -A INPUT -p tcp --dport 8443 -s 172.21.0.0/24 -j ACCEPT
# iptables -A INPUT -p tcp --dport 8443 -j DROP
#
# # Default policies
# iptables -P INPUT DROP
# iptables -P FORWARD DROP