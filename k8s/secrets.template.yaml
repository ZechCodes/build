# Template for Kubernetes secrets
# DO NOT commit secrets.yaml to version control
#
# To encode a value: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: build-web-secrets
  labels:
    app: build-web
type: Opaque
data:
  # Application secret key (generate with: skrift secret)
  secret-key: <base64-encoded-secret-key>

  # GitHub OAuth credentials
  github-oauth-client-id: <base64-encoded-github-oauth-client-id>
  github-oauth-client-secret: <base64-encoded-github-oauth-client-secret>

  # Resend API key (transactional email)
  resend-api-key: <base64-encoded-resend-api-key>

# NOTE: Database (zech-sh-db) and Google OAuth (zech-sh-secrets) are
# shared from the zech.sh deployment in the same namespace.
