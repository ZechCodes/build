<title>Build — navigation storyboard #523</title>
<style>

  .sub { color: #83a0ab; font-size: 11px; margin-top: -10px; margin-bottom: 24px; }
  .source { display: inline-flex; border-bottom: 2px solid #66dba8; padding: 0 3px 10px; font-size: 12px; color: #bfd5de; }
  .branch { font-size: 12px; color: #809ca8; margin: 17px 0; }
  .stats { font-size: 11px; color: #809ca8; margin-bottom: 18px; }
  .green { color: #74dbaa; }
  .red { color: #d29795; }
  .file { padding: 13px 0; border-top: 1px solid #233e48; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b9cdd5; }
  .code { margin-top: 16px; background: #0d2028; border-radius: 7px; padding: 15px 10px; font: 11px/2 ui-monospace, monospace; color: #809fa8; }
  .code .add { display: block; color: #97d5ad; background: #17382b; margin: 0 -10px; padding: 0 10px; }
  .agents { height: 46px; position: absolute; bottom: 16px; left: 10px; right: 10px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #112830; border-radius: 10px; color: #93aeb7; }
  .avatar { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; background: #294d43; color: #a9e5ce; font-size: 10px; border: 1px solid #427461; }
  .avatar.dim { background: #243c47; border-color: #3c5766; color: #9cbdcf; }
  .home { position: absolute; bottom: 5px; width: 110px; height: 3px; border-radius: 4px; background: #64818d; left: 140px; }
  .task-tile { padding: 14px 12px; background: #142d36; border-radius: 8px; margin: 10px 0; font-size: 12px; color: #b5cbd4; line-height: 1.5; }

  .handle { width: 36px; height: 4px; background: #4d6672; border-radius: 10px; margin: 0 auto 16px; }
  .sheet-head { display: flex; align-items: center; margin-bottom: 14px; gap: 10px; }
  .sheet-head strong { font-size: 19px; font-weight: 600; }
  .close { margin-left: auto; color: #abc3ce; font-size: 12px; padding: 8px; }
  .search { height: 44px; border: 1px solid #3a5663; border-radius: 8px; color: #8aa5b0; padding: 12px; font-size: 13px; margin-bottom: 10px; }
  .scope { font-size: 11px; color: #87a6b2; display: flex; justify-content: space-between; margin: 16px 0 12px; }
  .scope b { color: #8ee4bf; font-weight: 500; }
  .group { margin: 22px 0 7px; color: #b6ccd5; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; padding: 0 10px; }
  .group.quiet { color: #86a0ac; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
  .dest { min-height: 48px; padding: 11px 10px; color: #c5d8e0; font-size: 13px; border-radius: 7px; display: flex; gap: 9px; align-items: center; }
  .dest small { color: #86a3b0; font-size: 10px; display: block; margin-top: 4px; }
  .dest .name { flex: 1; min-width: 0; }
  .badge { font-size: 10px; min-width: 18px; height: 18px; border-radius: 9px; background: #284d3e; color: #9befc9; display: grid; place-items: center; padding: 0 5px; }
  .current { font-size: 10px; color: #8eafa1; }
  .sheet-foot { position: absolute; bottom: 35px; left: 16px; right: 16px; border-top: 1px solid #304853; padding-top: 10px; color: #94b6c5; font-size: 12px; }
  .foot-link { display: flex; min-height: 36px; align-items: center; padding: 4px 10px; }
  .note { color: #96acb6; font-size: 13px; line-height: 1.5; margin: 22px 0 0; }
  .note strong { color: #c2d8d0; font-weight: 500; }
  .options { grid-template-columns: 390px 390px 1fr; }
  .explanation { padding: 84px 6px 0; }
  .explanation h3 { font-size: 19px; }
  .explanation p { color: #9eb1ba; font-size: 14px; line-height: 1.65; margin-bottom: 28px; }
  .cost { border-top: 1px solid #2b3e46; padding-top: 20px; color: #a6ebcf; font-size: 25px; }
  .chat { position: absolute; left: 10px; right: 10px; top: 130px; bottom: 66px; background: #102630; border-top: 1px solid #33515d; padding: 18px 18px 90px; }
  .chat.single { top: 86px; }
  .chat-head { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2b424e; padding-bottom: 18px; color: #bdd3dd; font-size: 13px; }
  .chat-text { font-size: 13px; line-height: 1.8; color: #a8c0cd; padding-top: 20px; }
  .chat-text p { margin: 0 0 22px; }
  .message { border-left: 2px solid #426f62; padding: 8px 12px; background: #18322f; border-radius: 0 6px 6px 0; }
  .composer { position: absolute; bottom: 16px; left: 14px; right: 14px; height: 65px; border: 1px solid #38535e; border-radius: 11px; padding: 14px; color: #698b9b; font-size: 12px; }
  .more-room { color: #7fcaa9; font-size: 11px; margin-top: 30px; padding: 14px 0; border-top: 1px dashed #3a6a57; }
  @media (max-width: 800px) { .page { width: 100%; padding: 24px 18px; } .frames { display: flex; overflow-x: auto; gap: 24px; padding: 2px 1px 18px; } .frame { flex: 0 0 390px; } nav { flex-wrap: wrap; } .mast { align-items: start; } .tag { max-width: 130px; text-align: right; } .story-title { align-items: start; flex-wrap: wrap; } .budget { margin-left: 0; } .explanation { flex: 0 0 280px; } }
  /* Revised direction from Zech, 2026-10-12. */
  .bar { height:44px; }
  .bar + .body { height:688px; }
  .project { flex:0 1 auto; width:auto; min-width:0; max-width:25%; padding:0; }
  .project.solo { flex:0 1 auto; font-size:13px; }
  .up { flex:0 0 44px; width:44px; height:44px; border:0; border-radius:7px; color:#a5c5bb; background:transparent; font-size:21px; display:grid; place-items:center; }
  .sheet { top:112px; bottom:238px; }
  .search { border:2px solid #66d6a8; color:#d2e9df; background:#0b2229; display:flex; align-items:center; padding:10px; }
  .cursor { height:18px; border-left:1px solid #9bffd1; margin-left:2px; }
  .sheet-foot { position:static; margin-top:22px; font-size:11px; }
  .sheet-foot .foot-link { min-height:29px; }
  .keyboard { position:absolute; bottom:0; left:0; right:0; height:238px; background:#263741; padding:12px 5px 24px; border-top:1px solid #53616a; }
  .keyrow { display:flex; justify-content:center; gap:5px; margin-bottom:9px; }
  .key { height:36px; min-width:32px; border-radius:5px; background:#45555e; color:#edf1f3; display:grid; place-items:center; font-size:16px; box-shadow:0 1px #142229; }
  .key.wide { min-width:49px; background:#35444d; }
  .key.space { width:180px; font-size:12px; }
  .key.go { background:#256746; min-width:70px; font-size:12px; }
  .keyboard-note { color:#8ea1ab; text-align:center; font-size:9px; margin-top:10px; }
</style>
<main class="page">
  <div class="mast"><span class="eyebrow">Build / Navigation study</span><span class="tag">#523 · Revised direction · Illustrative content</span></div>
  <h1>Go up. Go sideways. Go anywhere.</h1>
  <p class="intro">One 44px row. Up opens the project switcher; the project link fits its text; either switcher focuses search.</p>
  <nav aria-label="Storyboard scenes">
    <a href="#up">1 · Up to project</a><a href="#siblings">2 · Sibling workspace</a><a href="#across">3 · Across projects</a><a href="#options">4 · Revised bar detail</a>
  </nav>
  <div id="scenes"></div>
</main>
<script>
  const lock = '<svg width="18" height="21" viewBox="0 0 18 21" fill="none" aria-hidden="true"><rect x="3" y="9" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 9V5a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.5"/></svg>';
  const hot = (a, b) => a === b ? ' hot' : '';
  function bar({project='Build', workspace='navigation-plan', target='', projectPage=false, long=false}={}) {
    return `<div class="bar"><div class="inbox" aria-label="Inbox">☰</div><div class="bar-row"><button class="up${hot(target,'switch')}" aria-label="Switch project or workspace">↑</button><button class="crumb project${hot(target,'project')}"><span>${long?'Build platform':project}</span></button>${projectPage?'<button class="workspaces">Workspaces ▾</button>':`<span class="sep">/</span><button class="crumb workspace${hot(target,'workspace')}"><span>${long?'navigation-design-review':workspace}</span><b class="caret">▾</b></button><button class="lock" aria-label="Workspace unlocked">${lock}</button>`}</div></div>`;
  }
  function work({project='Build', workspace='navigation-plan', projectPage=false}={}) {
    const files = project==='Docs' ? ['release-notes.md','getting-started.md'] : workspace==='toolbar-fix' ? ['toolbarRender.js','shell.css'] : ['Navigation Spec.md','UI Design Brief.md'];
    return `<div class="body"><div class="rail"><div class="rail-icon${projectPage?' active':''}">▤</div><div class="rail-icon${projectPage?'':' active'}">±</div><div class="rail-icon">▱</div>${projectPage?'<div class="rail-icon">▦</div>':''}<div class="rail-icon bottom">⚙</div></div><div class="content">
    ${projectPage?`<h4>Tasks</h4><div class="sub">Project workspace · Original sources</div><div class="tiles"><div class="metric"><strong>2</strong>Needs you</div><div class="metric"><strong>4</strong>In progress</div></div><div class="sub">IN REVIEW</div><div class="task-tile">#523 · Navigation design<small>Planning · Ready for your decisions</small></div><div class="task-tile">#522 · Project workspace<small>Planning · Ready for your decisions</small></div><div class="sub" style="margin-top:28px">WORKING</div><div class="task-tile">Improve workspace toolbar<small>Agent working</small></div>`:
    `<h4>Changes</h4><div class="source">${project}</div><div class="branch">⑂ build/${workspace}</div><div class="stats">2 changed files &nbsp; <span class="green">+24</span> &nbsp; <span class="red">−8</span></div>${files.map(name=>`<div class="file"><span class="green">M</span><span class="file-name">${name}</span><span class="green">+12</span></div>`).join('')}<div class="code">Review changes in this workspace.<br><span class="add">+ Keep the next destination clear.</span><span class="add">+ Keep the project within reach.</span></div>`}</div></div>`;
  }
  function phone(opts={}) {
    return `<div class="phone"><div class="status"><span>9:41</span><span>▮▮▮ ▰</span></div><div class="shell">${bar(opts)}${work(opts)}</div><div class="agents"><div class="avatar">P</div><span style="opacity:.3">│</span><div class="avatar dim">N</div><span style="font-size:11px">${opts.projectPage?'Project agent':'Workspace agents'}</span></div><div class="home"></div>${opts.sheet?sheet(opts.sheet,opts.compact):''}${opts.chat?chat(opts.compact):''}</div>`;
  }
  function row(name, {meta='',badge='',current=false,active=false}={}) {
    return `<div class="dest${active?' hot':''}"><span class="name">${name}${meta?`<small>${meta}</small>`:''}</span>${current?'<span class="current">Current</span>':''}${badge?`<span class="badge">${badge}</span>`:''}</div>`;
  }
  function keyboard() {
    return `<div class="keyboard">${['qwertyuiop','asdfghjkl','zxcvbnm'].map((letters,i)=>`<div class="keyrow">${i===2?'<span class="key wide">⇧</span>':''}${[...letters].map(k=>`<span class="key">${k}</span>`).join('')}${i===2?'<span class="key wide">⌫</span>':''}</div>`).join('')}<div class="keyrow"><span class="key wide">123</span><span class="key space">space</span><span class="key go">Search</span></div><div class="keyboard-note">Illustrated software keyboard · Search receives focus on open</div></div>`;
  }
  function sheet(kind) {
    const sibling=kind==='siblings';
    return `<div class="scrim"></div><div class="sheet"><div class="handle"></div><div class="sheet-head"><strong>${sibling?'Workspaces in Build':'Switch to'}</strong><span class="close">Close</span></div><div class="search">${sibling?'tool':'release'}<span class="cursor"></span></div><div class="scope"><span>${sibling?'Build':'All projects · All devices'}</span>${sibling?'<b>All projects</b>':''}</div>${sibling?row('toolbar-fix',{badge:'3',active:true}):`<div class="group">Docs</div>${row('release-notes',{badge:'2',active:true})}`}<div class="scope">Search was focused immediately; typing filtered these results.</div>${sibling?'<div class="sheet-foot"><div class="foot-link">Manage workspaces →</div><div class="foot-link">New workspace…</div><div class="foot-link">Open review</div></div>':''}</div>${keyboard()}`;
  }
  function chat() {
    return `<div class="chat single"><div class="chat-head"><div class="avatar dim">N</div><strong>Navigation planner</strong><span class="spacer"></span><span>×</span></div><div class="chat-text"><p>The bar stays on one 44px row.</p><div class="message">The up-arrow opens the project switcher. The project name takes only the space its text needs.</div><p style="margin-top:24px">Opening either switcher focuses search immediately, including on a phone.</p><p>The lock stays visible. There is no separate row for a Switch button.</p></div><div class="composer">Message the agent…</div></div>`;
  }
  function frame(n,title,desc,opts) { return `<article class="frame"><div class="frame-caption"><span class="step">${n}</span><h3>${title}</h3><p>${desc}</p></div>${phone(opts)}</article>`; }
  const scenes = {
    up: { title:'Go up to the project', budget:'1 tap · Browser Back returns', frames:
      frame(1,'Start in navigation-plan','Your project and workspace have separate targets.',{})+
      frame(2,'Tap the project name','The green outline marks the control you touch.',{target:'project'})+
      frame(3,'Arrive at the project workspace','Its last face returns. Here, that is Tasks.',{projectPage:true}), note:'The project link is a return, not a menu. Browser Back restores the original workspace and exact place. The up-arrow and project link are separate targets.' },
    siblings: {title:'Move sideways within the project',budget:'2 taps + typing · No project-page detour',frames:
      frame(1,'Tap the workspace name','The name and caret open this project’s siblings.',{target:'workspace'})+
      frame(2,'Choose toolbar-fix','Search is focused. Type “tool”, then choose the result.',{sheet:'siblings'})+
      frame(3,'Continue in toolbar-fix','The project stays Build; the workspace changes.',{workspace:'toolbar-fix'}),note:'Project workspace returns up. Manage workspaces opens the management face. This chooser also includes unwatched workspaces.'},
    across: {title:'Jump straight into another project’s workspace',budget:'2 taps + typing · No intermediate page',frames:
      frame(1,'Tap the up-arrow','The leading action opens all project destinations.',{target:'switch'})+
      frame(2,'Choose Docs / release-notes','Search is focused. Type “release”, then choose.',{sheet:'across'})+
      frame(3,'Arrive directly in release-notes','Both breadcrumb names change. Back still returns to Build.',{project:'Docs',workspace:'release-notes'}),note:'Last visited is navigation history. The rail’s Recent still means quiet work. Choosing a project’s own row opens its project workspace.'},
    options: {title:'One row, a text-width project, and immediate search',budget:'44px high · Both switches remain direct',frames:
      frame(1,'Short project name','Build occupies its text width, not a reserved slot.',{target:'project'})+
      frame(2,'Long names yield independently','The arrow, caret and lock remain visible.',{long:true})+
      frame(3,'Chat keeps the recovered space','No fixed second toolbar row sits above the conversation.',{long:true,chat:true}),note:'This replaces the earlier A/B proposal. The ordinary toolbar is one 44px row. Task ancestry or large-text constraints may wrap without hiding parents.'}

  };
  document.querySelector('#scenes').innerHTML=Object.entries(scenes).map(([id,s])=>`<section class="scene" id="scene-${id}" hidden><div class="story-title"><h2>${s.title}</h2><span class="budget">${s.budget}</span></div><div class="frames">${s.frames}</div><p class="note"><strong>Behavior:</strong> ${s.note}</p></section>`).join('');
  function showScene() {
    const requested=location.hash.slice(1);
    const selected=Object.hasOwn(scenes,requested)?requested:'up';
    document.querySelectorAll('.scene').forEach(el=>el.hidden=el.id!==`scene-${selected}`);
    document.querySelectorAll('nav a').forEach(el=>{ const active=el.hash===`#${selected}`; el.classList.toggle('active',active); if(active) el.setAttribute('aria-current','page'); else el.removeAttribute('aria-current'); });
  }
  window.addEventListener('hashchange',showScene);
  showScene();
</script>
</html>
