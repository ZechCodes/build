version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: build_postgres_dev
    environment:
      POSTGRES_DB: build_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - build_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: build_redis_dev
    command: redis-server --appendonly yes --requirepass dev_password
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - build_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # MinIO S3 Storage
  minio:
    image: minio/minio:latest
    container_name: build_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - build_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Soft-serve Git Server
  softserve:
    image: charmcli/soft-serve:latest
    container_name: build_git_dev
    environment:
      SOFT_SERVE_INITIAL_ADMIN_KEYS: ""
    volumes:
      - softserve_data:/soft-serve
    ports:
      - "127.0.0.1:23231:23231"  # SSH
      - "127.0.0.1:23232:23232"  # HTTP
    networks:
      - build_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: build_api_dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:dev_password@postgres:5432/build_dev
      - REDIS_URL=redis://:dev_password@redis:6379/0
      - REDIS_PASSWORD=dev_password
      - JWT_SECRET=your-development-jwt-secret-change-in-production
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./api:/app:Z
      - api_cache:/app/.cache
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - build_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'


  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: build_frontend_dev
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app:Z
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - build_network
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  softserve_data:
    driver: local
  api_cache:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  build_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1