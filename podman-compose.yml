# Build v2 — local platform stack.
#
#   podman compose up -d --build relay bridge web
#   podman compose --profile qa run --rm qa     # end-to-end verification
#   open http://localhost:8080                  # the browser client
#
# Data path: browser (web) → relay → bridge → relay → browser, fully E2E
# encrypted. The relay never sees plaintext. The bridge runs the deterministic
# scripted agent (BRIDGE_QA_AGENT=1) so the full task lifecycle works without an
# LLM; point BRIDGE_REPO at a real repo and drop the flag for real agents.

services:
  relay:
    build:
      context: ./bridge
      dockerfile: Containerfile
      target: relay
    ports:
      - "8799:8799"
    restart: unless-stopped

  bridge:
    build:
      context: ./bridge
      dockerfile: Containerfile
      target: bridge
    environment:
      BRIDGE_RELAY_URL: ws://relay:8799
      BRIDGE_REPO: /repo
      BRIDGE_WORKTREES: /worktrees
      BRIDGE_BASE_BRANCH: main
      BRIDGE_QA_AGENT: "1"
    depends_on:
      - relay
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "8080:8080"
    depends_on:
      - relay
    restart: unless-stopped

  # One-shot end-to-end verification, run inside the compose network.
  qa:
    build:
      context: ./web
    profiles:
      - qa
    environment:
      RELAY_URL: ws://relay:8799
    command: ["node", "qa.mjs"]
    depends_on:
      - relay
      - bridge
