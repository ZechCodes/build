# Production config (SKRIFT_ENV defaults to "production"). Dev uses app.dev.yaml.
controllers:
  - buildapp.controllers:BuildController
  - buildapp.devices_controller:DevicesController
  - skrift.controllers.auth:AuthController
  - skrift.admin.controller:AdminController
models:
  - buildapp.models
db:
  # Injected by the deployment (k8s Secret) — postgresql+asyncpg://...
  url: $DATABASE_URL
auth:
  redirect_base_url: https://getbuild.ing
  methods:
    passkey:
      type: passkey
      label: Passkey
# Production CSP: everything same-origin (the SPA bundle is self-hosted, zero
# CDN); the browser additionally opens a WSS connection to the relay host.
security_headers:
  content_security_policy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://relay.getbuild.ing; worker-src 'self' blob:"
