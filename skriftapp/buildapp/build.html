<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build — review is the product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <style>
      :root {
        --bg:#fafafa; --panel:#fff; --ink:#18181b; --ink2:#52525b; --dim:#a1a1aa; --line:#e4e4e7;
        --line2:#f1f1f4; --accent:#5b62e8; --accent-soft:#eef0fe; --green:#16a34a; --green-bg:#f0fdf4;
        --red:#dc2626; --red-bg:#fef2f2; --amber:#b45309; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
      }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 "Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
      a { color:inherit; }
      .mono { font-family:var(--mono); }
      .dim { color:var(--dim); } .ink2 { color:var(--ink2); }
      /* top nav */
      nav { display:flex; align-items:center; gap:4px; padding:10px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
      nav .logo { font-weight:800; font-size:15px; margin-right:14px; letter-spacing:-.02em; }
      nav .tab { padding:5px 11px; border-radius:8px; font-size:13px; color:var(--ink2); cursor:pointer; display:flex; gap:6px; align-items:center; }
      nav .tab.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
      nav .badge { background:var(--accent); color:#fff; border-radius:999px; font-size:10px; padding:0 5px; font-weight:700; }
      nav .right { margin-left:auto; display:flex; align-items:center; gap:14px; font-size:12px; color:var(--ink2); }
      nav .dot { width:7px; height:7px; border-radius:999px; background:var(--green); display:inline-block; margin-right:5px; }
      nav .e2ee { border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; }
      nav .av { width:24px; height:24px; border-radius:999px; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:11px; font-weight:700; }
      main { max-width:1180px; margin:0 auto; padding:26px 22px 80px; }
      /* board */
      .board-head { display:flex; align-items:flex-start; margin-bottom:22px; }
      .board-head h1 { font-size:24px; margin:0 0 2px; letter-spacing:-.02em; }
      .board-head p { margin:0; color:var(--ink2); font-size:14px; }
      .btn { font:inherit; font-weight:600; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 14px; cursor:pointer; }
      .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
      .btn.primary:hover { filter:brightness(1.06); }
      .btn:disabled { opacity:.5; cursor:default; }
      .bucket { margin:26px 0 8px; }
      .bucket h2 { font-size:11px; letter-spacing:.08em; color:var(--dim); font-weight:700; text-transform:uppercase; margin:0 0 10px; display:flex; gap:8px; align-items:center; }
      .bucket h2 .n { background:var(--line); color:var(--ink2); border-radius:999px; padding:0 7px; font-size:10px; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 17px; margin-bottom:10px; cursor:pointer; transition:border-color .12s, box-shadow .12s; }
      .card:hover { border-color:#d4d4d8; box-shadow:0 1px 3px rgba(0,0,0,.04); }
      .card.quiet { background:#fcfcfd; }
      .card .top { display:flex; align-items:center; gap:10px; }
      .card .title { font-weight:650; font-size:15px; letter-spacing:-.01em; }
      .card .meta { margin-top:3px; font-family:var(--mono); font-size:11.5px; color:var(--dim); display:flex; gap:7px; flex-wrap:wrap; }
      .card .payload { margin-top:9px; color:var(--ink2); font-size:13px; }
      .chip { margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-radius:999px; padding:3px 9px; white-space:nowrap; }
      .chip.attn { background:var(--accent-soft); color:var(--accent); }
      .chip.work { background:#f4f4f5; color:var(--ink2); }
      .chip.done { background:var(--green-bg); color:var(--green); }
      .chip.warn { background:var(--red-bg); color:var(--red); }
      .tis { font-size:11px; color:var(--dim); margin-top:5px; }
      .empty { color:var(--dim); font-size:13px; padding:6px 0; }
      /* notifications */
      .ncard { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:15px 17px; margin-bottom:10px; }
      .ncard.read { opacity:.5; }
      .ncard .nhead { display:flex; align-items:center; gap:8px; font-weight:650; font-size:14px; }
      .ncard .nhead .nicon { color:var(--accent); font-size:13px; }
      .ncard .nhead.muted .nicon { color:var(--green); }
      .ncard .nhead.warn .nicon { color:var(--red); }
      .ncard .ngoal { margin-top:6px; font-size:14px; color:var(--ink); font-weight:550; }
      .ncard .nsub { color:var(--ink2); font-size:13px; margin-top:5px; }
      .ncard .nbranch { font-family:var(--mono); font-size:12px; color:var(--dim); margin-top:5px; }
      .ncard .nact { margin-top:12px; }
      /* notification message: rendered markdown, clamped by default, expandable */
      .ncard .nmsg { position:relative; max-height:5.5em; overflow:hidden; color:var(--ink2); font-size:13px; margin-top:6px; }
      .ncard .nmsg.expanded { max-height:none; }
      .ncard .nmsg:not(.expanded)::after { content:""; position:absolute; left:0; right:0; bottom:0; height:1.8em; background:linear-gradient(transparent, var(--panel)); pointer-events:none; }
      .ncard .nmsg > :first-child { margin-top:0; }
      .ncard .nmsg p { margin:5px 0; }
      .ncard .nmsg h1 { font-size:15px; margin:8px 0 4px; } .ncard .nmsg h2 { font-size:14px; margin:8px 0 4px; } .ncard .nmsg h3 { font-size:13px; margin:6px 0 3px; }
      .ncard .nmsg ul,.ncard .nmsg ol { margin:5px 0; padding-left:20px; } .ncard .nmsg li { margin:2px 0; }
      .ncard .nmsg code { font-family:var(--mono); font-size:12px; background:var(--line2); padding:1px 5px; border-radius:5px; }
      .ncard .nmsg pre { background:#f4f4f5; padding:10px 12px; border-radius:8px; overflow:auto; } .ncard .nmsg pre code { background:none; padding:0; }
      .ncard .nmsg-toggle { color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; margin-top:6px; display:none; }
      /* settings stub */
      .settings-intro { color:var(--ink2); font-size:14px; max-width:620px; margin-bottom:18px; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; max-width:620px; }
      .panel h3 { margin:0 0 12px; font-size:14px; display:flex; align-items:center; gap:8px; }
      .panel .row { display:flex; gap:12px; padding:8px 0; border-top:1px solid var(--line2); font-size:13px; }
      .panel .row:first-of-type { border-top:0; }

      .panel .row .v { color:var(--ink2); }
      .panel .row.last .k { color:var(--green); }
      /* task view */

      .thead { display:flex; align-items:center; gap:12px; }
      .thead h1 { font-size:21px; margin:0; letter-spacing:-.02em; }
      .thead .right { margin-left:auto; display:flex; gap:10px; align-items:center; color:var(--dim); font-size:12px; }
      .kbd { font-family:var(--mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:11px; color:var(--ink2); }
      .tmeta { font-family:var(--mono); font-size:12px; color:var(--dim); margin:5px 0 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; }
      .tabs .t { padding:9px 14px; font-size:13px; color:var(--ink2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; gap:7px; align-items:center; }
      .tabs .t.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
      .tabs .t .n { background:var(--line); color:var(--ink2); border-radius:999px; padding:0 6px; font-size:10px; }
      /* plan */
      .plan { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px 30px; max-width:780px; }
      .plan h1 { font-size:20px; margin:0 0 12px; } .plan h2 { font-size:15px; margin:18px 0 6px; }
      .plan h3 { font-size:13.5px; margin:14px 0 5px; } .plan p { margin:8px 0; color:#27272a; }
      .plan ul,.plan ol { margin:6px 0; padding-left:22px; } .plan li { margin:3px 0; }
      .plan code { font-family:var(--mono); font-size:12.5px; background:var(--line2); padding:1px 5px; border-radius:5px; }
      .plan pre { background:#f4f4f5; padding:12px 14px; border-radius:8px; overflow:auto; } .plan pre code { background:none; padding:0; }
      .plan-loading { color:var(--dim); padding:30px; text-align:center; }
      .plan ::selection, .plan::selection { background:#c7d2fe; }
      .plan mark.phl { background:#fde68a; border-radius:2px; padding:0 1px; }
      /* plan review comments */
      .plan-feedback { max-width:780px; margin-top:14px; }
      .plan-general { width:100%; min-height:60px; margin-top:8px; }
      .pcomment { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:8px 30px 8px 12px; margin-bottom:8px; font-size:13px; position:relative; }
      .pcomment .psnip { color:var(--ink2); font-style:italic; font-size:12px; border-left:2px solid var(--line); padding-left:8px; margin-bottom:5px; display:block; }
      .pcomment .pctext { color:var(--ink); }
      .pcomment .pcx { position:absolute; top:6px; right:10px; cursor:pointer; color:var(--dim); font-size:15px; line-height:1; }
      .pcomment .pcx:hover { color:var(--red); }
      .comment-pop { position:fixed; z-index:60; background:#18181b; border-radius:9px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.28); display:flex; gap:6px; align-items:center; }
      .comment-pop button { font:inherit; background:var(--accent); color:#fff; border:none; border-radius:6px; padding:5px 10px; cursor:pointer; font-weight:600; font-size:12px; }
      .comment-pop input { font:inherit; border:none; border-radius:6px; padding:6px 9px; width:240px; color:var(--ink); }
      /* diff */
      .diffbar { display:flex; align-items:center; gap:14px; font-family:var(--mono); font-size:12px; color:var(--ink2); margin-bottom:12px; }
      .file { background:var(--panel); border:1px solid var(--line); border-radius:11px; margin-bottom:12px; overflow:hidden; }
      .file .fhead { display:flex; align-items:center; gap:9px; padding:9px 13px; border-bottom:1px solid var(--line2); font-family:var(--mono); font-size:12.5px; }
      .file .fhead .fb { font-size:9px; font-weight:700; letter-spacing:.04em; padding:1px 5px; border-radius:4px; }
      .fb.EDIT { background:var(--accent-soft); color:var(--accent); } .fb.ADD { background:var(--green-bg); color:var(--green); } .fb.DEL { background:var(--red-bg); color:var(--red); }
      .file .fhead .pm { margin-left:auto; font-size:11px; } .pm .a { color:var(--green); } .pm .d { color:var(--red); }
      .file table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px; }
      .file td { padding:0 8px; white-space:pre; vertical-align:top; }
      .file td.ln { width:1%; text-align:right; color:var(--dim); user-select:none; background:#fcfcfd; border-right:1px solid var(--line2); cursor:pointer; }
      .file td.ln:hover { color:var(--accent); }
      .file ::selection { background:#c7d2fe; }
      tr.dhl td { background:#fef3c7 !important; } tr.dhl td.ln { background:#fde68a !important; color:#92400e; }
      /* github-style split action button */
      .splitbtn { position:relative; display:inline-flex; }
      .splitbtn .btn.primary { border-top-right-radius:0; border-bottom-right-radius:0; }
      .splitbtn .caret { border-top-left-radius:0; border-bottom-left-radius:0; border-left:1px solid rgba(255,255,255,.3); padding:8px 9px; }
      .splitmenu { position:absolute; bottom:calc(100% + 6px); right:0; min-width:180px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.16); overflow:hidden; z-index:25; }
      .splitmenu[hidden] { display:none; }
      .splitmenu .mi { padding:9px 13px; font-size:13px; cursor:pointer; display:flex; flex-direction:column; gap:1px; }
      .splitmenu .mi:hover { background:var(--accent-soft); }
      .splitmenu .mi .mt { color:var(--ink); font-weight:550; }
      .splitmenu .mi .md { color:var(--dim); font-size:11px; }
      tr.add td { background:var(--green-bg); } tr.add td.code { color:#14532d; }
      tr.del td { background:var(--red-bg); } tr.del td.code { color:#7f1d1d; }
      tr.hunk td { background:#f6f6fb; color:var(--accent); }
      .actionbar { position:sticky; bottom:0; background:linear-gradient(to top,var(--bg) 70%,transparent); padding:14px 0 4px; display:flex; align-items:center; gap:12px; margin-top:6px; }
      .actionbar .hint { color:var(--dim); font-size:12.5px; }
      .actionbar .right { margin-left:auto; display:flex; gap:10px; }
      /* new task sheet */
      .scrim { position:fixed; inset:0; background:rgba(24,24,27,.32); display:none; align-items:flex-start; justify-content:center; padding-top:9vh; z-index:30; }
      .scrim.show { display:flex; }
      .sheet { background:var(--panel); width:min(620px,92vw); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.18); padding:22px 24px; }
      .sheet h3 { margin:0 0 3px; font-size:17px; } .sheet .sub { color:var(--ink2); font-size:13px; margin-bottom:14px; }
      textarea { width:100%; min-height:96px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 13px; font:inherit; resize:vertical; }
      .field { margin-top:12px; display:flex; flex-direction:column; gap:5px; }
      .field label { font-size:12px; color:var(--ink2); font-weight:600; }
      .sheet select { font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); }
      .addproj { display:flex; gap:8px; margin-top:14px; }

      .addproj input.path { flex:1; }
      .adderr { color:var(--red); font-size:12px; margin-top:8px; min-height:14px; }
      .btn.mini { padding:4px 9px; font-size:12px; }

      .projfolder code { font-family:var(--mono); font-size:11.5px; background:var(--line2); padding:2px 6px; border-radius:5px; }
      .manualadd { margin-top:12px; } .manualadd summary { font-size:12px; color:var(--dim); cursor:pointer; }
      .browse-path { font-family:var(--mono); font-size:11.5px; color:var(--ink2); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 10px; margin:10px 0 6px; overflow:auto; white-space:nowrap; }
      .browse-toggle { margin:0 0 10px; font-size:12px; color:var(--ink2); }
      .browse-list { max-height:44vh; overflow:auto; border:1px solid var(--line); border-radius:10px; }
      .browse-row { display:flex; align-items:center; gap:10px; padding:8px 11px; border-top:1px solid var(--line2); font-size:13px; }
      .browse-row:first-child { border-top:0; }
      .browse-row.nav { cursor:pointer; }
      .browse-row.nav:hover { background:var(--accent-soft); }
      .browse-row .bname { flex:1; }
      .browse-row .bgit { font-size:9px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:1px 5px; border-radius:4px; }
      /* text inputs in modals/sheets */
      .sheet input:not([type=checkbox]) { font:inherit; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); }
      .field input { width:100%; }
      .locrow { display:flex; gap:8px; align-items:center; }
      .locrow input { cursor:default; color:var(--ink2); }
      .sheet input:not([type=checkbox]):focus, .sheet select:focus, .sheet textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
      .projrow { display:flex; gap:12px; padding:8px 0; border-top:1px solid var(--line2); font-size:13px; align-items:baseline; }
      .projrow:first-child { border-top:0; }
      .projrow .pname { font-weight:600; min-width:120px; }
      .projrow .ppath { font-family:var(--mono); font-size:11.5px; color:var(--dim); }
      .projrow .premote { font-family:var(--mono); font-size:11px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:230px; }
      .projrow .setremote { margin-left:auto; flex:none; }
      .sheet .row { display:flex; align-items:center; gap:10px; margin-top:13px; }
      .sheet .yolo { color:var(--dim); font-size:11.5px; margin-top:12px; line-height:1.4; }
      .toggle { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink2); cursor:pointer; }
      /* terminal drawer */
      #drawer { position:fixed; left:0; right:0; bottom:0; height:46vh; background:#15161e; border-top:1px solid #2a2a3a; transform:translateY(100%); transition:transform .18s ease; z-index:40; display:flex; flex-direction:column; }
      #drawer.show { transform:translateY(0); }
      #drawer .dh { display:flex; align-items:center; gap:10px; padding:7px 14px; border-bottom:1px solid #2a2a3a; color:#a9b1d6; font-family:var(--mono); font-size:12px; }
      #drawer .dh .x { margin-left:auto; cursor:pointer; color:#7a82a8; }
      #term { flex:1; overflow:hidden; padding:6px 10px; }
      /* Mid-session offline: pause bridge-backed actions in the main view. Api-only

      body.offline #root .btn.primary { opacity: .45; pointer-events: none; }
      body.offline #root #adddev { opacity: 1; pointer-events: auto; }

    <script type="module">
      import * as transport from "@build/secure-transport";

      const GATEWAY = "ws://localhost:18090";
      const USER = "{{USER}}";
      const $ = (s, r = document) => r.querySelector(s);
      const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
      const esc = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // ---- E2EE session ----
      // ---------- relay session (offline-aware) ----------
      // One live session at a time. The relay pushes control frames on the same
      // socket the RPC envelopes ride: device_offline (our bridge dropped) and
      // device_key (a bridge came online). RPC replies resolve through a pending map
      // with timeouts, so calls fail fast instead of hanging on a dead session.
      let sessionGen = 0;
      const Live = { ws: null, deviceId: null, pending: new Map(), reqId: 0 };

      async function openSession({ waitForDevice = false } = {}) {
        await transport.ready?.();
        const gen = ++sessionGen;
        // The api mints a short-lived gateway token for our logged-in session; the
        // relay validates it and routes us only to devices we own.
        const { token } = await fetch("/api/gateway-token", { method: "POST" }).then((r) => r.json());
        const ws = new WebSocket(`${GATEWAY}/ws/client`);
        const q = [], w = [];
        let live = false, key = null, deviceId = null;
        const deliver = (m) => (w.length ? w.shift()(m) : q.push(m));
        ws.addEventListener("message", async (e) => {
          const m = JSON.parse(e.data);
          if (!live) return deliver(m);   // handshake phase: recvType drains the queue
          // Live phase: control frames drive offline handling; envelopes resolve RPCs.
          if (m.type === "device_offline") { if (gen === sessionGen && m.device_id === deviceId) goOffline(); return; }
          if (m.type !== "e2ee_envelope") return;
          let f; try { f = await transport.decryptEnvelope({ sessionKeyB64: key, envelope: m.envelope }); } catch { return; }
          const p = f.payload, pend = p && p.id !== undefined ? Live.pending.get(p.id) : null;
          if (pend) { Live.pending.delete(p.id); p.ok ? pend.resolve(p.result) : pend.reject(new Error(p.error)); }
        });
        ws.addEventListener("close", () => {
          if (!live) deliver({ type: "__closed" });        // fail the handshake cleanly
          else if (gen === sessionGen) goOffline();        // relay/network dropped us
        });
        const recv = () => new Promise((res) => (q.length ? res(q.shift()) : w.push(res)));
        const recvType = async (type) => { for (;;) { const m = await recv(); if (m.type === "__closed") throw new Error("connection closed"); if (m.type === type) return m; } };
        const send = (o) => ws.send(JSON.stringify(o));
        await new Promise((res, rej) => { ws.addEventListener("open", res); ws.addEventListener("error", rej); });
        send({ type: "authenticate", token });
        // Wait for our device's key. At boot we give up after 8s (the gate shows the
        // waiting screen); during a resume we wait as long as it takes — this socket
        // IS the "tell me when a device comes back" channel.
        const hello = waitForDevice
          ? await recvType("device_key")
          : await Promise.race([
              recvType("device_key"),
              new Promise((_, rej) => setTimeout(() => rej(new Error("no device online")), 8000)),
            ]);
        deviceId = hello.device_id;
        const sid = "sess-" + Math.random().toString(36).slice(2, 10);
        const { sessionKeyB64, sessionInit } = await transport.createSessionInit({ sessionId: sid, deviceId, deviceTransportPublicKeyB64: hello.transport_public_key });
        send({ type: "session_init", session_id: sid, session_init: sessionInit });
        await transport.openSessionAccept({ sessionKeyB64, envelope: (await recvType("session_accept")).envelope });
        key = sessionKeyB64; live = true;
        Live.ws = ws; Live.deviceId = deviceId;
        async function call(method, params = {}, timeoutMs = 12000) {
          if (App.offline) throw new Error("your device is offline — reconnecting…");
          const rid = "r" + ++Live.reqId;
          const env = await transport.encryptFrame({ sessionKeyB64, outerFields: { session_id: sid, route_to: `device:${deviceId}` }, frameFields: { frame_type: "data", sender: "client", payload: { method, id: rid, params } } });
          const reply = new Promise((resolve, reject) => Live.pending.set(rid, { resolve, reject }));
          send({ type: "e2ee_envelope", session_id: sid, envelope: env });
          return Promise.race([reply, new Promise((_, rej) => setTimeout(() => { Live.pending.delete(rid); rej(new Error(`${method} timed out`)); }, timeoutMs))]);
        }
        return { call };
      }

      const App = { call: null, route: { name: "board" }, poll: null, readIds: new Set(), offline: false };

      // ---------- mid-session offline handling ----------
      // The relay pushes device_offline the instant our bridge drops; the socket's
      // own close event covers relay/network loss. Degrade quietly: banner + amber
      // dot, freeze the current view (the polls fail fast and skip re-rendering, so
      // in-progress typing/reading is untouched), pause bridge-backed actions — then
      // resume silently the moment a device is back.
      let reconnectTimer = null, reconnectDelay = 0;
      function goOffline() {
        if (App.offline) return;
        App.offline = true;
        sessionGen++;                                  // invalidate the dead session's handlers
        try { Live.ws?.close(); } catch { /* already gone */ }
        for (const { reject } of Live.pending.values()) reject(new Error("your device went offline"));
        Live.pending.clear();
        document.body.classList.add("offline");
        $("#offbar").hidden = false;
        $("#conn").innerHTML = '<span class="dot" style="background:#d29922"></span>reconnecting…';
        resume();
      }

      async function resume() {
        if (!App.offline || App._resuming) return;
        App._resuming = true;
        try {
          // Blocks until a device is online: the fresh authenticated socket receives
          // the relay's device_key push the moment a bridge returns.
          const s = await openSession({ waitForDevice: true });
          App.call = s.call;
          App.offline = false;
          reconnectDelay = 0;
          document.body.classList.remove("offline");
          $("#offbar").hidden = true;
          $("#conn").innerHTML = '<span class="dot"></span>connected';
          // The board holds no user input, so refreshing it is safe; the task view's
          // own poll resumes and its key-diffing preserves in-progress work.
          if (App.route.name === "board") render();
        } catch {
          // Relay unreachable — retry with backoff until it's back.
          reconnectDelay = Math.min((reconnectDelay || 1000) * 2, 15000);
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(resume, reconnectDelay);
        } finally {
          App._resuming = false;
        }
      }

      // Tasks that are waiting on the user (the board's "NEEDS YOU" bucket).
      function attnTasks(tasks) { return tasks.filter((t) => t.needs_attention && t.state !== "merged" && t.state !== "abandoned"); }
      function setBadge(tasks) {
        const unread = attnTasks(tasks).filter((t) => !App.readIds.has(t.task_id)).length;
        const b = $("#notif"); b.style.display = unread ? "inline-block" : "none"; b.textContent = unread;
      }
      function setActiveNav(name) {
        const target = { board: "#nav-board", notifications: "#nav-notif", settings: "#nav-settings" }[name] || "#nav-board";
        ["#nav-board", "#nav-notif", "#nav-settings"].forEach((s) => $(s).classList.toggle("active", s === target));
      }

      // ---------- helpers ----------
      const STATE_LABEL = { plan_review: "READY TO REVIEW", review: "READY TO REVIEW", planning: "PLANNING", building: "BUILDING", created: "CREATED", merged: "MERGED", abandoned: "ABANDONED", blocked: "BLOCKED", failed: "FAILED" };
      function chipClass(s) { if (s === "blocked" || s === "failed") return "warn"; if (s === "merged") return "done"; if (s === "plan_review" || s === "review") return "attn"; return "work"; }
      function payloadFor(t) {
        if (t.summary) return t.summary;
        if (t.state === "planning") return "drafting plan…";
        if (t.state === "building") return "coding agent working…";
        return "";
      }
      function renderMarkdown(md) {
        const lines = (md || "").split("\n"); let html = "", inCode = false, inList = false;
        const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        for (const ln of lines) {
          if (ln.startsWith("```")) { inCode = !inCode; html += inCode ? "<pre><code>" : "</code></pre>"; continue; }
          if (inCode) { html += esc(ln) + "\n"; continue; }
          const li = ln.match(/^\s*[-*]\s+(.*)/) || ln.match(/^\s*\d+\.\s+(.*)/);
          if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
          if (inList) { html += "</ul>"; inList = false; }
          if (ln.startsWith("### ")) html += `<h3>${inline(ln.slice(4))}</h3>`;
          else if (ln.startsWith("## ")) html += `<h2>${inline(ln.slice(3))}</h2>`;
          else if (ln.startsWith("# ")) html += `<h1>${inline(ln.slice(2))}</h1>`;
          else if (ln.trim()) html += `<p>${inline(ln)}</p>`;
        }
        if (inList) html += "</ul>"; if (inCode) html += "</code></pre>";
        return html;
      }
      function parseDiff(patch) {
        const files = []; let cur = null, o = 0, n = 0;
        for (const ln of (patch || "").split("\n")) {
          if (ln.startsWith("diff --git")) { const m = ln.match(/ b\/(.+)$/); cur = { path: m ? m[1] : "?", status: "EDIT", add: 0, del: 0, rows: [] }; files.push(cur); }
          else if (!cur) continue;
          else if (ln.startsWith("new file")) cur.status = "ADD";
          else if (ln.startsWith("deleted file")) cur.status = "DEL";
          else if (ln.startsWith("index ") || ln.startsWith("--- ") || ln.startsWith("+++ ")) continue;
          else if (ln.startsWith("@@")) { const m = ln.match(/@@ -(\d+).* \+(\d+)/); o = m ? +m[1] : 0; n = m ? +m[2] : 0; cur.rows.push({ t: "hunk", text: ln }); }
          else if (ln.startsWith("+")) { cur.add++; cur.rows.push({ t: "add", n: n++, text: ln.slice(1) }); }
          else if (ln.startsWith("-")) { cur.del++; cur.rows.push({ t: "del", o: o++, text: ln.slice(1) }); }
          else { cur.rows.push({ t: "ctx", o: o++, n: n++, text: ln.slice(1) }); }
        }
        return files;
      }

      // ---------- views ----------
      function go(route) { App.route = route; render(); }

      function render() {
        if (App.poll) { clearInterval(App.poll); App.poll = null; }
        setActiveNav(App.route.name);
        if (App.route.name === "board") renderBoard();
        else if (App.route.name === "notifications") renderNotifications();
        else if (App.route.name === "settings") renderSettings();
        else renderTask();
      }

      async function renderBoard() {
        const root = $("#root");
        const draw = (tasks) => {
          const byBucket = { attn: [], work: [], done: [] };
          for (const t of tasks) {
            if (t.state === "merged" || t.state === "abandoned") byBucket.done.push(t);
            else if (t.needs_attention) byBucket.attn.push(t);
            else byBucket.work.push(t);
          }
          const card = (t, quiet) => `
            <div class="card ${quiet ? "quiet" : ""}" data-id="${t.task_id}">
              <div class="top"><span class="title">${esc(t.goal)}</span>
                <span class="chip ${chipClass(t.state)}">${STATE_LABEL[t.state] || t.state}</span></div>
              <div class="meta"><span>${esc(t.project)}</span><span>·</span><span>${esc(t.branch)}</span><span>·</span><span>${esc(t.harness)}</span></div>
              ${payloadFor(t) ? `<div class="payload">${esc(payloadFor(t))}</div>` : ""}
            </div>`;
          const bucket = (label, items, quiet) => items.length ? `
            <div class="bucket"><h2>${label} <span class="n">${items.length}</span></h2>${items.map((t) => card(t, quiet)).join("")}</div>` : "";
          root.innerHTML = `
            <div class="board-head"><div><h1>Board</h1><p>What needs you — and what doesn't.</p></div>
              <button class="btn primary" id="newtask" style="margin-left:auto">+ New task</button></div>
            ${byBucket.attn.length || byBucket.work.length || byBucket.done.length ? "" : '<div class="empty">No tasks yet — start one with “New task”.</div>'}
            ${bucket("NEEDS YOU", byBucket.attn, false)}
            ${bucket("WORKING", byBucket.work, true)}
            ${bucket("DONE", byBucket.done, true)}`;
          $("#newtask").onclick = openNewTask;
          root.querySelectorAll(".card").forEach((c) => (c.onclick = () => go({ name: "task", id: c.dataset.id, tab: "plan" })));
          setBadge(tasks);
        };
        const load = async () => { try { draw((await App.call("task.list")).tasks); } catch (e) {} };
        await load();
        App.poll = setInterval(load, 2500);
      }

      // Notifications: every actionable task state becomes one decision-carrying card.
      function notifEvent(t) {
        if (t.state === "plan_review") return { icon: "✦", tone: "", title: "Plan ready to review", sub: payloadFor(t) || "A planning agent finished drafting the plan.", action: "Review plan", tab: "plan", primary: true };
        if (t.state === "review") return { icon: "✦", tone: "", title: "Build ready to review", sub: t.summary || "The coding agent finished. Review the diff.", action: "Review diff", tab: "diff", primary: true };
        if (t.state === "blocked") return { icon: "▲", tone: "warn", title: "Build blocked", sub: t.summary || "The agent needs your input to continue.", action: "View task", tab: "diff", primary: false };
        if (t.state === "failed") return { icon: "▲", tone: "warn", title: "Build failed", sub: t.summary || "The build did not complete.", action: "View task", tab: "diff", primary: false };
        if (t.state === "merged") return { icon: "✓", tone: "muted", title: "Merge complete", branch: `${t.branch} → ${t.base_branch || "main"}`, action: "View task", tab: "diff", primary: false };
        return null;
      }
      async function renderNotifications() {
        const root = $("#root");
        const expanded = new Set(); // task ids whose message is expanded (survives polling)
        const draw = (tasks) => {
          setBadge(tasks);
          const events = tasks.map((t) => ({ t, e: notifEvent(t) })).filter((x) => x.e);
          events.sort((a, b) => (a.t.state === "merged") - (b.t.state === "merged"));
          const card = ({ t, e }) => `
            <div class="ncard ${e.primary && App.readIds.has(t.task_id) ? "read" : ""}" data-id="${t.task_id}">
              <div class="nhead ${e.tone}"><span class="nicon">${e.icon}</span><span>${e.title}</span></div>
              <div class="ngoal">${esc(t.goal)}</div>
              ${e.sub ? `<div class="nmsg">${renderMarkdown(e.sub)}</div><div class="nmsg-toggle">Show more</div>` : ""}
              ${e.branch ? `<div class="nbranch">${esc(e.branch)}</div>` : ""}
              <div class="nact"><button class="btn ${e.primary ? "primary" : ""}" data-id="${t.task_id}" data-tab="${e.tab}">${e.action}</button></div>
            </div>`;
          const hasUnread = attnTasks(tasks).some((t) => !App.readIds.has(t.task_id));
          root.innerHTML = `
            <div class="board-head"><div><h1>Notifications</h1><p>Every card carries its decision. No dead-end pings.</p></div>
              ${hasUnread ? '<button class="btn" id="markread" style="margin-left:auto">Mark all read</button>' : ""}</div>
            ${events.length ? events.map(card).join("") : '<div class="empty">You’re all caught up.</div>'}`;
          root.querySelectorAll(".nact button").forEach((b) => (b.onclick = () => go({ name: "task", id: b.dataset.id, tab: b.dataset.tab })));
          const mr = $("#markread"); if (mr) mr.onclick = () => { attnTasks(tasks).forEach((t) => App.readIds.add(t.task_id)); draw(tasks); };
          // Measure each message (collapsed) and only offer expand when it overflows.
          root.querySelectorAll(".ncard").forEach((cardEl) => {
            const msg = cardEl.querySelector(".nmsg"); const tog = cardEl.querySelector(".nmsg-toggle");
            if (!msg || !tog) return;
            const id = cardEl.dataset.id;
            if (msg.scrollHeight > msg.clientHeight + 2) {
              tog.style.display = "block";
              const apply = () => { const exp = expanded.has(id); msg.classList.toggle("expanded", exp); tog.textContent = exp ? "Show less" : "Show more"; };
              apply();
              tog.onclick = () => { expanded.has(id) ? expanded.delete(id) : expanded.add(id); apply(); };
            } else { expanded.delete(id); }
          });
        };
        const load = async () => { try { draw((await App.call("task.list")).tasks); } catch (e) {} };
        await load();
        App.poll = setInterval(load, 2500);
      }

      // Settings: Projects control which repo agents work on; the privacy story is
      // static; device & key management lands next.
      async function renderSettings() {
        $("#root").innerHTML = `
          <div class="board-head"><div><h1>Settings</h1><p>Your keys, your custody.</p></div></div>
          <div class="panel">
            <h3>📁 Projects</h3>
            <div id="projlist"><span class="dim" style="font-size:13px">loading…</span></div>
            <div class="addproj">
              <button class="btn primary" id="newrepo">New repo…</button>
              <button class="btn" id="browseadd">Browse for a repo…</button>
              <button class="btn" id="cloneadd">Clone from URL…</button>
            </div>
            <div class="projfolder">Projects folder: <code id="pdir">…</code>
              <button class="btn mini" id="changedir">Change…</button>
              <span class="dim">clones land here</span></div>
            <details class="manualadd"><summary>or enter a path manually</summary>
              <div class="addproj"><input id="projpath" class="path" placeholder="~/code/your-repo" />
                <input id="projbranch" placeholder="auto" style="max-width:90px" />
                <button class="btn" id="addproj">Add</button></div></details>
            <div class="adderr" id="adderr"></div>
          </div>
          <p class="settings-intro" style="margin-top:18px">Build's servers move ciphertext. Every device holds its own key, and only paired devices can read your tasks, plans, and diffs.</p>
          <div class="panel">
            <h3>🔒 What our servers see</h3>
            <div class="row"><span class="k">Routing IDs</span><span class="v">which device a blob is for — random identifiers, no names</span></div>
            <div class="row"><span class="k">Ciphertext sizes</span><span class="v">how big each encrypted blob is</span></div>
            <div class="row"><span class="k">Timing</span><span class="v">when blobs move</span></div>
            <div class="row last"><span class="k">Nothing else</span><span class="v">no goals, no plans, no diffs, no terminal bytes — content decrypts only on your devices</span></div>
          </div>
          <div class="panel">
            <h3>📱 Devices &amp; keys</h3>
            <div class="dim" style="font-size:13px;margin-bottom:8px">Only paired devices can read your tasks. When you add one, confirm its fingerprint matches what the bridge printed.</div>
            <div id="devlist"><span class="dim" style="font-size:13px">loading…</span></div>
            <div class="addproj"><button class="btn primary" id="adddev">Add a device…</button></div>
            <div class="adderr" id="deverr"></div>
          </div>`;

        const refresh = async () => {
          try {
            const { projects } = await App.call("project.list");
            $("#projlist").innerHTML = projects.map((p) => `
              <div class="projrow"><span class="pname">${esc(p.name)}</span>
                <span class="ppath">${esc(p.path)}</span><span class="dim" style="font-size:11.5px">${esc(p.base_branch)}</span>
                <span class="premote">${p.remote ? "⇄ " + esc(p.remote) : '<span class="dim">no remote</span>'}</span>
                <button class="btn mini setremote" data-id="${esc(p.project_id)}">Set remote…</button></div>`).join("")
              || '<div class="dim" style="font-size:13px">No projects yet.</div>';
            const { projects_dir } = await App.call("settings.get");
            $("#pdir").textContent = projects_dir;
            $("#projlist").querySelectorAll(".setremote").forEach((btn) => (btn.onclick = () => {
              const proj = projects.find((p) => p.project_id === btn.dataset.id);
              openSetRemote(proj, refresh);
            }));
          } catch (e) { $("#projlist").innerHTML = `<div class="adderr">${esc(e.message)}</div>`; }
        };
        await refresh();
        $("#newrepo").onclick = () => openNewRepo(refresh);

        // Browse the host filesystem and add the chosen git repo — no typing.
        $("#browseadd").onclick = () => openBrowser({
          title: "Browse for a git repo", gitOnly: true,
          onChoose: async (path) => {
            try { await App.call("project.add", { path }); $("#scrim").classList.remove("show"); await refresh(); }
            catch (e) { const el = $("#berr"); if (el) el.textContent = e.message; }
          },
        });
        // Clone a remote into the projects folder.
        $("#cloneadd").onclick = () => openClone(refresh);
        // Pick a different projects folder (any directory).
        $("#changedir").onclick = () => openBrowser({
          title: "Choose a projects folder", gitOnly: false,
          onChoose: async (path) => {
            try { await App.call("settings.set", { projects_dir: path }); $("#scrim").classList.remove("show"); await refresh(); }
            catch (e) { const el = $("#berr"); if (el) el.textContent = e.message; }
          },
        });
        $("#addproj").onclick = async () => {
          const path = $("#projpath").value.trim(); if (!path) return;
          const base_branch = $("#projbranch").value.trim() || undefined;
          $("#addproj").disabled = true; $("#adderr").textContent = "";
          try { await App.call("project.add", { path, base_branch }); $("#projpath").value = ""; $("#projbranch").value = ""; await refresh(); }
          catch (e) { $("#adderr").textContent = e.message; }
          $("#addproj").disabled = false;
        };

        // Devices: list the user's paired devices (over plain HTTP, not the bridge),
        // each with its fingerprint, online/offline, and a revoke action.
        const refreshDevices = async () => {
          try {
            const { devices } = await fetch("/api/devices").then((r) => r.json());
            $("#devlist").innerHTML = devices.length ? devices.map((d) => `
              <div class="projrow"><span class="pname">${esc(d.name)}</span>
                <span class="ppath mono" style="font-size:11px" title="${esc(d.fingerprint)}">${esc(d.fingerprint.slice(0, 16))}…</span>
                <span class="dim" style="font-size:11.5px"><span class="dot" style="background:${d.status === "online" ? "#3fb950" : "#6e7681"}"></span> ${esc(d.status)}</span>
                <button class="btn mini revoke" data-id="${esc(d.id)}">Revoke</button></div>`).join("")
              : '<div class="dim" style="font-size:13px">No devices yet. Start a bridge, then add it with its pairing code.</div>';
            $("#devlist").querySelectorAll(".revoke").forEach((btn) => (btn.onclick = async () => {
              btn.disabled = true; $("#deverr").textContent = "";
              try { const r = await fetch(`/api/devices/${btn.dataset.id}/revoke`, { method: "POST" }); if (!r.ok) throw new Error("revoke failed"); await refreshDevices(); }
              catch (e) { $("#deverr").textContent = e.message; btn.disabled = false; }
            }));
          } catch (e) { $("#devlist").innerHTML = `<div class="adderr">${esc(e.message)}</div>`; }
        };
        await refreshDevices();
        $("#adddev").onclick = () => openAddDevice(refreshDevices);
      }

      // Add a device: enter the pairing code the bridge printed, verify the fingerprint
      // out-of-band, then approve — binding the device to your account.
      function openAddDevice(onDone) {
        $("#sheet").innerHTML = `
          <h3>Add a device</h3><div class="sub">Enter the pairing code your bridge printed on startup.</div>
          <input id="paircode" placeholder="e.g. WXYZ-4F2K" style="text-transform:uppercase" />
          <div class="row"><button class="btn" id="pcancel" style="margin-left:auto">Cancel</button>
            <button class="btn primary" id="plookup">Look up</button></div>
          <div id="pairbox"></div>
          <div class="adderr" id="perr"></div>`;
        $("#scrim").classList.add("show");
        $("#paircode").focus();
        $("#pcancel").onclick = () => $("#scrim").classList.remove("show");
        $("#plookup").onclick = async () => {
          const code = $("#paircode").value.trim().toUpperCase(); if (!code) return;
          $("#perr").textContent = "";
          let dev;
          try {
            const r = await fetch("/api/devices/lookup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
            if (!r.ok) throw new Error("no pending device for that code");
            dev = await r.json();
          } catch (e) { $("#perr").textContent = e.message; return; }
          $("#pairbox").innerHTML = `
            <div class="panel" style="margin-top:12px">
              <div class="row"><span class="k">Device</span><span class="v">${esc(dev.name)}</span></div>
              <div class="row"><span class="k">Fingerprint</span><span class="v mono" style="font-size:11px;word-break:break-all">${esc(dev.fingerprint)}</span></div>
              <div class="dim" style="font-size:12px;margin:8px 0">Confirm this matches the fingerprint the bridge printed, then approve.</div>
              <button class="btn primary" id="papprove">Approve &amp; pair</button></div>`;
          $("#papprove").onclick = async () => {
            $("#papprove").disabled = true; $("#perr").textContent = "";
            try {
              const r = await fetch("/api/devices/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
              if (!r.ok) throw new Error("approve failed");
              $("#scrim").classList.remove("show"); await onDone();
            } catch (e) { $("#perr").textContent = e.message; $("#papprove").disabled = false; }
          };
        };
      }

      // A host directory browser in the sheet. opts: { title, gitOnly, onChoose }.
      // gitOnly → only git repos are "Choose"-able and the footer adds the current
      // repo; otherwise every folder is selectable (used to pick the projects dir).
      async function openBrowser(opts) {
        let data = null, showHidden = false;
        // Re-render the current folder applying the hidden filter — no re-fetch on toggle.
        const paint = () => {
          const visible = data.entries.filter((e) => showHidden || !e.is_hidden);
          const hiddenCount = data.entries.length - visible.length;
          // Every folder row opens on click; a "Use" button selects it (git repos in
          // repo mode, any folder in folder mode).
          const rows = visible.map((e) => `
            <div class="browse-row nav" data-path="${esc(e.path)}">
              <span class="bname">${e.is_git ? "📦" : "📁"} ${esc(e.name)}</span>
              ${e.is_git ? '<span class="bgit">git</span>' : ""}
              ${!opts.gitOnly || e.is_git
                ? `<button class="btn primary mini use" data-path="${esc(e.path)}">Use</button>` : ""}
            </div>`).join("");
          const footer = (!opts.gitOnly || data.is_git)
            ? `<button class="btn primary" id="choosecur" data-path="${esc(data.path)}">${opts.gitOnly ? "Use this repo" : "Use this folder"}</button>` : "";
          $("#sheet").innerHTML = `
            <h3>${esc(opts.title)}</h3>
            <div class="browse-path">${esc(data.path)}</div>
            <label class="toggle browse-toggle"><input type="checkbox" id="showhidden" ${showHidden ? "checked" : ""}> Show hidden${hiddenCount && !showHidden ? ` (${hiddenCount})` : ""}</label>
            <div class="browse-list">
              ${data.parent ? `<div class="browse-row nav" data-path="${esc(data.parent)}"><span class="bname dim">⬆ up — parent folder</span></div>` : ""}
              ${rows || '<div class="dim" style="font-size:13px;padding:10px">No subfolders here.</div>'}
            </div>
            <div class="row">${footer}<button class="btn" id="bcancel" style="margin-left:auto">Cancel</button></div>
            <div class="adderr" id="berr"></div>`;
          $("#showhidden").onchange = (e) => { showHidden = e.target.checked; paint(); };
          $("#bcancel").onclick = () => (opts.onCancel ? opts.onCancel() : $("#scrim").classList.remove("show"));
          const cc = $("#choosecur"); if (cc) cc.onclick = () => opts.onChoose(cc.dataset.path);
          $("#sheet").querySelectorAll(".browse-row.nav").forEach((row) => (row.onclick = () => nav(row.dataset.path)));
          $("#sheet").querySelectorAll(".use").forEach((btn) => (btn.onclick = (ev) => { ev.stopPropagation(); opts.onChoose(btn.dataset.path); }));
        };
        const nav = async (path) => {
          try { data = await App.call("fs.list", path ? { path } : {}); }
          catch (e) { const el = $("#berr"); if (el) el.textContent = e.message; return; }
          paint();
        };
        $("#scrim").classList.add("show");
        $("#sheet").innerHTML = `<h3>${esc(opts.title)}</h3><div class="dim" style="padding:14px">loading…</div>`;
        await nav(null);
      }

      // Create a brand-new git repo: browse to a location, name it, optionally set a
      // remote. `pre` carries field values across the Browse round-trip.
      function openNewRepo(onDone, pre = {}) {
        $("#sheet").innerHTML = `
          <h3>New repository</h3>
          <div class="sub">Build creates a git repo at the chosen location and registers it.</div>
          <div class="field"><label>Location</label>
            <div class="locrow"><input id="nrloc" style="flex:1" placeholder="(projects folder)" value="${esc(pre.location || "")}" readonly />
              <button class="btn" id="nrbrowse" type="button">Browse…</button></div></div>
          <div class="field"><label>Name</label><input id="nrname" placeholder="my-new-project" style="width:100%" value="${esc(pre.name || "")}" /></div>
          <div class="field"><label>Base branch</label><input id="nrbranch" placeholder="main" style="width:100%" value="${esc(pre.base_branch || "")}" /></div>
          <div class="field"><label>Remote URL (optional)</label><input id="nrremote" placeholder="git@github.com:org/repo.git" style="width:100%" value="${esc(pre.remote || "")}" /></div>
          <div class="row"><button class="btn" id="nrcancel" style="margin-left:auto">Cancel</button><button class="btn primary" id="nrdo">Create</button></div>
          <div class="adderr" id="nrerr"></div>`;
        $("#scrim").classList.add("show");
        $("#nrname").focus();
        const fields = () => ({ location: $("#nrloc").value, name: $("#nrname").value, base_branch: $("#nrbranch").value, remote: $("#nrremote").value });
        $("#nrcancel").onclick = () => $("#scrim").classList.remove("show");
        $("#nrbrowse").onclick = () => {
          const cur = fields();
          openBrowser({
            title: "Choose where to create the repo", gitOnly: false,
            onChoose: (path) => openNewRepo(onDone, { ...cur, location: path }),
            onCancel: () => openNewRepo(onDone, cur),
          });

        $("#nrdo").onclick = async () => {
          const name = $("#nrname").value.trim(); if (!name) return;
          const parent = $("#nrloc").value.trim() || undefined;
          const base_branch = $("#nrbranch").value.trim() || undefined;
          const remote = $("#nrremote").value.trim() || undefined;
          $("#nrdo").disabled = true; $("#nrdo").textContent = "creating…"; $("#nrerr").textContent = "";
          try { await App.call("project.create", { name, parent, base_branch, remote }); $("#scrim").classList.remove("show"); onDone && onDone(); }
          catch (e) { $("#nrerr").textContent = e.message; $("#nrdo").disabled = false; $("#nrdo").textContent = "Create"; }
        };
      }

      // Set (or clear) a project's origin remote, then refresh.
      function openSetRemote(project, onDone) {
        $("#sheet").innerHTML = `
          <h3>Set remote</h3>
          <div class="sub">Origin remote for <strong>${esc(project.name)}</strong>. Leave empty to clear.</div>

          <div class="row"><button class="btn" id="srcancel" style="margin-left:auto">Cancel</button><button class="btn primary" id="srdo">Save</button></div>
          <div class="adderr" id="srerr"></div>`;
        $("#scrim").classList.add("show");
        $("#srurl").focus();
        $("#srcancel").onclick = () => $("#scrim").classList.remove("show");
        $("#srdo").onclick = async () => {
          const url = $("#srurl").value.trim();
          $("#srdo").disabled = true; $("#srdo").textContent = "saving…"; $("#srerr").textContent = "";

          catch (e) { $("#srerr").textContent = e.message; $("#srdo").disabled = false; $("#srdo").textContent = "Save"; }

      // Clone a remote into the projects folder, then refresh.
      function openClone(onDone) {
        $("#sheet").innerHTML = `
          <h3>Clone a repository</h3>
          <div class="sub">Build clones it into your projects folder and registers it.</div>
          <div class="field"><label>Remote URL</label><input id="clurl" class="path" placeholder="https://github.com/org/repo.git or git@github.com:org/repo.git" style="width:100%" /></div>

          <div class="row"><button class="btn" id="clcancel" style="margin-left:auto">Cancel</button><button class="btn primary" id="cldo">Clone</button></div>
