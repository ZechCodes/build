      // A floating "Comment" popover anchored to a text selection in the plan.
      let _pop = null;
      function hideCommentPop() {
        if (_pop) { if (_pop._onDown) document.removeEventListener("mousedown", _pop._onDown); _pop.remove(); _pop = null; }
      }
      function showCommentPop(rect, onAdd) {
        hideCommentPop();
        const pop = document.createElement("div");
        pop.className = "comment-pop";
        pop.style.top = rect.bottom + 6 + "px";
        pop.style.left = Math.max(8, rect.left) + "px";
        pop.innerHTML = `<button class="cp-add">💬 Comment</button>`;
        document.body.appendChild(pop);
        pop.querySelector(".cp-add").onclick = () => {
          pop.innerHTML = `<input class="cp-input" placeholder="Comment on this passage…" /><button class="cp-save">Add</button>`;
          const input = pop.querySelector(".cp-input"); input.focus();
          const save = () => { const v = input.value.trim(); if (v) onAdd(v); hideCommentPop(); };
          pop.querySelector(".cp-save").onclick = save;
          input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } else if (e.key === "Escape") hideCommentPop(); };
        };
        const onDown = (e) => { if (_pop && !_pop.contains(e.target)) hideCommentPop(); };
        setTimeout(() => document.addEventListener("mousedown", onDown), 0);
        pop._onDown = onDown;
        _pop = pop;
      }

      async function renderTask() {
        const root = $("#root");
        const id = App.route.id; let tab = App.route.tab || "plan";
        const shell = (t) => {
          const m = t || {};
          root.innerHTML = `
            <div class="back" id="back">← Board</div>
            <div class="thead"><h1>${esc(m.goal || "")}</h1>
              <div class="right"><span class="chip ${chipClass(m.state)}">${STATE_LABEL[m.state] || m.state || ""}</span>
                <span>terminal <span class="kbd">\`</span></span></div></div>
            <div class="tmeta"><span>${esc(m.project || "")}</span><span>·</span><span>${esc(m.branch || "")}</span><span>·</span><span>${esc(m.harness || "")}</span></div>
            <div class="tabs"><div class="t ${tab === "plan" ? "active" : ""}" data-tab="plan">Plan</div>
              <div class="t ${tab === "diff" ? "active" : ""}" data-tab="diff">Diff</div></div>
            <div id="tabbody"></div>`;
          $("#back").onclick = () => go({ name: "board" });
          root.querySelectorAll(".tabs .t").forEach((e) => (e.onclick = () => { tab = e.dataset.tab; App.route.tab = tab; root.querySelectorAll(".tabs .t").forEach((x) => x.classList.toggle("active", x.dataset.tab === tab)); paint(); }));
        };
        let last = null;
        // Plan-review feedback state, preserved across the 1.6s poll.
        const planComments = []; // { id, snippet, comment }
        let cid = 0, planKey = null;
        const assembleNotes = (general) => {
          let out = "Please revise the plan to address this review feedback.\n\n";
          planComments.forEach((c, i) => {
            const snip = c.snippet.replace(/\s+/g, " ").trim();
            out += `${i + 1}. On the passage: "${snip}"\n   Comment: ${c.comment}\n\n`;
          });
          if (general.trim()) out += `General feedback: ${general.trim()}\n`;
          return out;
        };

        // Build the plan tab: rendered markdown + select-to-comment + a general
        // comment box + an action button that morphs to "Request Updates".
        function renderPlanTab(t, plan) {
          planComments.length = 0; // a freshly (re)rendered plan starts with no comments
          const editable = t.state === "plan_review";
          const body = $("#tabbody");
          body.innerHTML = `
            <div class="plan" id="planbody">${renderMarkdown(plan)}</div>
            ${editable ? `<div class="plan-feedback"><div id="pclist"></div>
              <textarea id="pgeneral" class="plan-general" placeholder="Add a general comment about the plan and request updates…"></textarea></div>` : ""}
            <div class="actionbar"><span class="hint" id="phint"></span><div class="right" id="pactions"></div></div>`;
          const pclist = $("#pclist"), pactions = $("#pactions"), phint = $("#phint");

          const removeComment = (idc) => {
            const i = planComments.findIndex((c) => c.id === idc); if (i >= 0) planComments.splice(i, 1);
            const mark = document.querySelector(`mark.phl[data-cid="${idc}"]`);
            if (mark) { const par = mark.parentNode; while (mark.firstChild) par.insertBefore(mark.firstChild, mark); par.removeChild(mark); par.normalize(); }
            refreshFeedback();
          };
          const updateActions = () => {
            const general = editable && $("#pgeneral") ? $("#pgeneral").value.trim() : "";
            if (!editable) { pactions.innerHTML = ""; phint.textContent = ""; return; }
            if (planComments.length || general) {
              phint.textContent = "Your comments will be sent to the planning agent to revise the plan.";
              pactions.innerHTML = `<button class="btn" id="clearfb">Clear</button><button class="btn primary" id="requestUpdates">Request Updates</button>`;
              $("#clearfb").onclick = () => { planComments.slice().forEach((c) => removeComment(c.id)); if ($("#pgeneral")) $("#pgeneral").value = ""; refreshFeedback(); };
              $("#requestUpdates").onclick = async () => {
                const btn = $("#requestUpdates"); btn.disabled = true; btn.textContent = "requesting updates…";
                const notes = assembleNotes($("#pgeneral") ? $("#pgeneral").value : "");
                try { await App.call("task.send_notes", { task_id: id, comments: notes }); planComments.length = 0; planKey = null; hideCommentPop(); paint(); }
                catch (e) { btn.disabled = false; btn.textContent = "Request Updates"; phint.textContent = "error: " + e.message.slice(0, 50); }
              };
            } else {
              phint.textContent = "Select text in the plan to comment, or approve to start the build.";
              pactions.innerHTML = `<button class="btn primary" id="approvePlan">Approve plan &amp; start build</button>`;
              $("#approvePlan").onclick = async () => { const ap = $("#approvePlan"); ap.disabled = true; ap.textContent = "starting build…"; await App.call("task.approve_plan", { task_id: id }); App.route.tab = "diff"; tab = "diff"; planKey = null; paint(); };
            }
          };
          function refreshFeedback() {
            if (pclist) {
              pclist.innerHTML = planComments.map((c) => `
                <div class="pcomment"><span class="pcx" data-id="${c.id}">×</span>
                  <span class="psnip">${esc(c.snippet.replace(/\s+/g, " ").trim().slice(0, 160))}</span>
                  <span class="pctext">${esc(c.comment)}</span></div>`).join("");
              pclist.querySelectorAll(".pcx").forEach((x) => (x.onclick = () => removeComment(+x.dataset.id)));
            }
            updateActions();
          }
          const addComment = (snippet, comment, range) => {
            const idc = ++cid;
            planComments.push({ id: idc, snippet, comment });
            try { const mark = document.createElement("mark"); mark.className = "phl"; mark.dataset.cid = idc; range.surroundContents(mark); } catch (e) {}
            window.getSelection().removeAllRanges();
            refreshFeedback();
          };
          if (editable) {
            const planEl = $("#planbody");
            planEl.addEventListener("mouseup", () => setTimeout(() => {
              const sel = window.getSelection(); const text = sel.toString().trim();
              if (!text || sel.rangeCount === 0 || !planEl.contains(sel.anchorNode) || !planEl.contains(sel.focusNode)) return;
              const range = sel.getRangeAt(0).cloneRange();
              showCommentPop(range.getBoundingClientRect(), (comment) => addComment(text, comment, range));
            }, 0));
            $("#pgeneral").oninput = updateActions;
          }
          refreshFeedback();
        }

        // Diff-review feedback state, preserved across the live-updating diff poll.
        const diffComments = []; // { id, file, lnA, lnB, snippet, comment }
        let dcid = 0, diffKey = null, lastDiffState = null, diffMsg = "";
        const assembleDiffNotes = (general) => {
          let out = "Please make these changes to the code:\n\n";
          diffComments.forEach((c, i) => {
            const loc = c.lnA === c.lnB ? `line ${c.lnA}` : `lines ${c.lnA}-${c.lnB}`;
            out += `${i + 1}. ${c.file} (${loc}):\n> ${c.snippet.replace(/\n/g, "\n> ")}\n   Comment: ${c.comment}\n\n`;
          });
          if (general.trim()) out += `General feedback: ${general.trim()}\n`;
          return out;
        };

        // The <tr> (with a line number) containing a selection/click node.
        const rowOf = (node, table) => {
          let el = node && node.nodeType === 3 ? node.parentElement : node;
          while (el && el !== table && el.tagName !== "TR") el = el.parentElement;
          return el && el.tagName === "TR" && el.dataset.ln ? el : null;
        };

        function renderDiffTab(t, files) {
          const editable = t.state === "review" || t.state === "building";
          const working = t.state === "building";
          const fIns = files.reduce((a, f) => a + f.add, 0), fDel = files.reduce((a, f) => a + f.del, 0);
          const body = $("#tabbody");
          const fileHtml = files.map((f) => `
            <div class="file" data-file="${esc(f.path)}"><div class="fhead"><span>${esc(f.path)}</span><span class="fb ${f.status}">${f.status}</span>
              <span class="pm"><span class="a">+${f.add}</span> <span class="d">−${f.del}</span></span></div>
              <table>${f.rows.map((r) => r.t === "hunk"
                ? `<tr class="hunk"><td class="ln"></td><td class="ln"></td><td class="code">${esc(r.text)}</td></tr>`
                : `<tr class="${r.t}" data-ln="${r.n ?? r.o ?? ""}"><td class="ln">${r.o ?? ""}</td><td class="ln">${r.n ?? ""}</td><td class="code">${esc(r.text)}</td></tr>`).join("")}</table></div>`).join("");
          body.innerHTML = `
            <div class="diffbar"><span>${files.length} files <span style="color:var(--green)">+${fIns}</span> <span style="color:var(--red)">−${fDel}</span></span>
              ${working ? '<span class="dim">● coding agent working — diff updating live…</span>' : ""}</div>
            ${files.length ? fileHtml : '<div class="empty">No file changes yet.</div>'}
            ${editable ? `<div class="plan-feedback" id="diff-feedback"><div id="difflist"></div>
              <textarea id="dgeneral" class="plan-general" placeholder="Add a general comment about the changes and request updates…"></textarea></div>` : ""}
            <div class="actionbar"><span class="hint" id="diffhint"></span><div class="right" id="diffactions"></div></div>`;

          if (editable) {
            body.querySelectorAll(".file").forEach((fileEl) => {
              const file = fileEl.dataset.file, table = fileEl.querySelector("table");
              if (!table) return;
              table.addEventListener("mouseup", () => setTimeout(() => {
                const sel = window.getSelection(); if (sel.rangeCount === 0) return;
                const text = sel.toString();
                if (text.trim()) {
                  const sa = rowOf(sel.anchorNode, table), sb = rowOf(sel.focusNode, table);
                  if (!sa && !sb) return;
                  let a = +((sa || sb).dataset.ln), b = +((sb || sa).dataset.ln); if (a > b) [a, b] = [b, a];
                  showCommentPop(sel.getRangeAt(0).getBoundingClientRect(), (comment) => addDiffComment(file, a, b, text, comment));
                } else {
                  const tr = rowOf(sel.anchorNode, table); if (!tr || tr.classList.contains("hunk")) return;
                  const ln = +tr.dataset.ln, snippet = tr.querySelector(".code").textContent;
                  showCommentPop(tr.getBoundingClientRect(), (comment) => addDiffComment(file, ln, ln, snippet, comment));
                }
              }, 0));
            });
            $("#dgeneral").oninput = updateDiffActions;
          }
          applyDiffHighlights();
          refreshDiffFeedback();
        }

        function applyDiffHighlights() {
          const body = $("#tabbody"); if (!body) return;
          body.querySelectorAll("tr.dhl").forEach((r) => r.classList.remove("dhl"));
          diffComments.forEach((c) => {
            const fileEl = Array.from(body.querySelectorAll(".file")).find((el) => el.dataset.file === c.file);
            if (!fileEl) return;
            fileEl.querySelectorAll("tr[data-ln]").forEach((tr) => { const ln = +tr.dataset.ln; if (ln >= c.lnA && ln <= c.lnB) tr.classList.add("dhl"); });
          });
        }
        const addDiffComment = (file, lnA, lnB, snippet, comment) => {
          const idc = ++dcid;
          diffComments.push({ id: idc, file, lnA: lnA || lnB, lnB: lnB || lnA, snippet: snippet.trim().slice(0, 400), comment });
          window.getSelection().removeAllRanges();
          applyDiffHighlights(); refreshDiffFeedback();
        };
        const removeDiffComment = (idc) => {
          const i = diffComments.findIndex((c) => c.id === idc); if (i >= 0) diffComments.splice(i, 1);
          applyDiffHighlights(); refreshDiffFeedback();
        };
        function refreshDiffFeedback() {
          const list = $("#difflist");
          if (list) {
            list.innerHTML = diffComments.map((c) => {
              const loc = c.lnA === c.lnB ? `:${c.lnA}` : `:${c.lnA}-${c.lnB}`;
              return `<div class="pcomment"><span class="pcx" data-id="${c.id}">×</span>
                <span class="psnip">${esc(c.file)}${esc(loc)} · ${esc(c.snippet.replace(/\s+/g, " ").trim().slice(0, 90))}</span>
                <span class="pctext">${esc(c.comment)}</span></div>`;
            }).join("");
            list.querySelectorAll(".pcx").forEach((x) => (x.onclick = () => removeDiffComment(+x.dataset.id)));
          }
          updateDiffActions();
        }
        function updateDiffActions() {
          const actions = $("#diffactions"), hint = $("#diffhint"); if (!actions) return;
          const general = $("#dgeneral") ? $("#dgeneral").value.trim() : "";
          if (diffComments.length || general) {
            hint.textContent = "Your comments will be sent to the coding agent to make changes.";
            actions.innerHTML = `<button class="btn" id="clearrc">Clear</button><button class="btn primary" id="requestChanges">Request Changes</button>`;
            $("#clearrc").onclick = () => { diffComments.length = 0; if ($("#dgeneral")) $("#dgeneral").value = ""; applyDiffHighlights(); refreshDiffFeedback(); };
            $("#requestChanges").onclick = async () => {
              const btn = $("#requestChanges"); btn.disabled = true; btn.textContent = "requesting…";
              const notes = assembleDiffNotes($("#dgeneral") ? $("#dgeneral").value : "");
              try { await App.call("task.request_changes", { task_id: id, comments: notes }); diffComments.length = 0; if ($("#dgeneral")) $("#dgeneral").value = ""; diffKey = null; hideCommentPop(); paint(); }
              catch (e) { btn.disabled = false; btn.textContent = "Request Changes"; hint.textContent = "error: " + e.message.slice(0, 50); }
            };
          } else if (lastDiffState === "review") {
            // A recent git-action result (Committed./Pushed./error) outlives the poll.
            hint.textContent = diffMsg || "Select code or click a line number to comment, or finish the worktree.";
            // GitHub-style split button: primary runs the default (merge), the caret
            // opens the full menu. Every action commits first; push is explicit.
            actions.innerHTML = `
              <div class="splitbtn">
                <button class="btn primary" id="gitprimary" data-action="merge">Merge</button>
                <button class="btn primary caret" id="gitcaret" title="More actions">▾</button>
                <div class="splitmenu" id="gitmenu" hidden>
                  <div class="mi" data-action="commit"><span class="mt">Commit</span><span class="md">commit the work, stay on the branch</span></div>
                  <div class="mi" data-action="merge"><span class="mt">Merge</span><span class="md">commit, then merge into ${esc(last && last.base_branch || "main")}</span></div>
                  <div class="mi" data-action="merge_push"><span class="mt">Merge &amp; push</span><span class="md">merge, then push ${esc(last && last.base_branch || "main")} to origin</span></div>
                  <div class="mi" data-action="push"><span class="mt">Push</span><span class="md">commit, then push this branch to origin</span></div>
                </div>
              </div>`;
            const labels = { commit: "committing…", merge: "merging…", merge_push: "merging & pushing…", push: "pushing…" };
            const flash = (msg) => { diffMsg = msg; setTimeout(() => { diffMsg = ""; updateDiffActions(); }, 6000); };
            const run = async (action, btn) => {
              btn.disabled = true; diffMsg = ""; const orig = btn.textContent; btn.textContent = labels[action] || "working…";
              try {
                await App.call("task.git_action", { task_id: id, action });
                if (action === "merge" || action === "merge_push") { go({ name: "board" }); }
                else { flash(action === "commit" ? "Committed." : "Pushed " + (last && last.branch || "branch") + "."); diffKey = null; paint(); }
              } catch (e) { btn.disabled = false; btn.textContent = orig; flash("error: " + e.message.slice(0, 70)); updateDiffActions(); }
            };
            $("#gitprimary").onclick = (e) => run(e.currentTarget.dataset.action, e.currentTarget);
            const menu = $("#gitmenu");
            $("#gitcaret").onclick = (e) => {
              e.stopPropagation();
              menu.hidden = !menu.hidden;
              if (!menu.hidden) {
                const close = (ev) => { if (!$(".splitbtn")?.contains(ev.target)) { menu.hidden = true; document.removeEventListener("mousedown", close); } };
                setTimeout(() => document.addEventListener("mousedown", close), 0);
              }
            };
            menu.querySelectorAll(".mi").forEach((mi) => (mi.onclick = () => { menu.hidden = true; run(mi.dataset.action, $("#gitprimary")); }));
          } else if (lastDiffState === "building") {
            hint.textContent = "Comment on the diff to request changes — even while the agent is working.";
            actions.innerHTML = "";
          } else { hint.textContent = ""; actions.innerHTML = ""; }
        }

        const paint = async () => {
          if (App.offline) return;   // freeze the view; resume() restarts the flow
          let t; try { t = await App.call("task.get", { task_id: id }); } catch (e) { return; }
          if (!last || last.state !== t.state || last.goal !== t.goal) shell(t);
          last = t;
          const body = $("#tabbody");
          if (tab === "plan") {
            if (t.state === "planning" || t.state === "created") { body.innerHTML = '<div class="plan plan-loading">✦ planning agent is drafting the plan…</div>'; planKey = "drafting"; planComments.length = 0; return; }
            let plan = ""; try { plan = (await App.call("task.plan", { task_id: id })).contents; } catch (e) {}
            const key = t.state + "␀" + plan;
            // Skip rebuild when nothing changed, so comments / typed text / selection survive the poll.
            if (planKey === key && $("#planbody")) return;
            planKey = key;
            renderPlanTab(t, plan);
          } else {
            let diff = { stat: { files_changed: 0, insertions: 0, deletions: 0 }, files: [], patch: "" };
            try { diff = await App.call("task.diff", { task_id: id }); } catch (e) {}
            const files = parseDiff(diff.patch).filter((f) => !f.path.startsWith(".build/") && !f.path.includes("__pycache__") && f.path !== "uv.lock");
            lastDiffState = t.state;
            const key = t.state + " " + diff.patch;
            const gen = $("#dgeneral");
            // Freeze the diff while the user is actively commenting (pending comments,
            // open popover, or text in the general box) so anchors/selection survive.
            const busy = diffComments.length > 0 || _pop || (gen && (gen.value.trim() || document.activeElement === gen));
            if ($("#diff-feedback") && (key === diffKey || busy)) { updateDiffActions(); return; }
            diffKey = key;
            renderDiffTab(t, files);
          }
        };
        shell(null); await paint();
        App.poll = setInterval(paint, 1600);
      }

      // ---------- new task sheet ----------
      async function openNewTask() {
        $("#sheet").innerHTML = `
          <h3>New task</h3><div class="sub">Describe a goal. Build plans it, you review, an agent ships it.</div>
          <textarea id="goal" placeholder="e.g. Add a /health endpoint that returns build SHA and uptime…"></textarea>
          <div class="field"><label>Project</label><select id="project"><option>loading…</option></select></div>
          <label class="toggle" style="margin-top:12px"><input type="checkbox" id="quick"> Quick task — skip planning (small, unambiguous changes)</label>
          <div class="yolo">Agents run on your machine in YOLO mode (no sandbox). A worktree isolates the branch, not the machine.</div>
          <div class="row"><span class="dim mono" style="font-size:11px">${esc("Claude Code")}</span>
            <button class="btn" id="cancel" style="margin-left:auto">Cancel</button>
            <button class="btn primary" id="dispatch">Create</button></div>`;
        $("#scrim").classList.add("show");
        $("#goal").focus();
        $("#cancel").onclick = () => $("#scrim").classList.remove("show");

        // Populate the project picker; the bridge picks the first if none chosen.
        const sel = $("#project");
        try {
          const { projects } = await App.call("project.list");
          sel.innerHTML = projects.length
            ? projects.map((p) => `<option value="${esc(p.project_id)}">${esc(p.name)} · ${esc(p.base_branch)}</option>`).join("")
            : '<option value="">(no projects — add one in Settings)</option>';
        } catch (e) { sel.innerHTML = '<option value="">(could not load projects)</option>'; }

        $("#dispatch").onclick = async () => {
          const goal = $("#goal").value.trim(); if (!goal) return;
          const kind = $("#quick").checked ? "quick" : "standard";
          const project_id = sel.value || undefined;
          $("#dispatch").disabled = true; $("#dispatch").textContent = "dispatching…";
          try { const t = await App.call("task.dispatch", { goal, kind, project_id }); $("#scrim").classList.remove("show"); go({ name: "task", id: t.task_id, tab: kind === "quick" ? "diff" : "plan" }); }
          catch (e) { $("#dispatch").textContent = "error: " + e.message.slice(0, 40); $("#dispatch").disabled = false; }
        };
      }
      $("#scrim").onclick = (e) => { if (e.target === $("#scrim")) $("#scrim").classList.remove("show"); };

      // ---------- terminal drawer (lazy) ----------
      let termMod = null, termSession = null;
      async function toggleTerminal() {
        const d = $("#drawer");
        if (d.classList.contains("show")) { d.classList.remove("show"); return; }
        d.classList.add("show");
        if (!termSession) {
          termMod = termMod || await import("./terminal.js");
          const { init, Terminal } = await import("ghostty-web"); await init();
          $("#term").innerHTML = "";
          const term = new Terminal({ cols: 140, rows: 16, fontSize: 13, theme: { background: "#15161e", foreground: "#a9b1d6" } });
          term.open($("#term"));
          termSession = new termMod.TerminalSession({ url: GATEWAY, transport, WebSocketImpl: WebSocket,
            getToken: () => fetch("/api/gateway-token", { method: "POST" }).then((r) => r.json()).then((d) => d.token) });
          termSession.onSnapshot((b) => { term.reset(); term.write(b); });
          termSession.onOutput((b) => term.write(b));
          term.onData((data) => termSession.input(data).catch(() => {}));
          await termSession.start(140, 16);
        }
      }
      $("#dx").onclick = () => $("#drawer").classList.remove("show");
      window.addEventListener("keydown", (e) => { if (e.key === "`" && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { e.preventDefault(); toggleTerminal(); } });

      // ---------- nav ----------
      $("#nav-board").onclick = () => go({ name: "board" });
      $("#nav-notif").onclick = () => go({ name: "notifications" });
      $("#nav-settings").onclick = () => go({ name: "settings" });

      // ---------- connection gate ----------
      // Before the board can load we need a live, owned device. Three entry states:
      // onboarding (no devices yet), waiting (devices exist but none online — auto-
      // reconnect), connected (open the E2EE session and show the board).
      async function fetchDevices() {
        try { return (await fetch("/api/devices").then((r) => r.json())).devices || []; }
        catch { return []; }
      }
      async function lookupDevice(code) {
        const r = await fetch("/api/devices/lookup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
        if (!r.ok) throw new Error("no pending device for that code");
        return r.json();
      }
      async function approveDevice(code) {
        const r = await fetch("/api/devices/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
        if (!r.ok) throw new Error("approve failed");
      }
      // Hide the main nav tabs while gating — the gate screens are self-contained.
      function setGate(on) { document.querySelectorAll("nav .tab").forEach((t) => (t.style.display = on ? "none" : "")); }

      async function enterApp() {
        if (App._connecting) return;
        App._connecting = true;
        try {
          App.call = (await openSession()).call;
        } finally { App._connecting = false; }
        if (App._watch) { clearInterval(App._watch); App._watch = null; }
        setGate(false);
        $("#conn").innerHTML = '<span class="dot"></span>connected';
        App.route = { name: "board" };
        render();
      }

      // Poll for a device to come online, then connect automatically.
      function watchForOnline() {
        if (App._watch) clearInterval(App._watch);
        App._watch = setInterval(async () => {
          const devices = await fetchDevices();
          if (!devices.length) { clearInterval(App._watch); App._watch = null; renderOnboarding(); return; }
          paintWaiting(devices);
          if (devices.some((d) => d.status === "online")) { try { await enterApp(); } catch { /* warming up */ } }
        }, 3000);
      }

      function renderOnboarding() {
        setGate(true);
        $("#conn").innerHTML = '<span class="dot" style="background:#6e7681"></span>no devices';
        const api = location.origin;
        const cmd = `BRIDGE_API_URL=${api} BRIDGE_WEB_URL=${api} BRIDGE_RELAY_URL=${GATEWAY} BRIDGE_IDENTITY_FILE=/tmp/bld/my-device.json BRIDGE_REPO=/tmp/bld/repo BRIDGE_WORKTREES=/tmp/bld/wt build-bridge serve`;
        $("#root").innerHTML = `
          <div style="max-width:680px;margin:44px auto 0;padding:0 16px">
            <h1 style="margin:0 0 6px">Welcome to Build</h1>
            <p class="settings-intro" style="margin:0 0 22px">Your coding agents run on your own devices, end-to-end encrypted. Add a device to begin — only paired devices can read your tasks, plans, and diffs.</p>
            <div class="panel">
              <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0"><span style="flex:none;width:22px;height:22px;border-radius:50%;background:#2a2c39;color:#c7d0f0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">1</span><div><b>Start a bridge</b> on the machine where your code lives.
                <div style="display:flex;gap:8px;align-items:flex-start;margin-top:6px">
                  <code class="mono" style="flex:1;font-size:11px;line-height:1.5;padding:8px 10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all">${esc(cmd)}</code>
                  <button class="btn mini" id="copycmd">Copy</button></div></div></div>
              <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0"><span style="flex:none;width:22px;height:22px;border-radius:50%;background:#2a2c39;color:#c7d0f0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">2</span><div><b>Enter its pairing code</b> — the bridge prints it on startup.
                <div class="addproj" style="margin-top:6px"><input id="ocode" placeholder="e.g. G6ZP-KD2U" style="text-transform:uppercase" autofocus />
                  <button class="btn primary" id="olookup">Add device</button></div></div></div>
              <div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0"><span style="flex:none;width:22px;height:22px;border-radius:50%;background:#2a2c39;color:#c7d0f0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">3</span><div><b>Compare the fingerprint</b> with what the bridge printed, then approve.</div></div>
            </div>
            <div id="opairbox"></div>
            <div class="adderr" id="oerr"></div>
          </div>`;
        $("#copycmd").onclick = () => { navigator.clipboard?.writeText(cmd); $("#copycmd").textContent = "Copied"; setTimeout(() => ($("#copycmd").textContent = "Copy"), 1500); };
        const lookup = async () => {
          const code = $("#ocode").value.trim().toUpperCase(); if (!code) return;
          $("#oerr").textContent = "";
          let dev; try { dev = await lookupDevice(code); } catch (e) { $("#oerr").textContent = e.message; return; }
          $("#opairbox").innerHTML = `
            <div class="panel" style="margin-top:14px">
              <div class="row"><span class="k">Device</span><span class="v">${esc(dev.name)}</span></div>
              <div class="row"><span class="k">Fingerprint</span><span class="v mono" style="font-size:11px;word-break:break-all">${esc(dev.fingerprint)}</span></div>
              <div class="dim" style="font-size:12px;margin:8px 0">Confirm this matches what the bridge printed, then approve.</div>
              <button class="btn primary" id="oapprove">Approve &amp; pair</button></div>`;
          $("#oapprove").onclick = async () => {
            $("#oapprove").disabled = true; $("#oerr").textContent = "";
            try { await approveDevice(code); $("#opairbox").innerHTML = ""; await boot(); }
            catch (e) { $("#oerr").textContent = e.message; $("#oapprove").disabled = false; }
          };
        };
        $("#olookup").onclick = lookup;
        $("#ocode")?.addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(); });
      }

      function paintWaiting(devices) {
        const el = $("#waitlist"); if (!el) return;
        el.innerHTML = devices.map((d) => `
          <div class="projrow"><span class="pname">${esc(d.name)}</span>
            <span class="ppath mono" style="font-size:11px">${esc(d.fingerprint.slice(0, 16))}…</span>
            <span class="dim" style="font-size:11.5px"><span class="dot" style="background:${d.status === "online" ? "#3fb950" : "#6e7681"}"></span> ${esc(d.status)}</span></div>`).join("");
      }

      function renderWaiting(devices) {
        setGate(true);
        $("#conn").innerHTML = '<span class="dot" style="background:#d29922"></span>device offline';
        $("#root").innerHTML = `
          <div style="max-width:680px;margin:44px auto 0;padding:0 16px">
            <h1 style="margin:0 0 6px">Waiting for your device</h1>
            <p class="settings-intro" style="margin:0 0 18px">None of your devices are online right now. Start your bridge and Build will connect automatically — no need to refresh.</p>
            <div class="panel"><div id="waitlist"></div></div>
            <div class="row" style="margin-top:14px"><span class="dim" id="watchmsg">⟳ watching for a device to come online…</span>
              <button class="btn" id="retrybtn" style="margin-left:auto">Retry now</button>
              <button class="btn" id="addmore">Add another device…</button></div>
            <div class="adderr" id="oerr"></div>
          </div>`;
        paintWaiting(devices);
        $("#retrybtn").onclick = () => boot();
        $("#addmore").onclick = () => openAddDevice(boot);
      }

      async function boot() {
        setGate(true);
        $("#conn").innerHTML = '<span class="dot" style="background:#d29922"></span>connecting…';
        const devices = await fetchDevices();
        if (!devices.length) { renderOnboarding(); return; }
        if (devices.some((d) => d.status === "online")) {
          try { await enterApp(); return; } catch { /* status stale or warming up → waiting */ }
        }
        renderWaiting(devices);
        watchForOnline();
      }
      boot();
    </script>
  </body>
</html>
