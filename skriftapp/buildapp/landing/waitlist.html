    <div class="waitlist" data-waitlist>
      <form class="waitlist-form" novalidate>
        <input class="waitlist-input" type="email" name="email" placeholder="you@company.com" autocomplete="email" aria-label="Email address" required>
        <button class="button-primary button-primary--form" type="submit">REQUEST ACCESS</button>
      </form>
      <p class="note waitlist-error" role="alert" hidden>✗ COULDN’T ADD YOU — TRY AGAIN.</p>
      <p class="waitlist-success" role="status" hidden>✓ YOU’RE ON THE LIST — <span data-waitlist-email></span></p>
      <p class="note waitlist-confirmation" role="status" hidden>A confirmation is on its way. Every email has a one-click unsubscribe.</p>
    </div>
