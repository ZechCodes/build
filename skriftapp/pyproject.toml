# Packaging for the Build web app so images (and CI) are self-contained.
#
# Dependency choice (documented for deploy/): Skrift is pinned to the PyPI
# release that matches the local framework checkout (0.2.0a9 == GitHub HEAD at
# the time of pinning), so the container build needs no private checkout. For
# local framework development keep using the README flow
# (`uv run --project /path/to/Skrift skrift ...`), or add a temporary
# [tool.uv.sources] override pointing at your checkout.
[project]
name = "buildapp"
version = "2.0.0"
description = "Build web app on Skrift — auth, device registry, gateway tokens; serves the SPA"
requires-python = ">=3.13"
dependencies = [
    # passkeys extra pulls in webauthn for the production auth method.
    # Skrift core already ships asyncpg (Postgres) + aiosqlite (dev).
    "skrift[passkeys]==0.2.0a10",
    # Imported directly by buildapp.pairing_crypto (Ed25519 verification).
    "cryptography>=44",
    # Web push delivery (VAPID + payload encryption) for buildapp.web_push.
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
# Supply-chain cooldown: wait before resolving newly published packages. Keep
# the canonical relative form so automated policy checks can verify the guard.
exclude-newer = "7 days"
# Virtual project: buildapp/ is imported from the working directory by Skrift's
# controller loading, so there is nothing to build or install.
package = false

# INTERIM: skrift 0.2.0a10 is not on PyPI yet — it carries the setup-wizard
# template-globals fix (csrf_field/favicon_url/sized on the setup app engine).
# Drop this source and the vendor/ wheel once 0.2.0a10 is published.
[tool.uv.sources]
skrift = { path = "vendor/skrift-0.2.0a10-py3-none-any.whl" }
