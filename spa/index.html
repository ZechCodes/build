<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build — review is the product</title>
    <link rel="manifest" href="/app/static/manifest.webmanifest" />
    <meta name="theme-color" content="#5b62e8" />
    <link rel="icon" href="/app/static/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Build" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="offbar" hidden>
      ⚠ <span id="offbar-text">Your device went offline — reconnecting automatically.</span>
      You can keep reading; actions that need your device are paused.
    </div>
    <div id="shell">
      <aside id="sidebar">
        <div class="side-top">
          <span class="logo">build</span>
          <button class="iconbtn" id="side-collapse" title="Collapse sidebar">◫</button>
        </div>
        <div class="side-nav">
          <div class="srow snav" id="nav-notif"><span class="sicon">▤</span><span class="stitle">Notifications</span><span class="badge" id="notif" style="display:none">0</span></div>
          <div class="srow snav" id="nav-account"><span class="sicon">◉</span><span class="stitle">Account</span></div>
        </div>
        <div id="sidebar-rail"></div>
        <div class="side-status">
          <select id="devpick" title="Which device runs your tasks" hidden></select>
          <span id="conn"><span class="dot"></span>connecting…</span>
          <span class="e2ee">e2ee</span>
        </div>
      </aside>
      <div id="side-scrim"></div>
      <main id="root"></main>
    </div>
    <button class="iconbtn" id="side-open" title="Open sidebar">◫</button>

    <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
  </body>
</html>
