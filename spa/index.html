<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build — review is the product</title>
    <link rel="manifest" href="/app/static/manifest.webmanifest" />
    <meta name="theme-color" content="#5b62e8" />
    <link rel="icon" href="/app/static/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Build" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <nav>
      <span class="logo">build</span>
      <span class="tab" id="nav-side" title="Toggle sidebar">◫</span>
      <span class="tab active" id="nav-board">◧ Board</span>
      <span class="tab" id="nav-notif">Notifications <span class="badge" id="notif" style="display:none">0</span></span>
      <span class="tab" id="nav-settings">Settings</span>
      <span class="right">
        <select id="devpick" title="Which device runs your tasks" hidden></select>
        <span id="conn"><span class="dot"></span>connecting…</span>
        <span class="e2ee">e2ee</span>
        <span class="av">{{USER0}}</span>
      </span>
    </nav>
    <div id="offbar" hidden>
      ⚠ <span id="offbar-text">Your device went offline — reconnecting automatically.</span>
      You can keep reading; actions that need your device are paused.
    </div>
    <div id="shell">
      <aside id="sidebar"></aside>
      <main id="root"></main>
    </div>

    <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
  </body>
</html>
