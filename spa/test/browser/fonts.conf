<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts every layout check measures in (layoutHarness.mjs hands this to
  Chromium as FONTCONFIG_FILE).

  The SPA asks for "Inter", which it does not ship, so the text falls through to
  the machine's generic families: Liberation on an Arch desktop, DejaVu on an
  Ubuntu CI runner. DejaVu is wider, and a check sized on one machine read
  different pixels on the other. Both generics are pinned to Liberation 2.1.5,
  which both install (Arch ttf-liberation, Ubuntu fonts-liberation), so a
  measurement means the same thing wherever it runs.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Mono</string></edit>
  </match>
</fontconfig>
