<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize App — Build</title>
  <link rel="icon" type="image/svg+xml" href="/static/build/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style nonce="{{ csp_nonce() }}">
    :root {
      --bg: #f0f2f5;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.5);
      --text: #1e293b;
      --text-secondary: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg {
      width: 28px;
      height: 28px;
      stroke: white;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 10px;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .user-detail {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .user-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 400;
    }
    .btn {
      width: 100%;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--accent);
      color: white;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }
    .result.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }
    .result.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }
    .timer {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 1rem;
    }
    .close-hint {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 1rem;
      display: none;
    }
    @media(prefers-color-scheme:dark){
      :root {
        --bg: #111116;
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.08);
        --text: #e4e4eb;
        --text-secondary: #7a7a8e;
        --accent: #818cf8;
        --accent-hover: #6366f1;
        --success: #34d399;
        --danger: #f87171;
      }
      .card { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
      .user-info { background: rgba(255, 255, 255, 0.04); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>

    <h1>Sign in to Build Desktop</h1>
    <p class="subtitle">
      The Build desktop app is requesting access to your account.
    </p>

    <div class="user-info">
      <div class="user-avatar">{{ user_name[0] | upper if user_name else '?' }}</div>
      <div>
        <div class="user-detail">{{ user_name }}</div>
        <div class="user-label">Signing in as</div>
      </div>
    </div>

    <button class="btn" id="btn-approve">Approve</button>

    <div class="result" id="result"></div>
    <div class="timer" id="timer">Expires in <span id="countdown">{{ expires_in_s }}</span>s</div>
    <div class="close-hint" id="close-hint">You can close this tab and return to the app.</div>
  </div>

  <script nonce="{{ csp_nonce() }}">
    const code = "{{ code }}";
    let expiresIn = {{ expires_in_s }};

    const countdownEl = document.getElementById('countdown');
    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
    }
    countdownEl.textContent = formatTime(expiresIn);
    const timerInterval = setInterval(() => {
      expiresIn--;
      if (expiresIn <= 0) {
        clearInterval(timerInterval);
        showResult('error', 'Authorization expired. Please try again from the app.');
        document.getElementById('btn-approve').disabled = true;
      } else {
        countdownEl.textContent = formatTime(expiresIn);
      }
    }, 1000);

    function showResult(type, message) {
      const el = document.getElementById('result');
      el.className = 'result ' + type;
      el.textContent = message;
      document.getElementById('timer').style.display = 'none';
    }

    document.getElementById('btn-approve').addEventListener('click', async () => {
      const btn = document.getElementById('btn-approve');
      btn.disabled = true;
      btn.textContent = 'Authorizing...';

      try {
        const resp = await fetch(`/app-auth/approve/${code}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });

        if (resp.ok) {
          showResult('success', 'Authorized! The app should sign you in now.');
          document.getElementById('close-hint').style.display = 'block';
          clearInterval(timerInterval);
        } else {
          const data = await resp.json();
          showResult('error', data.error || 'Authorization failed.');
          btn.disabled = false;
          btn.textContent = 'Approve';
        }
      } catch (err) {
        showResult('error', 'Network error: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Approve';
      }
    });
  </script>
</body>
</html>
