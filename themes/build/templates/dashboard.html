<!DOCTYPE html>
<!-- Build Dashboard. See planning/dashboard/. -->
<html lang="en" data-dashboard="v2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/static/build/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_url('build/dist/css/dashboard.css') }}">
</head>
<body data-user-name="{{ user_name }}">
  <div id="app"></div>
  <!-- Skrift notification SSE client — delivers the `sk:notification` events
       that BuildE2EE listens on for session_accept / data frames. -->
  <script src="/static/skrift/js/notifications.js" defer></script>
  <!-- libsodium (pre-minified vendor) — must load before BuildE2EE.ready(). -->
  <script src="/static/build/js/libsodium.js" defer></script>
  <script src="/static/build/js/libsodium-wrappers.js" defer></script>
  <!-- Dashboard bundle. -->
  <script src="{{ static_url('build/dist/js/dashboard.js') }}" defer></script>
</body>
</html>
