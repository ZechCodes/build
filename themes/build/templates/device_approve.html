<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approve Device — Build</title>
<link rel="icon" type="image/svg+xml" href="/static/build/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style nonce="{{ csp_nonce() }}">
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070a;
  --bg-elevated:#0e0e14;
  --surface:rgba(255,255,255,0.04);
  --surface-hover:rgba(255,255,255,0.07);
  --glass:rgba(255,255,255,0.03);
  --glass-border:rgba(255,255,255,0.06);
  --text:#e8e8ed;
  --text-secondary:#8b8b9e;
  --text-tertiary:#55556a;
  --accent:#818cf8;
  --accent-bright:#a5b4fc;
  --accent-dim:rgba(129,140,248,0.12);
  --green:#34d399;
  --red:#f87171;
  --cyan:#22d3ee;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono','Fira Code',monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html{font-size:16px}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::after{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Nav */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 clamp(1.5rem,4vw,3rem);
  height:64px;
  display:flex;align-items:center;
  background:rgba(7,7,10,0.7);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.nav-logo{
  display:flex;align-items:center;gap:.6rem;
  text-decoration:none;color:var(--text);
}
.nav-logo svg{width:28px;height:28px}
.nav-wordmark{
  font-family:var(--sans);
  font-size:18px;font-weight:700;
  letter-spacing:-0.03em;
}

/* Layout */
.approve-wrapper{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:5rem 2rem 2rem;
  position:relative;
}
#mesh{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0;will-change:transform;-webkit-transform:translateZ(0)}

/* Grid bg */
.approve-wrapper::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(129,140,248,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(129,140,248,.03) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, black 20%, transparent 70%);
}

/* Ambient glows */
.approve-glow{
  position:absolute;
  width:800px;height:600px;
  top:10%;left:50%;transform:translateX(-50%);
  background:radial-gradient(ellipse, rgba(99,102,241,.08) 0%, rgba(99,102,241,.02) 40%, transparent 70%);
  pointer-events:none;
}
.approve-glow-2{
  position:absolute;
  width:400px;height:400px;
  top:30%;left:20%;
  background:radial-gradient(circle, rgba(52,211,153,.04) 0%, transparent 60%);
  pointer-events:none;
}

/* Card */
.approve-card{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  background:rgba(14,14,20,.45);
  backdrop-filter:blur(3px) saturate(1.3);
  -webkit-backdrop-filter:blur(3px) saturate(1.3);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:2.5rem 2rem 2rem;
  text-align:center;
  animation:cardIn .5s var(--ease) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

.approve-card h1{
  font-family:var(--serif);
  font-size:24px;font-weight:400;
  margin-bottom:.35rem;
}
.approve-sub{
  font-size:13px;color:var(--text-secondary);
  margin-bottom:1.5rem;line-height:1.5;
}
.gradient-text{font-style:italic;background:linear-gradient(135deg,var(--accent-bright),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Device details */
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:.75rem 0;
  border-bottom:1px solid var(--glass-border);
}
.detail-row:last-of-type{border-bottom:none}
.detail-label{font-size:13px;color:var(--text-secondary);font-weight:500}
.detail-value{font-size:13px;font-weight:600;font-family:var(--mono)}

/* Actions */
.actions{display:flex;gap:.75rem;margin-top:1.5rem}
.btn{
  flex:1;
  padding:.75rem 1rem;
  border-radius:10px;
  font-size:14px;font-weight:600;
  font-family:var(--sans);
  cursor:pointer;border:none;
  transition:all .2s;
}
.btn-approve{background:var(--accent);color:#fff}
.btn-approve:hover{background:#6366f1;transform:translateY(-1px)}
.btn-deny{background:var(--surface);color:var(--text-secondary);border:1px solid var(--glass-border)}
.btn-deny:hover{background:rgba(248,113,113,.1);color:var(--red);border-color:rgba(248,113,113,.2)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* Result */
.result{
  margin-top:1.25rem;padding:.75rem 1rem;
  border-radius:10px;font-size:13px;font-weight:500;
  display:none;
}
.result.success{
  display:block;
  background:rgba(52,211,153,.1);color:var(--green);
  border:1px solid rgba(52,211,153,.15);
}
.result.error{
  display:block;
  background:rgba(248,113,113,.1);color:var(--red);
  border:1px solid rgba(248,113,113,.15);
}

/* Timer */
.timer{font-size:12px;color:var(--text-tertiary);margin-top:1rem}
.timer.hidden{display:none}

@media(max-width:600px){
  .approve-card{margin:1rem;padding:2rem 1.5rem 1.5rem}
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <svg viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="24" height="24" rx="6" fill="#818cf8" opacity=".15"/>
      <path d="M9 10h10M9 14h7M9 18h10" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="nav-wordmark">Build</span>
  </a>
</nav>

<canvas id="mesh"></canvas>

<div class="approve-wrapper">
  <div class="approve-glow"></div>
  <div class="approve-glow-2"></div>

  <div class="approve-card">
    <h1>Authorize <em class="gradient-text">Device</em></h1>
    <p class="approve-sub">A device is requesting access to your Build account. Review the details below and approve if you recognize this device.</p>

    <div class="detail-row">
      <span class="detail-label">Device Name</span>
      <span class="detail-value">{{ device_name }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Public Key</span>
      <span class="detail-value">{{ public_key_preview }}</span>
    </div>

    <div class="actions">
      <button class="btn btn-deny" id="btn-deny">Deny</button>
      <button class="btn btn-approve" id="btn-approve">Approve</button>
    </div>

    <div class="result" id="result"></div>
    <div class="timer" id="timer">Expires in <span id="countdown">{{ expires_in_s }}</span>s</div>
  </div>
</div>

<script nonce="{{ csp_nonce() }}">
  const code = "{{ code }}";
  let expiresIn = {{ expires_in_s }};

  const countdownEl = document.getElementById('countdown');
  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m > 0 ? m + 'm ' + sec + 's' : sec + 's';
  }
  countdownEl.textContent = formatTime(expiresIn);
  const timerInterval = setInterval(function() {
    expiresIn--;
    if (expiresIn <= 0) {
      clearInterval(timerInterval);
      showResult('error', 'Registration expired.');
      disableButtons();
    } else {
      countdownEl.textContent = formatTime(expiresIn);
    }
  }, 1000);

  function disableButtons() {
    document.getElementById('btn-approve').disabled = true;
    document.getElementById('btn-deny').disabled = true;
  }

  function showResult(type, message) {
    const el = document.getElementById('result');
    el.className = 'result ' + type;
    el.textContent = message;
    document.getElementById('timer').classList.add('hidden');
  }

  function approveDevice() {
    disableButtons();
    fetch('/api/devices/approve/' + code, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    })
    .then(function(resp) { return resp.json().then(function(data) { return { ok: resp.ok, data: data }; }); })
    .then(function(r) {
      if (r.ok) {
        showResult('success', 'Device "' + r.data.name + '" approved. The client should connect shortly.');
        clearInterval(timerInterval);
      } else {
        showResult('error', r.data.error || 'Approval failed.');
      }
    })
    .catch(function(err) {
      showResult('error', 'Network error: ' + err.message);
    });
  }

  function denyDevice() {
    disableButtons();
    fetch('/api/devices/pending/' + code, { method: 'DELETE' });
    showResult('error', 'Device denied.');
    clearInterval(timerInterval);
  }

  document.getElementById('btn-approve').addEventListener('click', approveDevice);
  document.getElementById('btn-deny').addEventListener('click', denyDevice);

// Mesh background
(function(){
  var c=document.getElementById('mesh');if(!c)return;var ctx=c.getContext('2d');
  var w,h,dpr;
  var GAP=180,SPAWN_INTERVAL=1400,EDGES_PER_BURST=2,EDGE_SPEED=0.5,PROPAGATE_CHANCE=0.35,MAX_PROPAGATE=3;
  var verts=[],edges=[],trails=[],lastSpawn=0,lastFrame=0;
  var TRAIL_DURATION=8000;
  function resize(){dpr=devicePixelRatio||1;w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr}
  function buildGrid(){verts=[];var g=GAP*dpr,rh=g*Math.sin(Math.PI/3),cols=Math.ceil(w/g)+2,rows=Math.ceil(h/rh)+2;for(var r=-1;r<rows;r++){var o=(r%2)?g*.5:0;for(var col=-1;col<cols;col++)verts.push({x:col*g+o,y:r*rh})}}
  function neighbors(v,exclude){var maxD=GAP*dpr*1.15,result=[];for(var i=0;i<verts.length;i++){var u=verts[i];if(u===v||u===exclude)continue;var dx=u.x-v.x,dy=u.y-v.y;if(Math.sqrt(dx*dx+dy*dy)<maxD)result.push(u)}return result}
  function spawnEdge(from,to,depth){var dx=to.x-from.x,dy=to.y-from.y,dist=Math.sqrt(dx*dx+dy*dy);edges.push({from:from,to:to,ox:from.x,oy:from.y,x:from.x,y:from.y,totalDist:dist,traveled:0,speed:(EDGE_SPEED+Math.random()*0.2)*dpr,alpha:0.22+Math.random()*0.08,life:1,arrived:false,depth:depth||0})}
  function spawnBurst(){var v=verts[(Math.random()*verts.length)|0],nb=neighbors(v);if(!nb.length)return;var shuffled=nb.sort(function(){return Math.random()-0.5}),count=Math.min(EDGES_PER_BURST,shuffled.length);for(var i=0;i<count;i++)spawnEdge(v,shuffled[i],0)}
  function draw(now){ctx.clearRect(0,0,w,h);var rawDt=lastFrame?now-lastFrame:16;var dt=Math.min(rawDt,32);lastFrame=now;if(now-lastSpawn>SPAWN_INTERVAL){spawnBurst();lastSpawn=now}
  for(var i=edges.length-1;i>=0;i--){var e=edges[i],px=e.x,py=e.y;if(!e.arrived){var dx=e.to.x-e.ox,dy=e.to.y-e.oy,angle=Math.atan2(dy,dx);var step=e.speed*(dt/16);e.x+=Math.cos(angle)*step;e.y+=Math.sin(angle)*step;e.traveled+=step;trails.push({x1:px,y1:py,x2:e.x,y2:e.y,alpha:e.alpha,born:now});if(e.traveled>=e.totalDist){e.x=e.to.x;e.y=e.to.y;e.arrived=true;if(e.depth<MAX_PROPAGATE){var nb=neighbors(e.to,e.from);for(var j=0;j<nb.length;j++){if(Math.random()<PROPAGATE_CHANCE)spawnEdge(e.to,nb[j],e.depth+1)}}}}else{edges.splice(i,1);continue}ctx.beginPath();ctx.arc(e.x,e.y,2.5*dpr,0,Math.PI*2);ctx.fillStyle='rgba(129,140,248,'+(e.alpha*0.8)+')';ctx.fill()}
  for(var i=trails.length-1;i>=0;i--){var t=trails[i],age=now-t.born,life=1-age/TRAIL_DURATION;if(life<=0){trails.splice(i,1);continue}var a=t.alpha*life;ctx.beginPath();ctx.moveTo(t.x1,t.y1);ctx.lineTo(t.x2,t.y2);ctx.strokeStyle='rgba(129,140,248,'+a+')';ctx.lineWidth=(0.6+life*0.8)*dpr;ctx.stroke()}
  requestAnimationFrame(draw)}
  var simTime=performance.now()-TRAIL_DURATION;function simStep(){simTime+=16;for(var i=edges.length-1;i>=0;i--){var e=edges[i],px=e.x,py=e.y;if(!e.arrived){var dx=e.to.x-e.ox,dy=e.to.y-e.oy,angle=Math.atan2(dy,dx);e.x+=Math.cos(angle)*e.speed;e.y+=Math.sin(angle)*e.speed;e.traveled+=e.speed;trails.push({x1:px,y1:py,x2:e.x,y2:e.y,alpha:e.alpha,born:simTime});if(e.traveled>=e.totalDist){e.x=e.to.x;e.y=e.to.y;e.arrived=true;if(e.depth<MAX_PROPAGATE){var nb=neighbors(e.to,e.from);for(var j=0;j<nb.length;j++){if(Math.random()<PROPAGATE_CHANCE)spawnEdge(e.to,nb[j],e.depth+1)}}}}else{edges.splice(i,1)}}for(var i=trails.length-1;i>=0;i--){if(simTime-trails[i].born>TRAIL_DURATION)trails.splice(i,1)}}
  addEventListener('resize',function(){resize();buildGrid();edges=[];trails=[]});resize();buildGrid();
  var totalPreFrames=Math.ceil(TRAIL_DURATION/16);var burstEvery=Math.ceil(SPAWN_INTERVAL/16);
  for(var f=0;f<totalPreFrames;f++){if(f%burstEvery===0)spawnBurst();simStep()}
  requestAnimationFrame(draw)
})();
</script>

</body>
</html>
