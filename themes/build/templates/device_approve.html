<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approve Device — Build</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f2f5;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.5);
      --text: #1e293b;
      --text-secondary: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .icon svg {
      width: 28px;
      height: 28px;
      stroke: white;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .detail-row:last-of-type { border-bottom: none; }
    .detail-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .detail-value {
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    .btn {
      flex: 1;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-approve {
      background: var(--accent);
      color: white;
    }
    .btn-approve:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-deny {
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-secondary);
    }
    .btn-deny:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }
    .result.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
    }
    .result.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }
    .timer {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>

    <h1>Authorize Device</h1>
    <p class="subtitle">
      A device is requesting access to your Build account.
      Review the details below and approve if you recognize this device.
    </p>

    <div class="detail-row">
      <span class="detail-label">Device Name</span>
      <span class="detail-value">{{ device_name }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Public Key</span>
      <span class="detail-value">{{ public_key_preview }}</span>
    </div>

    <div class="actions">
      <button class="btn btn-deny" id="btn-deny" onclick="denyDevice()">Deny</button>
      <button class="btn btn-approve" id="btn-approve" onclick="approveDevice()">Approve</button>
    </div>

    <div class="result" id="result"></div>
    <div class="timer" id="timer">Expires in <span id="countdown">{{ expires_in_s }}</span>s</div>
  </div>

  <script>
    const code = "{{ code }}";
    let expiresIn = {{ expires_in_s }};

    // Countdown timer
    const countdownEl = document.getElementById('countdown');
    const timerInterval = setInterval(() => {
      expiresIn--;
      if (expiresIn <= 0) {
        clearInterval(timerInterval);
        showResult('error', 'Registration expired.');
        disableButtons();
      } else {
        countdownEl.textContent = expiresIn;
      }
    }, 1000);

    function disableButtons() {
      document.getElementById('btn-approve').disabled = true;
      document.getElementById('btn-deny').disabled = true;
    }

    function showResult(type, message) {
      const el = document.getElementById('result');
      el.className = 'result ' + type;
      el.textContent = message;
      document.getElementById('timer').style.display = 'none';
    }

    async function approveDevice() {
      disableButtons();
      try {
        const resp = await fetch(`/api/devices/approve/${code}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const data = await resp.json();
        if (resp.ok) {
          showResult('success', `Device "${data.name}" approved. The client should connect shortly.`);
          clearInterval(timerInterval);
        } else {
          showResult('error', data.error || 'Approval failed.');
        }
      } catch (err) {
        showResult('error', 'Network error: ' + err.message);
      }
    }

    function denyDevice() {
      disableButtons();
      fetch(`/api/devices/pending/${code}`, { method: 'DELETE' });
      showResult('error', 'Device denied.');
      clearInterval(timerInterval);
    }
  </script>
</body>
</html>
