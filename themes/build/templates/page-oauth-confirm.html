<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Waitlist — Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#07070a;color:#e8e8ed;
  font-family:'DM Sans',system-ui,sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;
  overflow:hidden;
}
canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}
.logo{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:.5rem;
  margin-bottom:3rem;
  font-size:15px;font-weight:600;color:#8b8b9e;
  letter-spacing:0.02em;
  text-decoration:none;
}
.logo svg{opacity:.7}
.content{
  max-width:400px;width:100%;
  text-align:center;
  position:relative;z-index:1;
}
h1{
  font-family:'Instrument Serif',Georgia,serif;
  font-size:32px;font-weight:400;
  letter-spacing:-0.02em;
  line-height:1.2;
  margin-bottom:1rem;
}
h1 em{font-style:italic;color:#818cf8}
.subtitle{
  font-size:15px;color:#8b8b9e;line-height:1.7;
  margin-bottom:2rem;
}
.subtitle strong{color:#e8e8ed;font-weight:500}
.cta{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.8rem 2.25rem;
  border-radius:10px;
  font-size:14px;font-weight:600;
  text-decoration:none;
  transition:all .25s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;border:none;
  font-family:inherit;
}
.cta-primary{
  background:#818cf8;color:#fff;
  box-shadow:0 0 0 1px rgba(129,140,248,0.3),0 4px 16px rgba(129,140,248,0.15);
}
.cta-primary:hover{
  background:#6366f1;
  box-shadow:0 0 0 1px rgba(99,102,241,0.5),0 8px 32px rgba(99,102,241,0.25);
  transform:translateY(-1px);
}
.cta-primary svg{transition:transform .2s}
.cta-primary:hover svg{transform:translateX(2px)}
.skip{
  display:block;
  margin-top:1rem;
  font-size:13px;color:#55556a;
  text-decoration:none;
  transition:color .2s;
}
.skip:hover{color:#8b8b9e}
.check{
  display:inline-flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:50%;
  background:rgba(52,211,153,0.1);
  margin-bottom:1.25rem;
}
.check svg{color:#34d399}
</style>
</head>
<body>

<canvas id="mesh"></canvas>

<a class="logo" href="/">
  <svg width="18" height="18" viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="24" height="24" rx="6" fill="#818cf8" opacity=".15"/><path d="M9 10h10M9 14h7M9 18h10" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/></svg>
  Build
</a>

<div class="content">
  {% if already_signed_up %}
  <div class="check">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>You're already <em>in</em></h1>
  <p class="subtitle">We'll notify <strong>{{ email }}</strong> as soon as Build is ready.</p>
  <a class="cta cta-primary" href="/">
    Back to getbuild.ing
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>

  {% else %}
  <h1>Join the <em>waitlist</em></h1>
  <p class="subtitle">We'll send early access updates to<br><strong>{{ email }}</strong></p>
  <a class="cta cta-primary" href="/signup/oauth-join">
    Looks good, sign me up
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>
  <a class="skip" href="/">That's not my email</a>
  {% endif %}
</div>

<script>
(function(){
  const c = document.getElementById('mesh');
  if(!c) return;
  const ctx = c.getContext('2d');
  let w, h, dpr;

  const GAP = 180;
  const SPAWN_INTERVAL = 1400;
  const EDGES_PER_BURST = 2;
  const EDGE_SPEED = 0.5;
  const PROPAGATE_CHANCE = 0.35;
  const MAX_PROPAGATE = 3;

  let verts = [], edges = [], trails = [], lastSpawn = 0;

  function resize(){
    dpr = window.devicePixelRatio || 1;
    w = c.width = window.innerWidth * dpr;
    h = c.height = window.innerHeight * dpr;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
  }

  function buildGrid(){
    verts = [];
    const g = GAP * dpr;
    const rowH = g * Math.sin(Math.PI / 3);
    const cols = Math.ceil(w / g) + 2;
    const rows = Math.ceil(h / rowH) + 2;
    for(let r = -1; r < rows; r++){
      const off = (r % 2) ? g * 0.5 : 0;
      for(let col = -1; col < cols; col++){
        verts.push({ x: col * g + off, y: r * rowH });
      }
    }
  }

  function neighbors(v, exclude){
    // Find actual hex neighbors (within ~1.1x gap distance)
    const maxD = GAP * dpr * 1.15;
    const result = [];
    for(const u of verts){
      if(u === v || u === exclude) continue;
      const dx = u.x - v.x, dy = u.y - v.y;
      if(Math.sqrt(dx*dx + dy*dy) < maxD) result.push(u);
    }
    return result;
  }

  function spawnEdge(from, to, depth){
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    edges.push({
      from, to,
      ox: from.x, oy: from.y,
      x: from.x, y: from.y,
      totalDist: dist,
      traveled: 0,
      speed: (EDGE_SPEED + Math.random() * 0.2) * dpr,
      alpha: 0.22 + Math.random() * 0.08,
      life: 1,
      arrived: false,
      depth: depth || 0
    });
  }

  function spawnBurst(){
    const v = verts[(Math.random() * verts.length)|0];
    const nb = neighbors(v);
    if(!nb.length) return;
    // Pick random neighbors to send edges to
    const shuffled = nb.sort(() => Math.random() - 0.5);
    const count = Math.min(EDGES_PER_BURST, shuffled.length);
    for(let i = 0; i < count; i++) spawnEdge(v, shuffled[i], 0);
  }

  function draw(now){
    ctx.clearRect(0, 0, w, h);

    if(now - lastSpawn > SPAWN_INTERVAL){ spawnBurst(); lastSpawn = now; }

    // Update edges
    for(let i = edges.length - 1; i >= 0; i--){
      const e = edges[i];
      const px = e.x, py = e.y;

      if(!e.arrived){
        const dx = e.to.x - e.ox, dy = e.to.y - e.oy;
        const angle = Math.atan2(dy, dx);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
        e.traveled += e.speed;

        // Record trail segment
        trails.push({ x1: px, y1: py, x2: e.x, y2: e.y, alpha: e.alpha, life: 1 });

        if(e.traveled >= e.totalDist){
          e.x = e.to.x; e.y = e.to.y;
          e.arrived = true;
          if(e.depth < MAX_PROPAGATE){
            const nb = neighbors(e.to, e.from);
            for(const u of nb){
              if(Math.random() < PROPAGATE_CHANCE)
                spawnEdge(e.to, u, e.depth + 1);
            }
          }
        }
      } else {
        edges.splice(i, 1); continue;
      }

      // Glow at tip
      ctx.beginPath();
      ctx.arc(e.x, e.y, 2.5 * dpr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(129,140,248,' + (e.alpha * 0.8) + ')';
      ctx.fill();
    }

    // Draw and fade trails
    for(let i = trails.length - 1; i >= 0; i--){
      const t = trails[i];
      t.life -= 0.006;
      if(t.life <= 0){ trails.splice(i, 1); continue; }
      const a = t.alpha * t.life;
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1);
      ctx.lineTo(t.x2, t.y2);
      ctx.strokeStyle = 'rgba(129,140,248,' + a + ')';
      ctx.lineWidth = (0.6 + t.life * 0.8) * dpr;
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }

  function simStep(){
    // Simulate one frame of edge movement and trail fading
    for(let i = edges.length - 1; i >= 0; i--){
      const e = edges[i];
      const px = e.x, py = e.y;
      if(!e.arrived){
        const dx = e.to.x - e.ox, dy = e.to.y - e.oy;
        const angle = Math.atan2(dy, dx);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
        e.traveled += e.speed;
        trails.push({ x1: px, y1: py, x2: e.x, y2: e.y, alpha: e.alpha, life: 1 });
        if(e.traveled >= e.totalDist){
          e.x = e.to.x; e.y = e.to.y;
          e.arrived = true;
          if(e.depth < MAX_PROPAGATE){
            const nb = neighbors(e.to, e.from);
            for(const u of nb){
              if(Math.random() < PROPAGATE_CHANCE)
                spawnEdge(e.to, u, e.depth + 1);
            }
          }
        }
      } else { edges.splice(i, 1); }
    }
    for(let i = trails.length - 1; i >= 0; i--){
      trails[i].life -= 0.006;
      if(trails[i].life <= 0) trails.splice(i, 1);
    }
  }

  window.addEventListener('resize', function(){ resize(); buildGrid(); edges = []; trails = []; });
  resize(); buildGrid();
  // Pre-warm: simulate ~8 bursts with frame steps between them
  for(let b = 0; b < 8; b++){
    spawnBurst();
    for(let f = 0; f < 120; f++) simStep();
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
