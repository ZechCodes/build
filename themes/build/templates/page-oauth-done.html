<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're In — Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#07070a;color:#e8e8ed;
  font-family:'DM Sans',system-ui,sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;top:-40%;left:50%;transform:translateX(-50%);
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(52,211,153,0.06) 0%,transparent 70%);
  pointer-events:none;
}
.logo{
  display:flex;align-items:center;gap:.5rem;
  margin-bottom:3rem;
  font-size:15px;font-weight:600;color:#8b8b9e;
  letter-spacing:0.02em;
  text-decoration:none;
}
.logo svg{opacity:.7}
.content{
  max-width:400px;width:100%;
  text-align:center;
}
.check{
  display:inline-flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:50%;
  background:rgba(52,211,153,0.1);
  margin-bottom:1.25rem;
}
.check svg{color:#34d399}
h1{
  font-family:'Instrument Serif',Georgia,serif;
  font-size:32px;font-weight:400;
  letter-spacing:-0.02em;
  line-height:1.2;
  margin-bottom:1rem;
}
h1 em{font-style:italic;color:#34d399}
.subtitle{
  font-size:15px;color:#8b8b9e;line-height:1.7;
  margin-bottom:2rem;
}
.subtitle strong{color:#e8e8ed;font-weight:500}
.cta{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.8rem 2.25rem;
  border-radius:10px;
  font-size:14px;font-weight:600;
  text-decoration:none;
  transition:all .25s cubic-bezier(0.16,1,0.3,1);
  background:#818cf8;color:#fff;
  box-shadow:0 0 0 1px rgba(129,140,248,0.3),0 4px 16px rgba(129,140,248,0.15);
}
.cta:hover{
  background:#6366f1;
  box-shadow:0 0 0 1px rgba(99,102,241,0.5),0 8px 32px rgba(99,102,241,0.25);
  transform:translateY(-1px);
}
.cta svg{transition:transform .2s}
.cta:hover svg{transform:translateX(2px)}
</style>
</head>
<body>

<a class="logo" href="/">
  <svg width="18" height="18" viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="24" height="24" rx="6" fill="#818cf8" opacity=".15"/><path d="M9 10h10M9 14h7M9 18h10" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/></svg>
  Build
</a>

<div class="content">
  <div class="check">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>You're <em>in</em></h1>
  <p class="subtitle">We'll notify <strong>{{ email }}</strong> as soon as Build is ready. Thanks for signing up!</p>
  <a class="cta" href="/">
    Back to getbuild.ing
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>
</div>

</body>
</html>
