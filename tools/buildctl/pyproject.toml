[project]
name = "buildctl"
version = "0.1.0"
description = "Explicit environment management for Build"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
buildctl = "buildctl.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["buildctl"]

[tool.hatch.build.targets.wheel.force-include]
"environments.toml" = "buildctl/environments.toml"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
